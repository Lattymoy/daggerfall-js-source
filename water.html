<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Water lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e9e4d9; font: 13px system-ui, sans-serif; }
    #c { display: block; width: 100vw; height: 100vh; }
    #panel { position: fixed; left: 10px; top: 10px; background: rgba(14,16,19,0.85); padding: 10px 12px; border: 1px solid #2b323b; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; }
    #panel input[type=range] { width: 180px; }
    #panel .v { min-width: 4ch; text-align: right; color: #c08a3e; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="panel">
    <label for="hour">Hour</label><input id="hour" type="range" min="0" max="24" step="0.05" value="10" /><span class="v" id="hourV"></span>
    <label for="weather">Weather</label><select id="weather"><option>sunny</option><option>cloudy</option><option>overcast</option><option>fog</option><option>rain</option><option>snow</option><option>thunder</option></select><span></span>
    <label for="wind">Wind</label><input id="wind" type="range" min="0" max="1" step="0.01" value="0.4" /><span class="v" id="windV"></span>
    <label for="rain">Rain</label><input id="rain" type="range" min="0" max="1" step="0.01" value="0" /><span class="v" id="rainV"></span>
    <label for="yaw">Yaw</label><input id="yaw" type="range" min="-180" max="180" step="1" value="0" /><span class="v" id="yawV"></span>
    <label for="pitch">Pitch</label><input id="pitch" type="range" min="-60" max="30" step="1" value="-14" /><span class="v" id="pitchV"></span>
    <label for="height">Eye height</label><input id="height" type="range" min="2" max="120" step="1" value="14" /><span class="v" id="heightV"></span>
    <label for="water">Water</label><input id="water" type="checkbox" checked /><span class="v">the pass (<code>?water=off</code>)</span>
  </div>
  <script type="module" src="/src/tools/waterLab.js"></script>
</body>
</html>
