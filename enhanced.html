<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Daggerfall Enhanced — UI prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── TOKENS ────────────────────────────────────────────────
         Brass and verdigris are Daggerfall's own: its chrome is carved
         stone with brass fittings, and verdigris is what brass becomes.
         The ground is a blue-black rather than a true black — Skyrim's
         void is right for a cold empty north and wrong for the Iliac
         Bay, which is a place with weather in it. */
      :root {
        --ink: #0e1013;
        --slate: #171b21;
        --iron: #2b323b;
        --bone: #e9e4d9;
        --dim: #8b8578;
        --brass: #c08a3e;
        --blood: #8c3a32;
        --verdigris: #4e7f72;

        --display: 'Cormorant', Georgia, serif;
        --data: 'Barlow Semi Condensed', system-ui, sans-serif;

        --rail: 168px;
        --list: minmax(240px, 1fr);
        --gap: 1px;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--ink);
        color: var(--bone);
        font-family: var(--data);
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      button:focus-visible, .node:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

      #app {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        height: 100dvh;
      }

      /* ── THE PLAY HUD ──────────────────────────────────────────
         Three bars, hairline thin, and nothing else. Everything that
         used to live here is one press away. */
      .hud { padding: 10px 16px 0; }
      .hudbars { display: flex; gap: 6px; }
      .hudbar { flex: 1; height: 3px; background: var(--iron); overflow: hidden; }
      .hudfill { height: 100%; }
      .hudfill.blood { background: var(--blood); }
      .hudfill.verdigris { background: var(--verdigris); }
      .hudfill.brass { background: var(--brass); }

      /* ── HEADER ────────────────────────────────────────────────── */
      .top {
        display: flex; align-items: baseline; justify-content: space-between;
        gap: 16px; padding: 14px 16px 16px;
      }
      .who-name {
        font-family: var(--display); font-weight: 300;
        font-size: clamp(22px, 4.4vw, 34px); line-height: 1;
        letter-spacing: 0.01em;
      }
      .who-sub {
        color: var(--dim); font-size: 12px; letter-spacing: 0.16em;
        text-transform: uppercase; margin-top: 6px;
      }
      .purse { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
      .purse-n { font-variant-numeric: tabular-nums; font-weight: 600; }
      .purse-l { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 10px; }

      /* ── PANES ─────────────────────────────────────────────────
         Three on a desk, one at a time on a phone. The LOGIC does not
         change between them, which is the whole claim of the layout. */
      .body { min-height: 0; }
      .panes {
        display: grid; grid-template-columns: var(--rail) var(--list) minmax(280px, 1.1fr);
        gap: var(--gap); background: var(--iron); height: 100%; min-height: 0;
      }
      .panes.wide { grid-template-columns: 1fr 1fr 1fr; }
      .rail, .list, .detail, .col { background: var(--slate); overflow-y: auto; min-height: 0; }

      /* ── CATEGORY RAIL ─────────────────────────────────────────
         Thirty groups, scrolling. Tabs would have fitted eight and
         buried the rest, which is how Daggerfall's density gets lost. */
      .railbtn {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        width: 100%; padding: 11px 14px; text-align: left;
        border-left: 2px solid transparent; color: var(--dim);
        font-size: 13px; letter-spacing: 0.02em;
      }
      .railbtn.empty { opacity: 0.38; }
      .railbtn:hover { color: var(--bone); background: #1c212880; }
      .railbtn.on { color: var(--bone); border-left-color: var(--brass); background: #1e242c; }
      .count { font-size: 11px; color: var(--brass); font-variant-numeric: tabular-nums; }

      /* ── LIST ──────────────────────────────────────────────────── */
      .row {
        display: flex; justify-content: space-between; gap: 12px; width: 100%;
        padding: 13px 16px; text-align: left; border-bottom: 1px solid #20262e;
      }
      .row:hover { background: #1c2128; }
      .row.on { background: #1e242c; box-shadow: inset 2px 0 0 var(--brass); }
      .row-name { font-weight: 500; }
      .row-note { color: var(--dim); font-size: 12px; margin-top: 3px; }
      .row-side { text-align: right; white-space: nowrap; }
      .row-val { color: var(--brass); font-variant-numeric: tabular-nums; font-size: 13px; }
      .row-w { color: var(--dim); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; }

      .empty-state { padding: 28px 16px; color: var(--dim); }
      .empty-state p { margin: 0 0 6px; }
      .empty-state .dim { font-size: 13px; opacity: 0.7; }

      /* ── THE SLOT MAP ──────────────────────────────────────────
         The signature. Twenty-eight slots as an information graphic
         rather than a picture of a person: filled nodes are lit, and
         the whole state of a kit reads in one glance. */
      .slotmap { padding: 20px 16px 12px; }
      .figure {
        position: relative; width: min(220px, 62%); aspect-ratio: 1 / 1.55;
        margin: 0 auto;
      }
      .figure svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .figure svg line { stroke: var(--iron); stroke-width: 0.6; }
      .node {
        position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
        border: 1px solid var(--iron); background: var(--ink);
        border-radius: 50%; padding: 0; transition: transform 0.12s ease;
      }
      .node.on { background: var(--brass); border-color: var(--brass); box-shadow: 0 0 0 3px #c08a3e22; }
      .node:hover { transform: scale(1.45); }
      .slotcap {
        display: flex; gap: 6px; justify-content: center; align-items: baseline;
        margin-top: 14px; font-size: 12px;
      }
      .slotcap .k { color: var(--brass); font-variant-numeric: tabular-nums; font-weight: 600; }
      .slotcap .v { color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; }

      /* ── DETAIL CARD ───────────────────────────────────────────── */
      .card { padding: 4px 20px 24px; border-top: 1px solid var(--iron); margin-top: 12px; }
      .card-kicker {
        color: var(--brass); font-size: 11px; letter-spacing: 0.18em;
        text-transform: uppercase; margin: 18px 0 8px;
      }
      .card h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 6px; }
      .card-note { color: var(--dim); font-size: 13px; margin: 0 0 18px; }
      .stats { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 22px; }
      .stats dt { color: var(--dim); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
      .stats dd { margin: 0; font-variant-numeric: tabular-nums; }
      .acts { display: flex; gap: 8px; flex-wrap: wrap; }
      .act {
        padding: 11px 18px; border: 1px solid var(--iron); color: var(--dim);
        letter-spacing: 0.06em; min-height: 44px;
      }
      .act:hover { color: var(--bone); border-color: var(--dim); }
      .act.primary { border-color: var(--brass); color: var(--brass); }
      .act.primary:hover { background: var(--brass); color: var(--ink); }

      /* ── CHARACTER ─────────────────────────────────────────────── */
      .col { padding: 20px 18px 28px; }
      .colhead {
        font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--dim); margin: 0 0 18px; font-weight: 500;
      }
      .attr { margin-bottom: 15px; }
      .attr-k { font-size: 14px; }
      .attr-v { float: right; font-variant-numeric: tabular-nums; color: var(--brass); font-weight: 600; }
      .attr-track { height: 2px; background: var(--iron); margin-top: 7px; }
      .attr-fill { height: 100%; background: var(--bone); opacity: 0.55; }
      .skill { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #20262e; }
      .skill-k { color: var(--dim); font-size: 14px; }
      .skill.raised .skill-k { color: var(--bone); }
      .skill-v { font-variant-numeric: tabular-nums; }
      .skill.raised .skill-v { color: var(--brass); }
      .more {
        margin-top: 16px; padding: 11px 0; color: var(--brass); font-size: 13px;
        letter-spacing: 0.06em; border-bottom: 1px solid var(--iron); width: 100%; text-align: left;
        min-height: 44px;
      }
      .bar { margin-bottom: 16px; }
      .bar-head { display: flex; justify-content: space-between; align-items: baseline; }
      .bar-label { font-size: 13px; }
      .bar-num { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .bar-track { height: 4px; background: var(--iron); margin-top: 7px; }
      .bar-fill { height: 100%; }
      .bar-fill.blood { background: var(--blood); }
      .bar-fill.verdigris { background: var(--verdigris); }
      .bar-fill.brass { background: var(--brass); }

      .placeholder { padding: 60px 24px; background: var(--slate); height: 100%; }
      .placeholder h2 { font-family: var(--display); font-weight: 300; font-size: 32px; margin: 0 0 10px; }
      .placeholder p { color: var(--dim); margin: 0; max-width: 46ch; }

      /* ── NAV ───────────────────────────────────────────────────── */
      .nav {
        display: flex; gap: 2px; padding: 0 16px 16px;
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .navbtn {
        flex: 1; padding: 13px 6px; min-height: 48px;
        border-top: 2px solid var(--iron); color: var(--dim);
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
      }
      .navbtn:hover { color: var(--bone); }
      .navbtn.on { color: var(--brass); border-top-color: var(--brass); }

      /* ── PHONE ─────────────────────────────────────────────────
         One pane at a time and the rail on top of the list, because a
         phone has one column whatever you do. The nav is already at the
         bottom, which is where a thumb is — that is the single biggest
         change a phone forces, and the reason it is at the bottom on
         the desktop too rather than moving. */
      /* The close control only exists on a phone, where the detail is a
         sheet. On a desk the detail is a column and never needs closing. */
      .sheet-close { display: none; }

      @media (max-width: 860px) {
        .panes, .panes.wide { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
        .rail {
          display: flex; overflow-x: auto; overflow-y: hidden;
          scrollbar-width: none; -webkit-overflow-scrolling: touch;
        }
        .rail::-webkit-scrollbar { display: none; }
        .railbtn {
          width: auto; white-space: nowrap; border-left: 0; border-bottom: 2px solid transparent;
          padding: 12px 15px; min-height: 46px;
        }
        .railbtn.on { border-left: 0; border-bottom-color: var(--brass); }
        /* THE DETAIL IS A SHEET. One column means a detail placed below a
           list is a detail nobody scrolls to — so it comes up over the
           list, raised by the same tap that chose the item. */
        .detail {
          position: fixed; left: 0; right: 0; bottom: 0;
          max-height: 78dvh; z-index: 20;
          transform: translateY(101%); transition: transform 0.22s ease;
          border-top: 1px solid var(--brass);
          padding-bottom: max(76px, calc(env(safe-area-inset-bottom) + 76px));
        }
        .detail.open { transform: translateY(0); }
        .sheet-close {
          display: block; width: 100%; padding: 14px; min-height: 48px;
          color: var(--dim); font-size: 12px; letter-spacing: 0.16em;
          text-transform: uppercase; border-bottom: 1px solid var(--iron);
        }
        .card { border-top: 0; margin-top: 0; }
        .card-kicker { margin-top: 20px; }
        .figure { width: min(190px, 54%); }
        .panes.wide .col:nth-child(2) { border-top: 1px solid var(--iron); }
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tools/enhancedUI.js"></script>
  </body>
</html>
