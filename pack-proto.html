<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pack prototype - grid, armour tab, height</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=Cormorant:wght@500;600&display=swap" rel="stylesheet">
<!--
  THE ENHANCED PACK PROTOTYPE (Mac, 2026-08-31): "more height, a proper
  grid based inventory, armor its own tab."

  SECOND CUT. The first designed a NEW window - its own palette, its own
  type, its own furniture - and Mac's note was that it veered too far
  from what is in the game. So this one IS the live pack: the tokens are
  ENHANCED_TOKENS verbatim (enhancedStyle.js:34-50), and the classes and
  rules below are copied out of that stylesheet rather than invented -
  .packtabs/.packtab (:606-612), .packcol (:532), .itemrow's hover and
  selection (:615-620), .tile's "no border once a real sprite is in it"
  (:621-628), .packbar (:2283-2290), the .pack-shell frame (:2012-2020).

  ONLY THREE THINGS DIFFER, which are the three that were asked for:
    1. HEIGHT - the shell is taller (knob).
    2. GRID   - .packgrid replaces the .itemrow list (knob for cell size).
    3. ARMOUR - a fifth tab, split out of weapons.
  Anywhere else this does not look like the pack does now is a bug in
  the prototype, not a proposal.
-->
<style>
/* ── TOKENS: ENHANCED_TOKENS, verbatim ──────────────────────────── */
:root {
  --ink: #0e1013;
  --slate: #171b21;
  --iron: #2b323b;
  --bone: #e9e4d9;
  --dim: #8b8578;
  --brass: #c08a3e;
  --blood: #8c3a32;
  --verdigris: #4e7f72;

  --display: 'Cormorant', Georgia, serif;
  --data: 'Barlow Semi Condensed', system-ui, sans-serif;

  --side: 264px;
  --gap: 1px;

  /* THE TWO KNOBS - the only numbers this page invents */
  --pack-h: 78vh;
  --cell: 74px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--bone); font-family: var(--data);
  font-size: 15px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 16px; }
.note { color: var(--dim); font-size: 12.5px; letter-spacing: .04em; margin: 0 0 12px; }
.knobs { display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
  border: 1px solid var(--iron); padding: 8px 12px; margin: 0 0 14px; }
.knobs label { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 13px; }
.knobs output { color: var(--brass); min-width: 50px; }

/* ── THE SHELL (.pack-shell :2012-2020) ─────────────────────────── */
.pack-shell { border: 1px solid var(--iron); background: var(--iron);
  display: flex; flex-direction: column; gap: var(--gap);
  height: var(--pack-h); min-height: 420px; }        /* (1) HEIGHT */
.pack-main { flex: 0 0 auto; display: grid;
  grid-template-columns: var(--side) 1fr; gap: var(--gap); }
.pack-dock { flex: 1 1 auto; min-height: 100px; display: flex; gap: var(--gap); }
.packcol { background: var(--slate); overflow: auto; padding: 14px 18px 18px; min-height: 0; }

.packhead { display: flex; align-items: baseline; gap: 14px; }
.packhead .who { font-family: var(--display); font-size: 21px; }
.slotcount { color: var(--dim); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; margin: 0 0 10px; }
.slotrow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px;
  border-bottom: 1px solid #1b2027; font-size: 13.5px; }
.slotrow .k { color: var(--dim); }
.slotrow.off .v { color: #4a4740; }

/* ── THE TABS (.packtabs/.packtab :606-612, verbatim) ───────────── */
.packtabs { display: flex; gap: 2px; margin: 0; flex-wrap: wrap; }
.packtab { flex: 1 1 auto; padding: 10px 12px; min-height: 44px; text-align: center;
  border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
  color: var(--dim); font-family: var(--data); font-size: 13px; }
.packtab.on { color: var(--brass); border-bottom-color: var(--brass); }
.packtab .count { display: block; font-size: 10px; color: var(--dim);
  font-variant-numeric: tabular-nums; }

/* ── (2) THE GRID, in place of the .itemrow list ────────────────── */
.listcol { background: var(--slate); flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; }
.packgrid { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px 18px;
  display: grid; gap: 8px; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); }
/* the cell keeps .tile's language: a 1px iron box, and NO box once a
   real sprite is in it - ":621-628, a box round it makes it look like
   a placeholder, which is what it replaced". Hover and selection are
   .itemrow's own (:619-620). */
.gcell { position: relative; aspect-ratio: 1; border: 1px solid var(--iron);
  background: transparent; cursor: pointer; display: grid; place-items: center; padding: 4px; }
.gcell:hover { background: #12161b; }
.gcell.on { background: #12161b; box-shadow: inset 2px 0 0 var(--brass); }
.gcell.has-icon { border-color: transparent; }
.gcell .g { font-size: 22px; color: var(--dim); }
.gcell .qty { position: absolute; right: 4px; bottom: 3px; font-size: 11px;
  color: var(--bone); font-variant-numeric: tabular-nums; }
.gcell .ench { position: absolute; left: 4px; top: 3px; font-size: 10px; color: var(--verdigris); }
.gcell .nm { position: absolute; left: 2px; right: 2px; bottom: 2px; font-size: 10px;
  text-align: center; color: var(--dim); background: #171b21cc;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { grid-column: 1 / -1; color: var(--dim); padding: 22px; text-align: center; }

/* ── THE BAR (.packbar :2283-2290) ──────────────────────────────── */
.packbar { flex: 0 0 auto; display: flex; align-items: center; gap: 22px;
  padding: 10px 16px; background: var(--slate); }
.packbar .k { color: #7d7460; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; }
.packbar .v { font-size: 16px; text-shadow: 2px 2px 0 rgba(0,0,0,0.85); }
.px-meter { flex: 1 1 auto; max-width: 260px; height: 6px; background: #1b2027; }
.px-fill { height: 100%; background: var(--verdigris); }
.px-fill.blood { background: var(--blood); }
</style>
</head>
<body>
<div class="wrap">
  <p class="note">
    The live pack's own tokens and classes. Three things differ, and only three:
    the shell's height, a grid in place of the row list, and the Armour tab.
  </p>

  <div class="knobs">
    <label>Height <input id="kh" type="range" min="52" max="94" value="78"><output id="oh">78vh</output></label>
    <label>Cell <input id="kc" type="range" min="48" max="120" value="74"><output id="oc">74px</output></label>
    <label><input id="knm" type="checkbox" checked> names on cells</label>
  </div>

  <div class="pack-shell">
    <div class="pack-main">
      <div class="packcol">
        <header class="packhead"><span class="who">Bereditte Jastal</span></header>
        <p class="slotcount">Breton &middot; Knight</p>
        <div id="chars"></div>
      </div>
      <div class="packcol">
        <p class="slotcount" id="wornhead">Equipped</p>
        <div id="worn"></div>
      </div>
    </div>
    <div class="pack-dock">
      <div class="listcol">
        <nav class="packtabs" id="tabs"></nav>
        <div class="packgrid" id="grid"></div>
      </div>
    </div>
    <footer class="packbar">
      <span class="k">Carry</span><span class="v">148 / 220</span>
      <span class="px-meter"><span class="px-fill" style="width:67%"></span></span>
      <span class="k">Gold</span><span class="v">1,204</span>
    </footer>
  </div>
</div>

<script type="module">
// ── (3) THE TAB SET ──────────────────────────────────────────────
// The live pack imports TABS and filterByTab from nativeInventory.js,
// which is DFU's FOUR-tab rule (weapons = Weapons OR Armor). Splitting
// armour out means the enhanced pack needs its OWN set, so the classic
// window's law stays exactly as DFU wrote it.
//
// SHIELDS: a shield IS group Armor in Daggerfall (Buckler 109, Round
// 110, Kite 111, Tower 112), so "armour plus shields" is one predicate.
const TABS = [
  { id: 'weapons', label: 'Weapons' },
  { id: 'armor', label: 'Armour' },
  { id: 'magic', label: 'Magic' },
  { id: 'clothing', label: 'Clothing' },
  { id: 'ingredients', label: 'Ingredients' },
];
const isEnchanted = (it) => !!it.ench;
const ING = new Set(['UselessItems2', 'CreatureIngredients1', 'PlantIngredients1', 'MetalIngredients']);
const isIngredient = (it) => ING.has(it.group);
function filterByTab(items, tab) {
  return items.filter((it) => {
    if (it.worn) return false;
    const ench = isEnchanted(it);
    if (tab === 'magic') return ench;
    if (tab === 'weapons') return it.group === 'Weapons' && !ench;
    if (tab === 'armor') return it.group === 'Armor' && !ench;
    if (tab === 'ingredients') return isIngredient(it) && !ench;
    return it.group !== 'Weapons' && it.group !== 'Armor' && !isIngredient(it) && !ench;
  });
}

const ITEMS = [
  { name: 'Steel Longsword', group: 'Weapons', g: '/' }, { name: 'Elven Dagger', group: 'Weapons', g: '/' },
  { name: 'War Axe', group: 'Weapons', g: 'T' }, { name: 'Short Bow', group: 'Weapons', g: ')' },
  { name: 'Arrow', group: 'Weapons', g: '>', qty: 42 },
  { name: 'Silver Broadsword', group: 'Weapons', g: '/', ench: true },
  { name: 'Steel Cuirass', group: 'Armor', g: '[' }, { name: 'Steel Greaves', group: 'Armor', g: '[' },
  { name: 'Iron Helm', group: 'Armor', g: '^' }, { name: 'Leather Boots', group: 'Armor', g: 'b' },
  { name: 'Steel Buckler', group: 'Armor', g: '0' }, { name: 'Kite Shield', group: 'Armor', g: '0' },
  { name: 'Tower Shield', group: 'Armor', g: '0' }, { name: 'Left Pauldron', group: 'Armor', g: '[' },
  { name: 'Right Pauldron', group: 'Armor', g: '[' }, { name: 'Chain Hauberk', group: 'Armor', g: '[' },
  { name: 'Dwarven Gauntlets', group: 'Armor', g: 'g', ench: true },
  { name: 'Ring of Feather', group: 'Jewellery', g: 'o', ench: true },
  { name: 'Amulet of Warding', group: 'Jewellery', g: 'O', ench: true },
  { name: 'Wizard Robe', group: 'Clothing', g: 'W' }, { name: 'Casual Cloak', group: 'Clothing', g: 'c' },
  { name: 'Boots', group: 'Clothing', g: 'b' }, { name: 'Sandals', group: 'Clothing', g: 'v' },
  { name: 'Ivy Leaves', group: 'PlantIngredients1', g: '%', qty: 6 },
  { name: 'Giant Blood', group: 'CreatureIngredients1', g: '~', qty: 3 },
  { name: 'Iron Ore', group: 'MetalIngredients', g: '*', qty: 2 },
  { name: 'Lodestone', group: 'MetalIngredients', g: '*' },
  { name: 'Torch', group: 'UselessItems2', g: 'i', qty: 4 },
  { name: 'Bandage', group: 'UselessItems2', g: '=', qty: 7 },
  { name: 'Book: Lycanthropy', group: 'Books', g: '#' },
  { name: 'Potion of Healing', group: 'UselessItems1', g: '!', qty: 3 },
  { name: 'Steel Chainmail', group: 'Armor', g: '[', worn: true },
];
const WORN = [
  ['Head', 'Iron Helm'], ['Chest (armour)', 'Steel Chainmail'], ['Chest (clothes)', 'Wizard Robe'],
  ['Right hand', 'Steel Longsword'], ['Left hand', 'Kite Shield'], ['Legs (armour)', 'Steel Greaves'],
  ['Legs (clothes)', '\u2014'], ['Feet', 'Leather Boots'], ['Gloves', '\u2014'],
  ['Amulet 0', 'Amulet of Warding'], ['Amulet 1', '\u2014'], ['Bracelet 0', '\u2014'],
  ['Bracelet 1', '\u2014'], ['Ring 0', 'Ring of Feather'], ['Ring 1', '\u2014'],
  ['Mark 0', '\u2014'], ['Crystal 0', '\u2014'],
];
const STATS = [['Level', '6'], ['Health', '84 / 84'], ['Fatigue', '112 / 128'],
  ['Magicka', '42 / 60'], ['Armour', '7'], ['Encumbrance', '67%']];

const $ = (id) => document.getElementById(id);
let tab = 'weapons';
let names = true;

function paintTabs() {
  const nav = $('tabs'); nav.textContent = '';
  for (const t of TABS) {
    const b = document.createElement('button');
    b.className = `packtab${t.id === tab ? ' on' : ''}`;
    b.innerHTML = `${t.label}<span class="count">${filterByTab(ITEMS, t.id).length}</span>`;
    b.onclick = () => { tab = t.id; paintTabs(); paintGrid(); };
    nav.append(b);
  }
}
function paintGrid() {
  const g = $('grid'); g.textContent = '';
  const rows = filterByTab(ITEMS, tab);
  if (!rows.length) { g.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  for (const it of rows) {
    const c = document.createElement('div');
    c.className = 'gcell';
    c.title = it.name;
    c.innerHTML = `<span class="g">${it.g}</span>`
      + (it.ench ? '<span class="ench">&#9670;</span>' : '')
      + (it.qty > 1 ? `<span class="qty">${it.qty}</span>` : '')
      + (names ? `<span class="nm">${it.name}</span>` : '');
    g.append(c);
  }
}
function paintCols() {
  const cs = $('chars'); cs.textContent = '';
  for (const [k, v] of STATS) {
    cs.insertAdjacentHTML('beforeend',
      `<div class="slotrow"><span class="k">${k}</span><span class="v">${v}</span></div>`);
  }
  $('wornhead').textContent = `${WORN.filter(([, v]) => v !== '\u2014').length} of ${WORN.length} slots`;
  const w = $('worn'); w.textContent = '';
  for (const [k, v] of WORN) {
    w.insertAdjacentHTML('beforeend',
      `<div class="slotrow${v === '\u2014' ? ' off' : ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`);
  }
}
const knob = (input, out, unit, prop) => {
  const apply = () => { out.value = input.value + unit;
    document.documentElement.style.setProperty(prop, input.value + unit); };
  input.oninput = apply; apply();
};
knob($('kh'), $('oh'), 'vh', '--pack-h');
knob($('kc'), $('oc'), 'px', '--cell');
$('knm').onchange = (e) => { names = e.target.checked; paintGrid(); };
paintTabs(); paintGrid(); paintCols();
</script>
</body>
</html>
