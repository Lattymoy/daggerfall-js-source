<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daggerfall Enhanced &mdash; new weapon type prototype (gun)</title>
<!--
  THE GUN LAB (Mac, 2026-09-19): prototype a NEW WEAPON TYPE before a
  line of the game changes - the door grass-proto.html and water.html
  came through.

  NOTHING HERE TOUCHES THE GAME. It is its own page over its own art;
  no module the game runs imports it, and combat/fpsWeapon.js is
  untouched. The port is a 1:1 DFU translation and a gun is not in
  Daggerfall - so the place to find out what one FEELS like on the
  classic surface is a lab, and only what survives the lab is worth
  building into the weapon rig.

  What it borrows on purpose is the PLACEMENT LAW, so the numbers you
  tune here transfer: the 320x200 design surface bottom-anchored and
  stretched to the window, Left/Center/Right alignment with a
  fractional offset, the hard 1-bit cutout every screen quad in this
  port gets, and the handedness mirror. src/tools/gunLab.js carries
  that arithmetic with its citations, and test/gunLab.test.js pins it.

  The art is TWO FILES, not a CIF: public/art/gun-idle.png (one pose)
  and public/art/gun-fire-sheet.webp (a 3x2 contact sheet, six fire
  frames, numbered). The sheet is sliced in the browser rather than
  pre-cut, which is what lets the background key be a live control -
  the threshold that kills a white page and spares a muzzle flash is
  exactly the thing that wants a slider.

  Controls: click or Space fires (hold for auto), W/S walk-bob toggle,
  arrow keys scrub frames while idle, G shows the slice boxes, Tab
  hides the panels so the pose can be judged with nothing over it.
-->
<style>
  html,body { margin:0; height:100%; background:#0d0f12; color:#cdc4a8;
    font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; cursor:crosshair; }
  .hud { position:fixed; left:12px; top:12px; background:rgba(10,12,16,.78);
    border:1px solid #55503f; padding:10px 12px; max-width:min(360px,46vw);
    max-height:calc(100vh - 40px); overflow:auto; }
  .hud h1 { margin:0 0 6px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#e0d5ad; }
  .hud h2 { margin:10px 0 4px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#9c9378; border-top:1px solid #33302a; padding-top:8px; }
  .hud label { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .hud label > span:first-child { width:88px; color:#a89e80; }
  .hud input[type=range] { flex:1; min-width:70px; }
  .hud select { flex:1; background:#15181d; color:#cdc4a8; border:1px solid #454033; }
  .hud .v { width:50px; text-align:right; color:#c08a3e; }
  .hud p { margin:6px 0 0; color:#8d836c; font-size:12px; }
  .stat { position:fixed; right:12px; top:12px; background:rgba(10,12,16,.78);
    border:1px solid #55503f; padding:8px 10px; color:#9c9378; white-space:pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>New weapon type &mdash; gun</h1>

  <h2>Placement (classic law)</h2>
  <label><span>idle pose</span><select id="idleSrc"><option value="sheet">sheet frame 1</option><option value="art">gun-idle.png</option></select></label>
  <label><span>align</span><select id="align"><option value="1">Center</option><option value="2">Right</option><option value="0">Left</option></select></label>
  <label><span>offset</span><input id="offset" type="range" min="0" max="0.4" step="0.005" value="0"><span class="v" id="voffset"></span></label>
  <label><span>size %</span><input id="size" type="range" min="20" max="120" step="1" value="62"><span class="v" id="vsize"></span></label>
  <label><span>raise</span><input id="raise" type="range" min="-60" max="60" step="1" value="0"><span class="v" id="vraise"></span></label>
  <label><span>left hand</span><input id="flip" type="checkbox"><span class="v">mirror</span></label>

  <h2>Cycle</h2>
  <label><span>fire fps</span><input id="fps" type="range" min="4" max="30" step="1" value="14"><span class="v" id="vfps"></span></label>
  <label><span>pump ms</span><input id="cool" type="range" min="0" max="1200" step="20" value="260"><span class="v" id="vcool"></span></label>
  <label><span>hit frame</span><input id="hit" type="range" min="0" max="5" step="1" value="1"><span class="v" id="vhit"></span></label>
  <label><span>auto</span><input id="auto" type="checkbox"><span class="v">hold</span></label>

  <h2>Feel</h2>
  <label><span>recoil</span><input id="recoil" type="range" min="0" max="40" step="1" value="12"><span class="v" id="vrecoil"></span></label>
  <label><span>muzzle light</span><input id="light" type="range" min="0" max="1" step="0.02" value="0.6"><span class="v" id="vlight"></span></label>
  <label><span>walk bob</span><input id="bob" type="range" min="0" max="12" step="0.5" value="4"><span class="v" id="vbob"></span></label>
  <label><span>walking</span><input id="walk" type="checkbox"><span class="v">W/S</span></label>

  <h2>Art</h2>
  <label><span>key white</span><input id="key" type="range" min="180" max="255" step="1" value="244"><span class="v" id="vkey"></span></label>
  <label><span>chroma</span><input id="chroma" type="range" min="0" max="40" step="1" value="10"><span class="v" id="vchroma"></span></label>
  <label><span>room</span><input id="room" type="range" min="0.15" max="1.2" step="0.01" value="0.62"><span class="v" id="vroom"></span></label>
  <label><span>boxes</span><input id="grid" type="checkbox"><span class="v">G</span></label>
  <p id="note">loading art&hellip;</p>
</div>
<div class="stat" id="stat"></div>

<script type="module">
import {
  SHEET_GRID, FIRE_FRAMES, ALIGN, cellRect, keyBackground, contentBox,
  unionBox, unionDrawRect, placeSprite, createGunMachine, muzzleLight,
  recoilOffset, bobOffset,
} from '/src/tools/gunLab.js';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = (id) => document.getElementById(id);

// ── the controls, one state bag ──────────────────────────────────────
const state = {
  idleSrc: 'sheet', align: ALIGN.Center, offset: 0, size: 62, raise: 0, flip: false,
  fps: 14, cool: 260, hit: 1, auto: false,
  recoil: 12, light: 0.6, bob: 4, walk: false,
  key: 244, chroma: 10, room: 0.62, grid: false,
};
const NUM = { offset:1, size:1, raise:1, fps:1, cool:1, hit:1, recoil:1, light:1, bob:1, key:1, chroma:1, room:1 };
const bind = (id, after = () => {}) => {
  const el = $(id), out = $('v' + id);
  const read = () => {
    state[id] = el.type === 'checkbox' ? el.checked : (NUM[id] ? parseFloat(el.value) : (id === 'align' ? parseInt(el.value, 10) : el.value));
    if (out) out.textContent = el.type === 'checkbox' ? '' : el.value;
    after();
  };
  el.addEventListener('input', read);
  read();
};

// ── THE ART ──────────────────────────────────────────────────────────
// Sliced, keyed and cropped here rather than shipped pre-cut, so the
// key threshold is live. `frames` are six canvases on ONE box (the
// union), `anchor` is the gun's own box inside it - see gunLab.js.
let art = null, rebuilding = false, wantRebuild = false;
const sheetImg = new Image(), idleImg = new Image();

function bakeOne(src, sx, sy, sw, sh) {
  const cv = document.createElement('canvas');
  cv.width = sw; cv.height = sh;
  const c = cv.getContext('2d', { willReadFrequently: true });
  c.imageSmoothingEnabled = false;
  c.drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
  const img = c.getImageData(0, 0, sw, sh);
  keyBackground(img, state.key, state.chroma);
  c.putImageData(img, 0, 0);
  return { cv, box: contentBox(img) };
}

function crop(cv, box) {
  const out = document.createElement('canvas');
  out.width = box.w; out.height = box.h;
  const c = out.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.drawImage(cv, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
  return out;
}

function rebuild() {
  if (!sheetImg.complete || !sheetImg.naturalWidth) return;
  const baked = [];
  for (let i = 0; i < FIRE_FRAMES; i++) {
    const r = cellRect(i, sheetImg.naturalWidth, sheetImg.naturalHeight);
    baked.push(bakeOne(sheetImg, r.x, r.y, r.w, r.h));
  }
  const union = unionBox(baked.map((b) => b.box));
  const anchor = baked[0].box;   // frame 1: the gun with no flash on it
  const frames = baked.map((b) => crop(b.cv, union));
  let idle = null;
  if (idleImg.complete && idleImg.naturalWidth) {
    const b = bakeOne(idleImg, 0, 0, idleImg.naturalWidth, idleImg.naturalHeight);
    if (b.box) idle = { cv: crop(b.cv, b.box), box: { x: 0, y: 0, w: b.box.w, h: b.box.h } };
  }
  art = { frames, union, anchor, idle };
  $('note').textContent = `sheet ${sheetImg.naturalWidth}x${sheetImg.naturalHeight}, cell ${Math.floor(sheetImg.naturalWidth / SHEET_GRID.cols)}x${Math.floor(sheetImg.naturalHeight / SHEET_GRID.rows)} — gun ${anchor.w}x${anchor.h}, with flash ${union.w}x${union.h}`;
}

// The key sweep is a flood fill over six cells plus a 1625x968 page;
// coalesce so dragging the slider does not queue a dozen of them.
function scheduleRebuild() {
  if (rebuilding) { wantRebuild = true; return; }
  rebuilding = true;
  requestAnimationFrame(() => {
    rebuild();
    rebuilding = false;
    if (wantRebuild) { wantRebuild = false; scheduleRebuild(); }
  });
}

sheetImg.onload = scheduleRebuild; idleImg.onload = scheduleRebuild;
sheetImg.onerror = () => { $('note').textContent = 'public/art/gun-fire-sheet.webp did not load'; };
sheetImg.src = '/art/gun-fire-sheet.webp';
idleImg.src = '/art/gun-idle.png';

// ── the machine ──────────────────────────────────────────────────────
const gun = createGunMachine({ fps: state.fps, cooldownMs: state.cool, hitFrame: state.hit });
let scrub = -1;          // frame held while idle (arrow keys), -1 = live
let hitFlash = 0;        // the target's tell, so the hit frame can be judged

for (const id of ['idleSrc','align','offset','size','raise','flip','fps','cool','hit','auto','recoil','light','bob','walk','room','grid']) bind(id);
for (const id of ['key','chroma']) bind(id, scheduleRebuild);

const press = () => { gun.trigger = true; scrub = -1; gun.fire(); };
const release = () => { gun.trigger = false; };
canvas.addEventListener('mousedown', press);
addEventListener('mouseup', release);
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); press(); }
  if (e.code === 'KeyW') { state.walk = true; $('walk').checked = true; }
  if (e.code === 'KeyS') { state.walk = false; $('walk').checked = false; }
  if (e.code === 'Tab') { e.preventDefault(); for (const el of document.querySelectorAll('.hud,.stat')) el.style.display = el.style.display === 'none' ? '' : 'none'; }
  if (e.code === 'KeyG') { state.grid = !state.grid; $('grid').checked = state.grid; }
  if (e.code === 'ArrowRight') scrub = (scrub + 1 + FIRE_FRAMES) % FIRE_FRAMES;
  if (e.code === 'ArrowLeft') scrub = (scrub - 1 + FIRE_FRAMES) % FIRE_FRAMES;
});
addEventListener('keyup', (e) => { if (e.code === 'Space') release(); });

// ── the room ─────────────────────────────────────────────────────────
// A plain lit corridor, not a render of anything: the sprite has to be
// judged against stone and shadow, and the muzzle flash has to have
// something to throw light on.
function drawRoom(lit) {
  const { width: w, height: h } = canvas;
  const horizon = h * 0.56;
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, `rgb(${18 * lit | 0},${17 * lit | 0},${20 * lit | 0})`);
  g.addColorStop(1, `rgb(${74 * lit | 0},${66 * lit | 0},${54 * lit | 0})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, horizon);
  const f = ctx.createLinearGradient(0, horizon, 0, h);
  f.addColorStop(0, `rgb(${58 * lit | 0},${50 * lit | 0},${40 * lit | 0})`);
  f.addColorStop(1, `rgb(${22 * lit | 0},${19 * lit | 0},${16 * lit | 0})`);
  ctx.fillStyle = f; ctx.fillRect(0, horizon, w, h - horizon);
  // block courses, vanishing to the centre - enough parallax to read scale
  ctx.strokeStyle = `rgba(${12 * lit | 0},${11 * lit | 0},${9 * lit | 0},0.85)`;
  ctx.lineWidth = Math.max(1, w / 640);
  for (let i = 1; i < 7; i++) {
    const y = horizon * (i / 7) ** 1.6;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let i = -6; i <= 6; i++) {
    ctx.beginPath(); ctx.moveTo(w / 2 + i * w * 0.09, horizon); ctx.lineTo(w / 2 + i * w * 0.42, h); ctx.stroke();
  }
}

function drawTarget(lit) {
  const { width: w, height: h } = canvas;
  const tw = w * 0.055, th = tw * 2.6;
  const x = w / 2 - tw / 2, y = h * 0.56 - th * 0.86;
  ctx.fillStyle = hitFlash > 0 ? `rgba(190,60,44,${0.35 + 0.65 * hitFlash})` : `rgb(${52 * lit | 0},${46 * lit | 0},${42 * lit | 0})`;
  ctx.fillRect(x, y, tw, th);
  ctx.fillStyle = `rgba(${18 * lit | 0},${16 * lit | 0},${14 * lit | 0},0.9)`;
  ctx.fillRect(x, y + th * 0.18, tw, th * 0.04);
}

function drawCrosshair() {
  const { width: w, height: h } = canvas;
  const r = Math.max(4, w * 0.006);
  ctx.strokeStyle = 'rgba(220,208,170,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w / 2 - r * 2, h / 2); ctx.lineTo(w / 2 - r, h / 2);
  ctx.moveTo(w / 2 + r, h / 2); ctx.lineTo(w / 2 + r * 2, h / 2);
  ctx.moveTo(w / 2, h / 2 - r * 2); ctx.lineTo(w / 2, h / 2 - r);
  ctx.moveTo(w / 2, h / 2 + r); ctx.lineTo(w / 2, h / 2 + r * 2);
  ctx.stroke();
}

// ── the frame ────────────────────────────────────────────────────────
let last = performance.now(), t = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt;
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }

  gun.fps = state.fps; gun.cooldownMs = state.cool; gun.hitFrame = state.hit;
  gun.trigger = gun.trigger && state.auto;
  const event = gun.step(dt);
  if (event === 'hit') hitFlash = 1;
  hitFlash = Math.max(0, hitFlash - dt * 4);

  const showFrame = gun.state === 'Firing' ? gun.frame : (scrub >= 0 ? scrub : 0);
  const lit = state.room * (1 + muzzleLight(gun.state, showFrame) * state.light * 1.9);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  drawRoom(lit); drawTarget(lit); drawCrosshair();

  let r = null, anchorRect = null;
  if (art) {
    // Frame 1 with the idle art swapped in is the only case where the
    // drawn image is NOT on the union box, so it carries its own.
    const useIdleArt = state.idleSrc === 'art' && art.idle && gun.state !== 'Firing' && scrub < 0;
    const src = useIdleArt ? art.idle.cv : art.frames[showFrame];
    const union = useIdleArt ? art.idle.box : art.union;
    const anchor = useIdleArt ? art.idle.box : art.anchor;
    // Under the mirror the whole composite flips, so the gun's box
    // flips with it inside the union box - otherwise the flash would
    // swap sides and drag the weapon off its alignment.
    const anc = state.flip
      ? { ...anchor, x: 2 * union.x + union.w - anchor.x - anchor.w }
      : anchor;
    const kickR = recoilOffset(gun.state, showFrame, state.recoil);
    const kickB = bobOffset(t, state.bob, state.walk);
    anchorRect = placeSprite({
      canvasW: canvas.width, canvasH: canvas.height,
      frameW: anchor.w, frameH: anchor.h,
      widthPct: state.size / 100, align: state.align, offset: state.offset,
      flip: state.flip, offsetHeight: state.raise * (canvas.height / 200),
      kick: { x: kickR.x + kickB.x, y: kickR.y + kickB.y },
    });
    r = unionDrawRect(anchorRect, anc, union);
    ctx.save();
    if (state.flip) { ctx.translate(r.x + r.w / 2, 0); ctx.scale(-1, 1); ctx.translate(-(r.x + r.w / 2), 0); }
    ctx.drawImage(src, r.x, r.y, r.w, r.h);
    ctx.restore();
    if (state.grid) {
      ctx.strokeStyle = 'rgba(192,138,62,0.9)'; ctx.lineWidth = 1;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = 'rgba(120,200,140,0.9)';
      ctx.strokeRect(anchorRect.x, anchorRect.y, anchorRect.w, anchorRect.h);
    }
  }

  // The probe's window on the frame (tools/gunProtoProbe.mjs). The
  // page has no DOM to measure - it is one canvas - so what it draws
  // is claimed HERE, where it was computed, and asserted there.
  globalThis.__gunLab = {
    ready: !!art, state: gun.state, frame: showFrame, shots: gun.shots,
    rect: art ? r : null, anchorRect: art ? anchorRect : null,
    art: art && { union: art.union, anchor: art.anchor, frames: art.frames.length, idle: !!art.idle },
  };

  $('stat').textContent =
    `${gun.state.padEnd(8)} frame ${showFrame + 1}/${FIRE_FRAMES}${scrub >= 0 && gun.state === 'Idle' ? ' (held)' : ''}\n` +
    `shots ${gun.shots}   cycle ${(FIRE_FRAMES / state.fps * 1000 + state.cool).toFixed(0)}ms\n` +
    `rate  ${(60000 / (FIRE_FRAMES / state.fps * 1000 + state.cool)).toFixed(0)} rpm`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
