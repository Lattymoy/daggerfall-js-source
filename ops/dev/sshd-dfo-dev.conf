# DEV-ENV (2026-10-19, bible/01-Overview/Release-Flow.md): THE DEV VM'S SSH. Installed as
# /etc/ssh/sshd_config.d/00-dfo-dev.conf by bootstrap.sh - first of the drop-ins, so its word is the one sshd keeps.
#
# AUDIT RELEASE-FLOW D11: key login alone, inside the network and (KEEP_PUBLIC_SSH=1) outside it - a cloud image's own
# drop-in turning passwords on is read after this. AUDIT RELEASE-FLOW D1: dfo's keys are root's file, written by
# bootstrap.sh, never one in dfo's own home - dfo cannot add a key, and root never writes beneath a directory dfo owns.
PasswordAuthentication no
KbdInteractiveAuthentication no
Match User dfo
	AuthorizedKeysFile /etc/dfo-dev/authorized_keys
Match all
