# DEV-ENV (2026-10-19, bible/01-Overview/Release-Flow.md): THE DEV NETWORK'S DNS. Installed as
# /etc/dnsmasq.d/dfo-dev.conf by bootstrap.sh (which writes @DEV_HOST@).
#
# Inside the network the site's name is this VM's network address, 10.66.0.1 - its public record names the VM's
# public address, which the certificate's challenge needs and which a member's browser must not take (443 is shut
# there). A member's WireGuard config asks this server (DNS = 10.66.0.1); every other name it passes on. The site's
# name alone - not its subdomains - so another name under it can still be the public one.
#
# AUDIT RELEASE-FLOW D9: AND THE NAME IS ANSWERED HERE FOR BOTH FAMILIES. A record of its IPv4 alone let its AAAA be
# asked upstream, and a public AAAA would send a member's browser to the VM's public address first, where 443 is shut:
# `local` keeps the name here (its AAAA answered with none), and the `*.` server hands its subdomains on as before.
# What a member accepts by this server (Release-Flow.md, DEV-ENV): while the tunnel is up it answers every name they
# look up - forwarding them on, logging none - and with this VM down their names go with it until they disconnect.
interface=wg0
except-interface=lo
bind-dynamic
no-resolv
no-hosts
server=1.1.1.1
server=9.9.9.9
host-record=@DEV_HOST@,10.66.0.1
local=/@DEV_HOST@/
server=/*.@DEV_HOST@/#
