#!/usr/sbin/nft -f
# DEV-ENV (2026-10-19, bible/01-Overview/Release-Flow.md): THE DEV VM'S DOORS. Installed as /etc/nftables.conf by
# bootstrap.sh (which writes @PUBLIC_SSH@).
#
# From the internet: WireGuard (udp 51820), and port 80 for Let's Encrypt's challenge (Caddy answers nothing else
# there but a redirect to a door that is shut outside). Everything else - the site (443), SSH, the network's DNS - from
# inside the WireGuard network alone. Nothing is forwarded out of the network.
#
# AUDIT RELEASE-FLOW D4: AND A MEMBER REACHES THE NETWORK'S SERVICES, NEVER ANOTHER MEMBER'S MACHINE. Every member was
# let through to every other (a laptop's dev server on 0.0.0.0, its file sharing, a Mac with no firewall). Now a member
# reaches this VM, and through it only the services' addresses - 10.66.0.3 to 10.66.0.9, a VM of the team's own such as
# the admin panel (tools/devPeer.mjs NETWORK.services) - and their answers come back as the connection's own.
flush ruleset

table inet dfo_dev {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		meta l4proto { icmp, ipv6-icmp } accept
		udp dport 51820 accept
		tcp dport 80 accept
		@PUBLIC_SSH@
		iifname "wg0" tcp dport { 22, 443 } accept
		iifname "wg0" meta l4proto { tcp, udp } th dport 53 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iifname "wg0" oifname "wg0" ip daddr 10.66.0.3-10.66.0.9 accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
