# REL7 (2026-10-03, Mac: "I need you to do this auto"): A PUBLISHED
# RELEASE'S NOTES, READ AGAIN. The publish job (release-desktop.yml) reads
# each merged pull request's `## Patch notes` once, at the moment it runs;
# a description written or fixed after that never reached the release, and
# the launcher's news showed "Fixes and improvements." for good.
#
# Now it does, on its own: EDIT A MERGED PULL REQUEST'S DESCRIPTION and the
# first release that brought it has its notes read again
# (scripts/desktopRelease.mjs renotes) and written over the old ones.
# GitHub's generated list under them stays, and no file of the release is
# touched - only its text. By hand, dispatch it with a release's tag. The
# notes live on the pull requests, never in the tree.
#
# pull_request_target runs THIS file, from the default branch, with the
# repository's own token - so nothing here checks out or runs a pull
# request's code: its description is read through the API as data, and
# only one the repository's own people opened is ever printed
# (NOTES_AUTHORS). The script that runs is main's, whatever the release's
# own commit had (REL7's first cut checked the tag out, and app-v0.1.5767's
# script had no `renotes`).
name: release-notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The published release whose notes to read again (app-v<major>.<minor>.<patch>)'
        required: true
  pull_request_target:
    types: [edited]

permissions:
  contents: read

# AUDIT RELEASE-FLOW A5: each run is one pull request's edit, so each waits its turn - GitHub keeps ONE pending run a
# group by default and cancels it for the next, and a description edited while two others were read never reached its
# release
concurrency:
  group: release-notes
  cancel-in-progress: false
  queue: max

jobs:
  renotes:
    # by hand; or a pull request MERGED into the default branch whose DESCRIPTION changed (a title is not notes) - or,
    # RELEASE-FLOW, into release: a hotfix's notes are its release's as well
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.event.changes.body && (github.event.pull_request.base.ref == github.event.repository.default_branch || github.event.pull_request.base.ref == 'release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release's body
      pull-requests: read    # the notes are the merged pull requests' own
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0   # every release tag, and the merges between them
          persist-credentials: false   # nothing here pushes; no token is left in .git/config

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # By hand, the tag given. For an edited pull request, the FIRST release
      # its merge is in - none yet, and the publish job still to come reads
      # the description as it is now. AUDIT INSTALL L1-5's rule either way:
      # a tag is app-v<n>.<n>.<n> exactly, read from the environment.
      - name: The release to write
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --contains "$MERGE_SHA" --list 'app-v*' --sort=v:refname | head -n 1)
            if [ -z "$TAG" ]; then
              echo "no release carries #$PR yet - the next one reads its description as it is"
              exit 0
            fi
          fi
          if ! [[ "$TAG" =~ ^app-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be app-v<major>.<minor>.<patch>, digits only"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # A read that fails fails the step, and the release keeps the notes it has.
      - name: Write the notes again
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          node -e "process.stdout.write(require('./release.json').body ?? '')" > current-body.md
          node scripts/desktopRelease.mjs renotes "$TAG" current-body.md > release-notes.md
          ID=$(node -p "require('./release.json').id")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F body=@release-notes.md --silent
          echo "the notes of $TAG, written again:"
          cat release-notes.md
