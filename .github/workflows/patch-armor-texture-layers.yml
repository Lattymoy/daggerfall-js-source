name: patch armor texture layers

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - tools/patch_armor_texture_layers.py
      - .github/workflows/patch-armor-texture-layers.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply armor texture/layer patch
        run: python tools/patch_armor_texture_layers.py
      - name: Install dependencies
        run: npm ci
      - name: Verify armor texture/layer integration
        run: |
          node --check src/tools/paperdoll/armorTexture.js
          node --check src/tools/paperdollViewer.js
          node tools/armorTextureLayersProbe.mjs
          node tools/armorViewerProbe.mjs
          node tools/voxelClothingRegressionProbe.mjs
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check
      - name: Commit verified integration
        run: |
          git config user.name "Lattymoy"
          git config user.email "98724681+Lattymoy@users.noreply.github.com"
          git add src/tools/paperdollViewer.js tools/armorTextureLayersProbe.mjs
          git diff --cached --quiet && exit 0
          git commit -m "ARMOR: use classic textures and enforce layer ownership"
          git push origin HEAD:chatgpt/exact-face-atlas
