name: patch variant matrix front armor

on:
  push:
    branches: [chatgpt/exact-face-atlas]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply full wardrobe matrix patch
        run: python tools/patch_variant_matrix_front_armor.py
      - name: Install dependencies
        run: npm ci
      - name: Verify variant matrix and texture regressions
        run: |
          node --check src/systems/armorMaterials.js
          node --check src/tools/paperdoll/clothingTexture.js
          node --check src/tools/paperdoll/armorTexture.js
          node --check src/tools/paperdollViewer.js
          node tools/variantMatrixProbe.mjs
          node tools/armorTextureLayersProbe.mjs
          node tools/armorViewerProbe.mjs
          node tools/voxelClothingRegressionProbe.mjs
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check
      - name: Commit verified matrix integration
        run: |
          git config user.name "Lattymoy"
          git config user.email "98724681+Lattymoy@users.noreply.github.com"
          git add src/systems/armorMaterials.js src/tools/paperdoll/clothingTexture.js src/tools/paperdoll/armorTexture.js src/tools/paperdollViewer.js viewer.html tools/armorTextureLayersProbe.mjs
          git diff --cached --quiet && exit 0
          git commit -m "WARDROBE: expose full classic variant matrix"
          git push origin HEAD:chatgpt/exact-face-atlas
