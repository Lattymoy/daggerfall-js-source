name: check

# FLOW1 (2026-09-26): the PR's check is verify.yml's parallel jobs - lint
# and the types, the balanced test shards (eight - CI-FAST), the build - and then `check`,
# which passes only when every one of them did. `check` keeps the name the
# single job had, so a branch rule that requires it still means the whole
# verification. It runs whatever happened above it (`always()`): a required
# check that is SKIPPED because a job it needs failed would count as a
# pass, so this one reads the result and fails itself.
#
# RELEASE-FLOW (2026-10-19, bible/01-Overview/Release-Flow.md): and on every
# push to main - main's own head after each merge, which the site's deploy
# verified until it moved to release; its green run is also what saves the
# shards' times where every pull request finds them (CI-TIMES: a branch's
# saved times are its own, main's everyone's). A dispatch runs it on any
# branch: CHECK-ASK's `/check` (check-ask.yml) dispatches it on a pull
# request's own branch - the one way a conflicted pull request is checked.
# AUDIT RELEASE-FLOW B1: GitHub reads no check a dispatched run reports for a
# pull request, so such a run says its result on its commit as a status of its
# own, `check (asked)` (the `asked` and `answered` jobs) - which the pull
# request shows, and which no rule requires.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# AUDIT RELEASE-FLOW B5: one group per event as well - a `/check` on the
# promotion's branch (main) cancelled main's own run, the one that counts
concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # CHECK-ASK (AUDIT RELEASE-FLOW B1): a dispatched run's result, said where the pull request reads it
  asked:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Said as begun
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context='check (asked)' -f description='the whole check, asked by /check' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent

  verify:
    uses: ./.github/workflows/verify.yml

  # CI-TIMES (2026-10-19): the shards' times this green run recorded, saved
  # for the next run's split (test-times.yml) - beside `check`, which never
  # waits on it
  times:
    needs: [verify]
    uses: ./.github/workflows/test-times.yml
    with:
      planned: ${{ needs.verify.outputs.times }}

  check:
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the check passed
        run: |
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::the check did not pass (verify: ${{ needs.verify.result }}) - see its lint, test and build jobs"
            exit 1
          fi
          echo "lint, types, every test shard and the build passed"

  answered:
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Said as done
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$RESULT" = success ]; then state=success; else state=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context='check (asked)' -f description="the whole check: $RESULT" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
