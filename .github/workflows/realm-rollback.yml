name: Realm rollback (a purse below nothing)

# PURSE-BACK (2026-10-19; FIELD BUGS 2026-10-18b TRADE-WRAP's repair - the owner: "We need to restore Kurasawa's account
# to before they were in a negative balance", then, asked how it should run, "Build a workflow"). Until TRADE-WRAP, a
# counter's sale of a big lot paid millions BELOW nothing into the purse; the judge holds such a character (a purse
# below nothing is a law finding) and judges no save after it clean. tools/realmRollback.mjs runs the review's own
# rollback (server-account/src/review.js) on one: the record back to its last clean save, from before the sale - and
# only when that save IS from before it (a purse set at nothing since can make a later save clean; the run then refuses).
#
# RUN BY HAND from the Actions tab, on main:
#   1. with apply off (the default): a DRY RUN - the act itself, its writes held. The run's summary names the character,
#      what its record holds now and what it would hold back, and what the act would write. Nothing is written.
#   2. read it; then run again with apply on.
#
# Who runs it must be on the developers' list (server-account/wrangler.toml DEVELOPER_HANDLES): the review's gate is the
# act's own, asked with the run's actor, and the act's staff finding names them and this run. No maintenance hold and no
# rewind: the act is one guarded statement over the row as it read it, as the review's route runs it live - a tab playing
# the character loses its seat to it. Nothing of an account reaches the page but its handle and its characters.

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "The account's username"
        required: true
        type: string
      character:
        description: "The realm character's id (r + 20 hex), if more than one of the account's purses went below nothing - else leave empty"
        required: false
        default: ""
        type: string
      apply:
        description: "Write the rollback. Leave it off for a dry run that only reports."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never beside a deploy's migrations, a recovery, a restore or a revive: the deploy's own group, queued.
concurrency:
  group: account-deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: daggerfall-accounts
      WRANGLER: npx --yes wrangler@4
      # The inputs reach the scripts as ENVIRONMENT, never pasted into them (account-recovery.yml's law), and the act
      # holds each to its shape before any of it reaches a statement.
      HANDLE: ${{ inputs.handle }}
      CHARACTER: ${{ inputs.character }}
      APPLY: ${{ inputs.apply }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set for this repository - nothing else in this job can work"
            exit 1
          fi

      # The deploy's own resolution (account-deploy.yml), read-only: this job never creates a database.
      - name: Resolve the database id into the runner's copy of the config
        run: |
          set -euo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::there is no database named $DB_NAME"
            exit 1
          fi
          echo "::add-mask::$id"
          toml=server-account/wrangler.toml
          sentinel='resolved-by-account-deploy-workflow'
          grep -q "$sentinel" "$toml" || { echo "::error::$toml no longer carries the sentinel"; exit 1; }
          sed -i "s|\"$sentinel\"|\"$id\"|" "$toml"
          if grep -q "$sentinel" "$toml"; then
            echo "::error::the sentinel survived the substitution"
            exit 1
          fi

      # The act: a dry run unless apply is on - and the summary on the run's page whatever it answers.
      - name: Roll the character back
        working-directory: server-account
        run: |
          set -uo pipefail
          flags=""
          if [ "$APPLY" = "true" ]; then flags="--apply"; fi
          status=0
          node ../tools/realmRollback.mjs --handle "$HANDLE" --character "$CHARACTER" --by "$GITHUB_ACTOR" --run "$GITHUB_RUN_ID" --summary "$RUNNER_TEMP/summary.md" $flags || status=$?
          if [ -s "$RUNNER_TEMP/summary.md" ]; then cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
