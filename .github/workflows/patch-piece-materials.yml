name: patch classic clothing viewer

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/patch-piece-materials.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply classic clothing patch
        run: python tools/patch_classic_clothing.py

      - run: npm ci

      - name: Verify classic clothing catalog
        run: |
          node --input-type=module - <<'NODE'
          import { CLOTHING_CATALOG, clothingZones } from './src/characters/clothing.js';
          if (!CLOTHING_CATALOG.length) throw new Error('empty clothing catalog');
          const body = CLOTHING_CATALOG.filter(x => x.kind === 'body');
          const drape = CLOTHING_CATALOG.filter(x => x.kind === 'drape');
          if (!body.length || !drape.length) throw new Error('both clothing render kinds must exist');
          for (const c of body) if (!clothingZones(c.index).length) throw new Error('body clothing has no zones: ' + c.index + ' ' + c.name);
          for (const c of drape) if (!c.drape) throw new Error('draped clothing has no drape: ' + c.index + ' ' + c.name);
          console.log('classic clothing:', CLOTHING_CATALOG.length, 'templates;', body.length, 'body;', drape.length, 'draped');
          NODE

      - name: Verify viewer build
        run: |
          node --check src/tools/paperdollViewer.js
          npm run build
          git diff --check

      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/characters/clothing.js src/characters/paperdollPayload.js src/tools/paperdollViewer.js viewer.html
          git commit -m "CLOTHING: wire classic Daggerfall garments into 3D viewer"
          git push origin HEAD:chatgpt/exact-face-atlas
