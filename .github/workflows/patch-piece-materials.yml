name: patch piece materials

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/patch-piece-materials.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Isolate body skin material from clothing and piece materials
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/tools/paperdollViewer.js')
          s = p.read_text()

          replacements = [
            (
              "const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }); // shading is baked into vertex colours\nconst mesh = new THREE.Mesh(geo, mat);",
              """const mat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }); // BODY ONLY: skin.js owns this material\n// Every loose polygon pack gets its OWN material. skin.js is allowed to swap\n// the body's map/vertexColors, but a helm, robe, weapon, tail or creature piece\n// must never inherit the body's skin atlas just because it shares a renderer.\n// We still mirror the body's EFFECT state (ghost opacity / fire blend) so the\n// split changes texture ownership without changing authored spectral behavior.\nconst pieceMaterials = new Set();\nfunction copyBodyEffectState(pm) {\n  pm.transparent = mat.transparent;\n  pm.opacity = mat.opacity;\n  pm.depthWrite = mat.depthWrite;\n  pm.blending = mat.blending;\n  pm.needsUpdate = true;\n}\nfunction makePieceMaterial() {\n  const pm = mat.clone();\n  pm.map = null;\n  pm.vertexColors = true;\n  copyBodyEffectState(pm);\n  pieceMaterials.add(pm);\n  return pm;\n}\nfunction syncPieceEffectState() { for (const pm of pieceMaterials) copyBodyEffectState(pm); }\nconst mesh = new THREE.Mesh(geo, mat);"""
            ),
            (
              "  const m = new THREE.Mesh(geo, mat); m.position.y = -D.cy; m.visible = true; pivot.add(m);",
              "  const m = new THREE.Mesh(geo, makePieceMaterial()); m.position.y = -D.cy; m.visible = true; pivot.add(m);"
            ),
            (
              "  mat.blending = THREE.NormalBlending; // or the fire's blend outlives the fire\n  mat.needsUpdate = true;\n  applyVillagerDrape(v);",
              "  mat.blending = THREE.NormalBlending; // or the fire's blend outlives the fire\n  mat.needsUpdate = true;\n  syncPieceEffectState();\n  applyVillagerDrape(v);"
            ),
            (
              "  mat.blending = spec && spec.additive ? THREE.AdditiveBlending : THREE.NormalBlending;\n  mat.needsUpdate = true;\n\n  // Whichever line this design came from, show ITS pieces.",
              "  mat.blending = spec && spec.additive ? THREE.AdditiveBlending : THREE.NormalBlending;\n  mat.needsUpdate = true;\n  syncPieceEffectState();\n\n  // Whichever line this design came from, show ITS pieces."
            ),
            (
              "  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));\n  m.position.y = -D.cy; m.visible = false; pivot.add(m);",
              "  const clothRenderMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });\n  pieceMaterials.add(clothRenderMat); copyBodyEffectState(clothRenderMat);\n  const m = new THREE.Mesh(geo, clothRenderMat);\n  m.position.y = -D.cy; m.visible = false; pivot.add(m);"
            ),
          ]

          for old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, found {n}: {old[:90]!r}')
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - run: npm ci
      - name: Verify viewer build
        run: |
          node --check src/tools/paperdollViewer.js
          npm run build
          git diff --check

      - name: Commit verified patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tools/paperdollViewer.js
          git commit -m "FIX: isolate clothing and piece materials from body skin atlas"
          git push origin HEAD:chatgpt/exact-face-atlas
