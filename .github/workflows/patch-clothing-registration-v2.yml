name: patch clothing registration v2

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/patch-clothing-registration-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply width-preserving registration and QA panel
        run: python tools/patch_clothing_registration_v2.py
      - run: npm ci
      - name: Verify clothing registration v2
        run: |
          node --check src/tools/paperdoll/clothingTexture.js
          node --check src/tools/paperdollViewer.js
          node tools/clothingCanonicalProbe.mjs
          grep -q 'id="clothtexqa"' viewer.html
          grep -q "paperdoll-surface-v2" src/tools/paperdoll/clothingTexture.js
          npm run build
          git diff --check
      - name: Commit verified registration pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tools/paperdoll/clothingTexture.js src/tools/paperdollViewer.js viewer.html tools/clothingCanonicalProbe.mjs
          git commit -m "CLOTHING: preserve source scale while registering paperdoll art"
          git push origin HEAD:chatgpt/exact-face-atlas
