# SRV-N/CI (2026-09-17): THE RELAY'S DEPLOY.
#
# `server/wrangler.toml` has said "npx wrangler deploy (CLOUDFLARE_API_TOKEN
# in the environment)" since ONLINE1, and the bible has repeated "the deploy
# is by hand, nothing in CI does it" through every online slice since. That
# was true, and it had two costs: a relay-changing slice could merge green
# with the live Worker still on the old deploy (SRV-N shipped exactly that
# way, and within the hour SLAM13's merge left main SEVEN versions ahead of
# live), and the only way to push one was for somebody to hold the API token.
#
# ═══ THIS DROPS EVERY CONNECTED PLAYER ════════════════════════════
#
# A relay deploy restarts every Durable Object and drops every open socket
# at once - peers vanish, chat goes quiet, everyone reconnects. So the
# trigger has to fire on a real relay change and on nothing else.
#
# ═══ WHY NOT `on: push` WITH A PATH FILTER ════════════════════════
#
# The obvious automation is `paths: [server/**]`, and it would be WRONG.
# The relay's law lives in `src/net/wire.js` - one home, both ends,
# re-exported whole by `server/src/relay.js` - and that file changes
# constantly for reasons the running Worker does not care about. A path
# filter would drop every player in the game several times a day over
# comments and client-side constants.
#
# ═══ THE TRIGGER IS THE VERSION ═══════════════════════════════════
#
# Because the version already means exactly this. `RELAY_VERSION` is
# bumped by a relay-changing slice and by nothing else - that is the
# standing rule, written into the constant since AUDIT WORLD34 D4. So
# every push asks ONE cheap question: does the live relay serve the
# version main says it should? It deploys only when the answer is no.
#
# A push that changed no relay behaviour bumped no version, answers yes,
# and stops at a curl. That makes this job IDEMPOTENT - safe to re-run,
# and a merge whose deploy failed is retried by the next push instead of
# silently staying stale, which is the whole failure this exists to end.
#
# A REDEPLOY AT AN UNCHANGED VERSION (a rolled-back Worker, a wrangler
# config change) is a manual run with `redeploy` ticked. A plain dispatch
# still deploys only on drift, and a push can never redeploy: the input
# exists on a dispatch alone. (This comment promised the redeploy from a
# plain dispatch until 2026-10-23, when the staff feeds' config change
# (#1159) was dispatched and the run said "already current": every step
# was gated on the drift.)
name: Deploy relay (drops every connected player)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # SEAT2a part three (Seats-Arc 17): an urgent deploy may be forced through a siege's blackout - and a forced deploy
      # during a siege voids it (the room is lost; the holder keeps the seat, the Right carries to the next week)
      force:
        description: 'Deploy now even while a siege is live (voids it)'
        type: boolean
        default: false
      # STAFF-PANEL5-FEEDS (2026-10-23): deploy at the version already live, for a change only wrangler.toml carries.
      # It waits out a siege and the Spire like any deploy, runs the suite first, and drops every connected player.
      redeploy:
        description: 'Redeploy even though the live relay already serves this version (a wrangler.toml change)'
        type: boolean
        default: false

permissions:
  contents: read

# One at a time, and never cancelled halfway. A run interrupted between
# `wrangler` and the verify step is the one state this must not leave
# behind: the next run would compare against a live version nothing had
# confirmed, and call the drift gone.
concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  # SCALE1 (2026-09-30, the scaling audit): THE SUITE BEFORE A DEPLOY THAT
  # DROPS EVERY PLAYER - and only then. Most pushes deploy nothing here
  # (the relay is already current), so the suite runs only when the
  # version in source differs from the live one; the deploy job below
  # asks the same question again and decides as it always did.
  drift:
    runs-on: ubuntu-latest
    outputs:
      deploying: ${{ steps.d.outputs.deploying }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        env:
          REDEPLOY: ${{ github.event.inputs.redeploy }}
        run: |
          v=$(grep -oP "^export const RELAY_VERSION = '\\K[^']+" src/net/wire.js || true)
          got=$(curl -fsS --max-time 15 'https://daggerfall-online.mackcothran.workers.dev/health' | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
          if [ -n "$v" ] && { [ "$v" != "$got" ] || [ "$REDEPLOY" = "true" ]; }; then echo "deploying=true" >> "$GITHUB_OUTPUT"; else echo "deploying=false" >> "$GITHUB_OUTPUT"; fi
          echo "source says '${v}', live says '${got:-unreachable}'"

  # EG6a: and the Elite Breach's course sweep at 500 seeds a band, not a pull request's 25 - a relay that draws the halls
  # is deployed only when every course of them a real motor crossed (eg-sweep.yml)
  verify:
    needs: drift
    if: needs.drift.outputs.deploying == 'true'
    uses: ./.github/workflows/verify.yml
    with:
      build: false
      sweep: 500

  deploy:
    needs: [drift, verify]
    # the suite passed, or had nothing to pass because nothing deploys (skipped)
    if: ${{ !cancelled() && needs.drift.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE VERSION THIS RUN WOULD DEPLOY, read from the source rather than
      # typed into the workflow: one home, and a deploy cannot claim a name
      # the Worker does not carry. The home is src/net/wire.js since SLAM13
      # (the welcome carries it and the client compares against it;
      # server/src/index.js re-exports it for /health) - a grep of index.js
      # would have found the re-export and refused every run.
      - name: Read RELAY_VERSION from source
        id: ver
        run: |
          v=$(grep -oP "^export const RELAY_VERSION = '\\K[^']+" src/net/wire.js)
          test -n "$v" || { echo "::error::could not read RELAY_VERSION from src/net/wire.js"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "main says the relay should be $v"

      # ...AND WHAT IS ACTUALLY LIVE. The push got us here; the DRIFT
      # decides. This is the trigger proper.
      - name: Ask the live relay what it is serving
        id: live
        run: |
          url='https://daggerfall-online.mackcothran.workers.dev/health'
          got=$(curl -fsS --max-time 15 "$url" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
          echo "version=$got" >> "$GITHUB_OUTPUT"
          echo "live is serving '${got:-unreachable}'"

      - name: Nothing to do - the relay is already current
        if: steps.live.outputs.version == steps.ver.outputs.version && github.event.inputs.redeploy != 'true'
        run: echo "the relay already serves ${{ steps.ver.outputs.version }} - no deploy, no dropped players"

      # AN UNREADABLE RELAY IS NOT "NO DRIFT", and it is not a reason to
      # deploy either. Deploying blind over a relay we could not read turns
      # an outage into a redeploy nobody asked for, and drops every player
      # who was still connected to a Worker that was merely slow to answer.
      # A human dispatch can force it; a push may not.
      - name: Refuse to deploy over a relay that could not be read
        if: steps.live.outputs.version == '' && github.event_name == 'push'
        run: |
          echo "::error::/health did not answer - not deploying blind on a push. Dispatch by hand once it is reachable."
          exit 1

      # ═══ ACC1d D2: THE KEY THIS RELAY WOULD DEPLOY WITH ══════════
      #
      # The public half lives in `server/wrangler.toml` as a var - it can
      # verify and cannot mint, so there is nothing to hide, and fetching
      # it at runtime would put the account service in the relay's
      # startup path, which is the coupling the two-Worker split exists
      # to refuse. That copy can go stale, and a stale one fails in the
      # worst possible way: every token is refused as a bad signature and
      # no player is told why. The account service publishes the truth,
      # so this asks it.
      #
      # A SERVICE THAT DOES NOT ANSWER IS NOT A MISMATCH. It is one
      # Worker being slow, and refusing to deploy the relay over it would
      # be the exact coupling D1 and D2 both refused. Only a key that
      # answers AND disagrees stops the deploy.
      - name: The relay's identity key matches what the account service publishes
        run: |
          set -euo pipefail
          want=$(grep -oP '^IDENTITY_PUBLIC_KEY\s*=\s*"\K[^"]+' server/wrangler.toml || true)
          if [ -z "$want" ]; then
            echo "::error::server/wrangler.toml carries no IDENTITY_PUBLIC_KEY - this relay could vouch for nobody"
            exit 1
          fi
          url='https://daggerfall-accounts.mackcothran.workers.dev/v1/pubkey'
          got=$(curl -fsS --max-time 10 "$url" | sed -n 's/.*"key":"\([^"]*\)".*/\1/p' || true)
          if [ -z "$got" ]; then
            echo "::warning::/v1/pubkey did not answer - the relay's key could not be checked against it"
            exit 0
          fi
          if [ "$want" != "$got" ]; then
            echo "::error::the relay's IDENTITY_PUBLIC_KEY is not the one the account service publishes - every identity token would be refused"
            exit 1
          fi
          echo "the relay's identity key matches the live account service"

      # ═══ SEAT2a part three (Seats-Arc 17): THE SIEGE BLACKOUT ═══════
      #
      # A deploy drops every connected player, so it waits while any
      # siege room is live or starts within thirty minutes - the account
      # service's public question (`/v1/seats/sieges/live`, which names no
      # guild) - polling five minutes apart until none is. A dispatch with
      # `force` deploys at once. AN UNANSWERED QUESTION IS NOT A SIEGE:
      # the account service being slow must not hold the relay (the
      # coupling D1 and D2 refuse) - it is said, and the deploy goes on.
      # GitHub's own six hours bound the job; a blackout past it fails the
      # run, and the next push asks again.
      - name: Wait out any live siege (the blackout)
        if: (steps.live.outputs.version != steps.ver.outputs.version || github.event.inputs.redeploy == 'true') && github.event.inputs.force != 'true'
        run: |
          url='https://daggerfall-accounts.mackcothran.workers.dev/v1/seats/sieges/live'
          while :; do
            got=$(curl -fsS --max-time 10 "$url" || true)
            if [ -z "$got" ]; then
              echo "::warning::/v1/seats/sieges/live did not answer - not waiting on it"
              break
            fi
            if ! printf '%s' "$got" | grep -q '"live":true'; then
              echo "no siege is live or starting within thirty minutes"
              break
            fi
            echo "a siege is live or about to start (${got}) - waiting five minutes"
            sleep 300
          done

      # ═══ EG-H2 (bible/11-Multiplayer/Elite-Gates.md section 22): THE SPIRE'S DRAIN AND HOLD ═══
      #
      # A deploy restarts every Elite Breach's room. The relay's public `/v1/eg/live` (it names no breach) says how many
      # are live, whether every one stands between trials, the spec laws they were opened under and the longest's last
      # word. THE DRAIN: a breach under a law this build does not draw (src/net/eliteGates/egDurable.js EG_LAWS - the line below
      # reads it) would be voided by its own room as it wakes, so the deploy waits until none is live or the longest's
      # last word has passed - a developer shuts the road meanwhile (`/relay egDrain on`, and `off` after). THE HOLD:
      # otherwise it waits, at most twenty minutes, until every live breach is between trials (a closing, a swap or a
      # rest) - a room that wakes there holds the count until its company is back, then gives the gap back. A room woken
      # mid-trial gives the gap back too. An unanswered question is not a breach, and `force` deploys at once (a breach
      # whose law this build does not draw is voided: its stake returned, its Redoubts kept).
      - name: The Spire's drain and hold
        if: (steps.live.outputs.version != steps.ver.outputs.version || github.event.inputs.redeploy == 'true') && github.event.inputs.force != 'true'
        run: |
          url='https://daggerfall-online.mackcothran.workers.dev/v1/eg/live'
          laws=$(grep -oP "^export const EG_LAWS = Object\.freeze\(\{\K[^}]*" src/net/eliteGates/egDurable.js | grep -oP '\d+(?=:)' | tr '\n' ' ')
          echo "this build draws the spec laws: ${laws}"
          tries=0
          while :; do
            got=$(curl -fsS --max-time 15 "$url" || true)
            if [ -z "$got" ]; then echo "::warning::/v1/eg/live did not answer - not waiting on it"; break; fi
            live=$(printf '%s' "$got" | sed -n 's/.*"live":\([0-9]*\).*/\1/p')
            if [ "${live:-0}" = "0" ]; then echo "no Elite Breach is live"; break; fi
            stale=''
            for v in $(printf '%s' "$got" | sed -n 's/.*"laws":\[\([0-9,]*\)\].*/\1/p' | tr ',' ' '); do case " $laws " in *" $v "*) ;; *) stale="$stale $v";; esac; done
            if [ -n "$stale" ]; then
              until=$(printf '%s' "$got" | sed -n 's/.*"until":\([0-9]*\).*/\1/p')
              if [ "${until:-0}" -le "$(( $(date +%s) * 1000 ))" ]; then echo "the longest breach's last word has passed"; break; fi
              echo "THE DRAIN: ${live} breach(es) live under law(s)${stale} this build does not draw (${got}) - waiting five minutes (shut the road meanwhile: /relay egDrain on)"
              sleep 300
              continue
            fi
            if printf '%s' "$got" | grep -q '"between":true'; then echo "THE HOLD: every live breach stands between trials - each room holds for its company as it wakes"; break; fi
            tries=$((tries + 1))
            if [ "$tries" -ge 80 ]; then echo "::warning::a breach stayed in a trial for twenty minutes - deploying; its room gives the gap back as it wakes"; break; fi
            echo "THE HOLD: a breach is in a trial (${got}) - asking again in fifteen seconds"
            sleep 15
          done

      # EG-ZA (bible/11-Multiplayer/Elite-Gates.md section 22): A FORCE DEPLOY VOIDS EVERY LIVE ELITE BREACH, never spends
      # its keys. The deploy stamps the Worker with the moment before it goes (`EG_VOID_BEFORE`, epoch ms): a breach's room
      # woken under the stamp whose breach opened before it ends it as a void (src/net/eliteGates/egDurable.js egForceVoided) - the
      # entered members' end receipts say `void` and its opener who never entered is handed the void itself, so every stake
      # comes back and the Redoubts taken stay. The next deploy carries no stamp.
      - name: Deploy
        if: steps.live.outputs.version != steps.ver.outputs.version || github.event.inputs.redeploy == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "deploying ${{ steps.ver.outputs.version }} over ${{ steps.live.outputs.version }}"
          echo "every connected player's socket is about to drop and reconnect"
          if [ "$FORCE" = "true" ]; then
            stamp=$(date +%s%3N)
            echo "a FORCE deploy: every Elite Breach opened before ${stamp} is voided as its room wakes (its stakes returned, its Redoubts kept)"
            npx --yes wrangler@4 deploy --var "EG_VOID_BEFORE:${stamp}"
          else
            npx --yes wrangler@4 deploy
          fi

      # AND PROVE IT LANDED. The client's own deploy has been verified BY
      # CONTENT since U60 (`tools/verify-deploy.mjs`, whose header says HTTP
      # 200 proves nothing); the relay never was. A wrangler exit code of 0
      # over an unchanged Worker is a green deploy that did not happen, and
      # is indistinguishable from success without this. A REDEPLOY at the
      # same version passes here as soon as the relay answers again: /health
      # cannot tell the new config from the old, so wrangler's exit and its
      # version id in the log are the proof, and the change's own effect is
      # what to look at after.
      - name: Verify /health names this deploy
        if: steps.live.outputs.version != steps.ver.outputs.version || github.event.inputs.redeploy == 'true'
        run: |
          want='${{ steps.ver.outputs.version }}'
          url='https://daggerfall-online.mackcothran.workers.dev/health'
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 10 "$url" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: live reports '${got:-unreachable}', want '$want'"
            if [ "$got" = "$want" ]; then echo "VERIFIED: the relay serves $want"; exit 0; fi
            sleep 10
          done
          echo "::error::the relay never reported $want - the deploy did not take"
          exit 1
