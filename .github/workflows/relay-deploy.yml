# SRV-N/CI (2026-09-17): THE RELAY'S DEPLOY, IN CI AT LAST.
#
# `server/wrangler.toml` has said "npx wrangler deploy (CLOUDFLARE_API_TOKEN
# in the environment)" since ONLINE1, and the bible has repeated "the deploy
# is by hand, nothing in CI does it" through every online slice since. That
# was true, and it had two costs: a relay-changing slice could merge green
# with the live Worker still on the old deploy (SRV-N shipped exactly that
# way), and the only way to push one was for somebody to hold the API token
# in their hands.
#
# ═══ THIS DROPS EVERY CONNECTED PLAYER ════════════════════════════
#
# A relay deploy restarts every Durable Object and drops every open socket
# at once - peers vanish, chat goes quiet, and everyone reconnects. Do it
# at a chosen moment.
#
# MANUAL, NOT ON PUSH, and that is the whole of the protection. Running
# this means somebody went to Actions, picked it out of four workflows and
# pressed Run; a comment changing in `server/` cannot reach it.
#
# There WAS a confirm box here that wanted the word 'deploy' typed into it.
# It was dispatched twice and refused both times - once on an empty field,
# once on 'Run', because the operator typed the name of the button into the
# field beside it. It never stopped an accident; it only ever stopped the
# deploy. A warning belongs in a name and a header, not in a form field
# that can only be wrong.
name: Deploy relay (drops every connected player)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Say what this run is about to do
        run: |
          echo "Deploying the relay. Every connected player's socket will drop"
          echo "and reconnect. Triggered by ${{ github.actor }} on ${{ github.ref_name }}."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # THE VERSION THIS RUN INTENDS, read from the source rather than typed
      # into the workflow: one home, and a deploy cannot claim a name the
      # Worker does not carry. The home is src/net/wire.js since SLAM13
      # (the welcome carries it and the client compares against it;
      # server/src/index.js re-exports it for /health) - a grep of index.js
      # would have found the re-export and refused every run.
      - name: Read RELAY_VERSION from source
        id: ver
        run: |
          v=$(grep -oP "^export const RELAY_VERSION = '\\K[^']+" src/net/wire.js)
          test -n "$v" || { echo "::error::could not read RELAY_VERSION"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "deploying relay $v"

      - name: Deploy
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      # AND PROVE IT LANDED. The client's own deploy has been verified BY
      # CONTENT since U60 (`tools/verify-deploy.mjs`, whose header says HTTP
      # 200 proves nothing); the relay never was. `/health` names the deploy,
      # so ask it until it says the version this run built - a wrangler exit
      # code of 0 over an unchanged Worker is the failure this catches.
      - name: Verify /health names this deploy
        run: |
          want='${{ steps.ver.outputs.version }}'
          url='https://daggerfall-online.mackcothran.workers.dev/health'
          for i in $(seq 1 30); do
            got=$(curl -fsS --max-time 10 "$url" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)
            echo "attempt $i: live reports '${got:-unreachable}', want '$want'"
            if [ "$got" = "$want" ]; then echo "VERIFIED: the relay serves $want"; exit 0; fi
            sleep 10
          done
          echo "::error::the relay never reported $want - the deploy did not take"
          exit 1
