name: Guild gold grant

# GUILD-GRANT (2026-10-03, Mac: "Can we award the empire of tamriel guild 1.6mil gold") - GOLD INTO ONE GUILD'S
# TREASURY, AWARDED BY THE OPERATOR. No route mints gold into a treasury (tools/grantGuildGold.mjs says why), so an
# award is written here, by hand, from the Actions tab:
#
#   1. with apply off (the default): a DRY RUN. The run's summary names the guild the name found - its tag, its
#      members, its treasury and the part of it that buys a hall - and what the award would make them. Nothing is
#      written.
#   2. read it; then run again with apply on.
#
# The award goes into the treasury AND the part of it that buys a hall (`realm_gold`), so the gold buys a hall and
# comes back out to a realm character like any other; the guild's ledger says "The developers awarded the guild N".
# A name that finds no guild, or an award that would take its treasury past the cap, fails the run and writes nothing.

on:
  workflow_dispatch:
    inputs:
      guild:
        description: "The guild's name (case, spaces and punctuation aside)"
        required: true
        type: string
      gold:
        description: "The gold to award, digits only (1600000)"
        required: true
        type: string
      apply:
        description: "Write the award. Leave it off for a dry run that only reports."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never beside a deploy's migrations, a recovery or a restore: the deploy's own group, queued.
concurrency:
  group: account-deploy
  cancel-in-progress: false

jobs:
  grant:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: daggerfall-accounts
      WRANGLER: npx --yes wrangler@4
      # The inputs reach the scripts as ENVIRONMENT, never pasted into them: an input spliced into a `run:` line is a
      # shell command anybody who can start the run can type (account-recovery.yml's law).
      GUILD: ${{ inputs.guild }}
      GOLD: ${{ inputs.gold }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set for this repository - nothing else in this job can work"
            exit 1
          fi

      # The tool checks the name and the gold, and finds the guild by the key the service holds - the statements are
      # the tested ones (test/tooling/guildgrant.test.js), not ones written again here.
      - name: Write the statements
        run: |
          set -euo pipefail
          node tools/grantGuildGold.mjs --look "$GUILD" > "$RUNNER_TEMP/look.sql"
          node tools/grantGuildGold.mjs --sql "$GUILD" "$GOLD" > "$RUNNER_TEMP/grant.sql"

      # The deploy's own resolution (account-deploy.yml), read-only: this job never creates a database.
      - name: Resolve the database id into the runner's copy of the config
        run: |
          set -euo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::there is no database named $DB_NAME"
            exit 1
          fi
          echo "::add-mask::$id"
          toml=server-account/wrangler.toml
          sentinel='resolved-by-account-deploy-workflow'
          grep -q "$sentinel" "$toml" || { echo "::error::$toml no longer carries the sentinel"; exit 1; }
          sed -i "s|\"$sentinel\"|\"$id\"|" "$toml"
          if grep -q "$sentinel" "$toml"; then
            echo "::error::the sentinel survived the substitution"
            exit 1
          fi

      - name: Read the guild
        working-directory: server-account
        run: |
          set -euo pipefail
          out=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "$(cat "$RUNNER_TEMP/look.sql")")
          rows=$(echo "$out" | jq -c '[.[] | (.results // [])[]]')
          if [ "$(echo "$rows" | jq -r 'length')" != "1" ]; then
            echo "::error::no guild is named $GUILD - nothing was changed"
            exit 1
          fi
          echo "$rows" | jq -r --arg gold "$GOLD" '.[0] as $g | ($gold | tonumber) as $n |
            "**\($g.name) [\($g.tag)]**, \($g.members) members", "",
            "| | now | with the award |", "|---|---:|---:|",
            "| treasury | \($g.treasury) | \($g.treasury + $n) |",
            "| buys a hall | \($g.realm_gold) | \($g.realm_gold + $n) |", ""' >> "$GITHUB_STEP_SUMMARY"
          if [ "$APPLY" != "true" ]; then
            { echo "**A dry run: nothing was written.** Run again with apply on to award $GOLD gold."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # RETURNING names the row the statement changed; none is a refusal, and nothing was written.
      - name: Award the gold
        if: env.APPLY == 'true'
        working-directory: server-account
        run: |
          set -euo pipefail
          out=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "$(cat "$RUNNER_TEMP/grant.sql")")
          rows=$(echo "$out" | jq -c '[.[] | (.results // [])[]]')
          if [ "$(echo "$rows" | jq -r 'length')" != "1" ]; then
            echo "::error::the award changed no guild - $GUILD is gone, or $GOLD would take its treasury past the cap - nothing was changed"
            exit 1
          fi
          echo "$rows" | jq -r '.[0] | "**Awarded.** \(.name) [\(.tag)] now holds \(.treasury) gold, \(.realm_gold) of it able to buy a hall."' | tee -a "$GITHUB_STEP_SUMMARY"
