name: patch canonical clothing surface

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/patch-clothing-canonical.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical paperdoll surface patches
        run: |
          python tools/patch_clothing_canonical.py
          python tools/patch_clothing_hud_canonical.py
      - run: npm ci
      - name: Verify canonical clothing surface
        run: |
          node --check src/tools/paperdoll/clothingTexture.js
          node --check src/tools/paperdollViewer.js
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check
      - name: Commit verified canonical clothing pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tools/paperdoll/clothingTexture.js src/tools/paperdollViewer.js tools/clothingCanonicalProbe.mjs
          git commit -m "CLOTHING: canonicalize skewed paperdoll textures before wrapping"
          git push origin HEAD:chatgpt/exact-face-atlas
