name: patch clothing wrap hud

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/patch-wrap-hud.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/patch_wrap_hud.py
      - run: npm ci
      - name: Verify wrap HUD
        run: |
          node --check src/tools/paperdollViewer.js
          npm run build
          git diff --check
      - name: Commit verified HUD
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tools/paperdollViewer.js
          git commit -m "VIEWER: identify generated eight-way clothing wraps"
          git push origin HEAD:chatgpt/exact-face-atlas
