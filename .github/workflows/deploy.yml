# Production + experimental preview deploy: GitHub Pages via Actions.
#
# Root always comes from main and keeps the house `npm run check` gate.
# The exact-face-atlas experiment is built separately and mounted beneath
# /preview/exact-face-atlas/ so it can be opened on a phone without merging
# experimental rendering code into production.
#
# IMPORTANT: only main is allowed to publish Pages. A preview-branch push used
# to start a second Pages run in the same concurrency group, cancel the main
# build, then fail the protected github-pages environment before any steps ran.
# Main still checks out the preview branch below, so every main deploy carries
# the latest preview without letting the preview branch deploy by itself.
# Preview refresh: close voxel shoulder roof + preserve classic outfit textures.
name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact-face-atlas for targeted patch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply shoulder and texture ownership fixes
        run: python tools/patch_voxel_clothing_regressions.py

      - name: Install preview dependencies
        run: npm ci

      - name: Verify targeted regressions
        run: |
          node --check src/characters/neutralBody.js
          node --check src/characters/paperdollPayload.js
          node --check src/tools/paperdollViewer.js
          node tools/voxelClothingRegressionProbe.mjs
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check

      - name: Commit verified preview fix
        run: |
          git config user.name "Lattymoy"
          git config user.email "98724681+Lattymoy@users.noreply.github.com"
          git add src/characters/neutralBody.js src/characters/paperdollPayload.js src/tools/paperdollViewer.js tools/voxelClothingRegressionProbe.mjs
          if ! git diff --cached --quiet; then
            git commit -m "FIX: close voxel shoulders and preserve outfit textures"
            git push origin HEAD:chatgpt/exact-face-atlas
          fi

  deploy:
    needs: patch-preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm ci
        working-directory: production

      - name: Verify and build production
        run: npm run check
        working-directory: production

      - name: Assemble production site
        run: |
          mkdir -p site
          cp -a production/dist/. site/

      - name: Checkout exact-face-atlas preview
        uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          path: exact-face-atlas

      - name: Install preview dependencies
        run: npm ci
        working-directory: exact-face-atlas

      - name: Build exact-face-atlas preview
        run: npm run build
        working-directory: exact-face-atlas

      - name: Mount preview under production site
        run: |
          mkdir -p site/preview/exact-face-atlas
          cp -a exact-face-atlas/dist/. site/preview/exact-face-atlas/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
