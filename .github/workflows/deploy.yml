# Production deploy: GitHub Pages via Actions (build_type: workflow).
# Gate is the house `npm run check` (suite + vite build) - a red suite
# never ships. The build contains NO game data: ARENA2 is freeware but
# non-redistributable (Port-Doctrine) and is never committed or bundled;
# the deployed app loads user-supplied data at runtime.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check   # suite + build, the same local gate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
