# Production + experimental preview deploy: GitHub Pages via Actions.
#
# Root always comes from release and keeps the house `npm run check` gate -
# FLOW1 (2026-09-26): as verify.yml's parallel jobs (lint and the types,
# eight balanced test shards) beside the site's own build, every one of
# them on the SAME commit (the `release` job pins it: two merges in a row
# can not deploy a tree the shards did not see). `deploy` publishes only
# once all of them passed. The same gate as one serial `npm run check`.
# The exact-face-atlas experiment is built separately and mounted beneath
# /preview/exact-face-atlas/ so it can be opened on a phone without merging
# experimental rendering code into production.
#
# RELEASE-FLOW (2026-10-19, bible/01-Overview/Release-Flow.md): THE SITE IS
# PUBLISHED BY HAND, FROM `release`. Every push to main published it until
# now; main is the dev environment's now (dev-deploy.yml), and a player
# meets a change only once it is promoted into release and a release
# manager dispatches this and approves its publish (the github-pages
# environment admits release alone and asks its reviewers).
#
# IMPORTANT: only release is allowed to publish Pages. A preview-branch push
# used to start a second Pages run in the same concurrency group, cancel the
# production build, then fail the protected github-pages environment before
# any steps ran. Release still checks out the preview branch below, so every
# deploy carries the latest preview without letting the preview branch
# deploy by itself.
# Preview refresh: traced classic weapon/shield art on voxel held items.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # the one commit every job below verifies, builds and publishes: release's
  # head as this run began - and RELEASE-FLOW: a run dispatched on any other
  # branch stops here, before anything is built or published
  release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Only release publishes the site
        if: github.ref != 'refs/heads/release'
        run: |
          echo "::error::the site is published from the release branch alone - dispatch this on release (bible/01-Overview/Release-Flow.md)"
          exit 1
      - id: sha
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: release
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      build: false

  # CI-TIMES (2026-10-19): the shards' times this green run recorded, saved
  # for release's later runs (test-times.yml) - beside the publish, which
  # never waits on it (main's are saved by check.yml's run on main)
  times:
    needs: [release, verify]
    uses: ./.github/workflows/test-times.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
      planned: ${{ needs.verify.outputs.times }}

  site:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      account_version: ${{ steps.account.outputs.version }}
      account_base: ${{ steps.account.outputs.base }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          path: production
          # REL8: the whole history - the build stamps the player's update number (scripts/updateNumber.mjs), counted
          # along release's first parents from the merge that set the line; a depth-1 clone cannot count it
          fetch-depth: 0

      # AUDIT PRE-MERGE 0929 T2: the account service this build's forms
      # ask, and the version it must serve before they may (the deploy
      # job waits on it) - read off the tree, never typed here
      - name: Read the account service this build talks to
        id: account
        working-directory: production
        run: |
          set -euo pipefail
          v=$(grep -oP "^export const ACCOUNT_VERSION = '\K[^']+" server-account/src/service.js)
          base=$(grep -oP "^export const DEFAULT_ACCOUNT_SERVICE = '\K[^']+" src/net/accountClient.js)
          test -n "$v" || { echo "::error::could not read ACCOUNT_VERSION from server-account/src/service.js"; exit 1; }
          test -n "$base" || { echo "::error::could not read DEFAULT_ACCOUNT_SERVICE from src/net/accountClient.js"; exit 1; }
          { echo "version=$v"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production/package-lock.json

      # RELEASE-FLOW: the update number this build stamps counts release's own line, and the release before must stand
      # on it (a release branched from main before main's last release would publish a number main already had)
      - name: Release's line holds the release before
        run: node scripts/desktopRelease.mjs line
        working-directory: production

      - name: Install production dependencies
        run: npm ci
        working-directory: production

      - name: Build production
        run: npm run build
        working-directory: production

      - name: Assemble production site
        run: |
          mkdir -p site
          cp -a production/dist/. site/

      - name: Checkout exact-face-atlas preview
        uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          path: exact-face-atlas

      - name: Install preview dependencies
        run: npm ci
        working-directory: exact-face-atlas

      - name: Build exact-face-atlas preview
        run: npm run build
        working-directory: exact-face-atlas

      - name: Mount preview under production site
        run: |
          mkdir -p site/preview/exact-face-atlas
          cp -a exact-face-atlas/dist/. site/preview/exact-face-atlas/

      # THE GUN LAB, ON ITS OWN (Mac, 2026-09-19: "I want to test this
      # as its own deploy"). Pages serves ONE site per repository, so a
      # thing that wants its own link gets its own directory under it,
      # and only release publishes. It builds from its OWN config
      # (vite.config.gun.js) - the page, its module, its art and its
      # sounds, nothing of the game - so the lab's link does not ride
      # on the game's build, and the directory carries an index.html so
      # /preview/gun-lab/ opens it.
      #
      # AUDIT-THUNDERLOCK F6: this checked out the FEATURE BRANCH by
      # name, which is a loaded gun pointed at production - deleting
      # that branch after the merge would fail this step and take the
      # whole Pages deploy down with it, game and all. It builds from
      # the production checkout instead: the lab is in the tree it
      # publishes, and a preview that needs its own branch is what the
      # `exact-face-atlas` block above is for.
      - name: Build gun lab
        run: npx vite build --config vite.config.gun.js
        working-directory: production

      - name: Mount the gun lab under production site
        run: |
          mkdir -p site/preview/gun-lab
          cp -a production/dist-gun/. site/preview/gun-lab/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [verify, site]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ═══ AUDIT PRE-MERGE 0929 T2: AND THE ACCOUNT SERVICE GOES FIRST ══
      #
      # THE FORMS ASK WHAT THE SERVICE RECORDS. TERMS1's Create account
      # sends the versions its player ticked, and a service from before
      # it answers 200 and records nothing - a named account whose row
      # says "never asked" for a player who ticked both boxes. This job
      # and account-deploy.yml start on the same push with nothing
      # ordering them, and that job itself waits on the relay - or
      # deploys nothing. So the site is published only once the
      # service's /v1/health serves the version this tree names (or a
      # later one), and not at all if it never does: the old site keeps
      # asking the old service, which it knows. A push that changed no
      # account behaviour finds it served already: one request.
      # DEPLOY-WAIT (2026-10-17, #983's site gave up at 15:30 and its
      # service came at 15:36): AS LONG AS THE SERVICE MAY TAKE. The
      # account deploy waits up to five and a half hours on the relay
      # (1000 asks, SEAT2a's siege blackout) - and a relay bump's
      # 500-seed sweep alone ran 47 minutes - so thirty minutes gave up
      # on a chain still moving. 1050 asks: the relay's wait, then the
      # service's own deploy and checks, inside GitHub's six-hour job
      # ceiling (test/server/audit0929_terms.test.js holds the three).
      - name: Wait for the account service to serve this build's version
        env:
          WANT: ${{ needs.site.outputs.account_version }}
          BASE: ${{ needs.site.outputs.account_base }}
        run: |
          set -euo pipefail
          test -n "$WANT" && test -n "$BASE" || { echo "::error::the site job named no account service"; exit 1; }
          n() { printf '%s' "$1" | grep -oE '[0-9]+$' || echo -1; }
          for i in $(seq 1 1050); do
            got=$(curl -fsS --max-time 15 "$BASE/v1/health" | sed -n 's/.*"v":"\([^"]*\)".*/\1/p' || true)
            if [ "$got" = "$WANT" ] || { [ -n "$got" ] && [ "$(n "$got")" -ge "$(n "$WANT")" ]; }; then
              echo "the account service serves ${got} - this build's forms may ask it"
              exit 0
            fi
            echo "the account service serves '${got:-unreachable}', not $WANT yet - waiting (${i}/1050)"
            sleep 20
          done
          echo "::error::the account service never came to serve $WANT in five hours fifty minutes - not publishing a site whose forms it would not answer (see account-deploy.yml's run, then re-run this)"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
