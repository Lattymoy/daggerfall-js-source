name: Realm restore (what a deleted customs character took with it)

# RESTORE (2026-09-29, Mac: "I want people to get their stuff back"; of the homes a deleted customs character took with
# it: "To the offline character"). From CUSTOMS-CARRY's arrival on main (2026-09-29 03:09:50 UTC) until HOUSE-LOSS, the
# Online door's Delete on a customs character whose first save never landed took its online home - every piece, the
# hidden furniture - its guild place and its track with it, and left the census spent
# (bible/01-Overview/bugs/Field-Bugs-2026-09-29.md). Those rows are gone from the database; D1 Time Travel still holds them.
#
# RUN BY HAND from the Actions tab, on main, at a quiet hour:
#   1. with apply off (the default): a DRY RUN. The run's summary lists who gets what back, who is held for you (an
#      account whose deleted character traded in the realm), and what someone else holds now. Nothing is written.
#   2. read it; then run again with apply on.
#
# WHAT A RUN DOES, and why each step stands where it does:
#   - the account service is HELD FOR MAINTENANCE (deployed with MAINTENANCE = "1": every call but /v1/health and
#     /v1/pubkey answers 503, which a playing tab's checkpoint waits out) - a rewind swallows whatever is written in
#     its minute, so nothing may be;
#   - the present is KEPT (its Time Travel bookmark and its row counts) and EXPORTED;
#   - the database is REWOUND to `before`, in place - the only way D1 reads its own past - and proven there; what stood
#     then is exported; and the present is PUT BACK by its bookmark, ALWAYS, and proven by its counts;
#   - tools/realmRestore.mjs plans the restore from the two exports (test/net/realm_restore.test.js), and apply writes it;
#   - the maintenance is lifted by deploying the Worker as this branch has it - but NEVER over a rewound database: if
#     the present could not be put back, the service stays held and the run says exactly what to type.
# No player row is ever exported: handles are asked for by name, and nothing else of an account.

on:
  workflow_dispatch:
    inputs:
      before:
        description: "A moment before the loss, UTC (RFC 3339). The default is just before CUSTOMS-CARRY reached main."
        required: true
        default: "2026-09-29T03:09:00Z"
        type: string
      apply:
        description: "Write the restore. Leave it off for a dry run that only reports."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# Never beside a deploy's migrations, a recovery or another restore: the deploy's own group, queued.
concurrency:
  group: account-deploy
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: daggerfall-accounts
      WRANGLER: npx --yes wrangler@4
      # The inputs reach the scripts as ENVIRONMENT, never pasted into them: an input spliced into a `run:` line is a
      # shell command anybody who can start the run can type (account-recovery.yml's law).
      BEFORE: ${{ inputs.before }}
      APPLY: ${{ inputs.apply }}
      REWOUND: "0"
      COUNTS_SQL: "SELECT (SELECT COUNT(*) FROM players) AS p, (SELECT COUNT(*) FROM realm_characters) AS r, (SELECT COUNT(*) FROM homes) AS h, (SELECT COUNT(*) FROM home_decor) AS d, (SELECT COUNT(*) FROM d1_migrations) AS m"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set for this repository - nothing else in this job can work"
            exit 1
          fi

      # A moment Time Travel still holds (thirty days on the Paid plan, seven on the Free one - wrangler says which) and
      # not one still to come; kept in seconds for the proof after the rewind.
      - name: Read the moment
        run: |
          set -euo pipefail
          s=$(node -e '
            const t = Date.parse(process.env.BEFORE), now = Date.now();
            if (!Number.isFinite(t)) { console.error("not a moment: " + process.env.BEFORE); process.exit(1); }
            if (t >= now) { console.error("that moment has not happened yet"); process.exit(1); }
            if (now - t > 30 * 24 * 3600 * 1000) { console.error("past what Time Travel holds"); process.exit(1); }
            process.stdout.write(String(Math.floor(t / 1000)));
          ') || { echo "::error::the moment '$BEFORE' cannot be read back"; exit 1; }
          echo "BEFORE_S=$s" >> "$GITHUB_ENV"

      # The deploy's own resolution (account-deploy.yml), read-only: this job never creates a database.
      - name: Resolve the database id into the runner's copy of the config
        run: |
          set -euo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::there is no database named $DB_NAME"
            exit 1
          fi
          echo "::add-mask::$id"
          toml=server-account/wrangler.toml
          sentinel='resolved-by-account-deploy-workflow'
          grep -q "$sentinel" "$toml" || { echo "::error::$toml no longer carries the sentinel"; exit 1; }
          sed -i "s|\"$sentinel\"|\"$id\"|" "$toml"
          if grep -q "$sentinel" "$toml"; then
            echo "::error::the sentinel survived the substitution"
            exit 1
          fi

      # PROVEN BY CONTENT, AND BY A WRITE REFUSED - health says it is held, and a write route asked with no credential
      # is refused as maintenance (an instance not yet held answers 401), five times running - one instance's word is
      # not every instance's: AUDIT-ACC's lesson at /health. Never a guest: an account route writes its rate row on an
      # instance not yet held, before any refusal, and this request writes nothing wherever it lands.
      - name: Hold the service for maintenance
        working-directory: server-account
        run: |
          set -euo pipefail
          $WRANGLER deploy --var MAINTENANCE:1 | tee /tmp/held.log
          base=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/held.log | head -1)
          test -n "$base" || { echo "::error::wrangler did not print a workers.dev URL"; exit 1; }
          ok=0
          for i in $(seq 1 36); do
            h=$(curl -fsS --max-time 10 "$base/v1/health" || true)
            code=$(curl -sS --max-time 10 -o /tmp/g.json -w '%{http_code}' -X POST "$base/v1/realm/customs" -H 'content-type: application/json' -d '{}' || true)
            if printf '%s' "$h" | grep -q '"maintenance":true' && [ "$code" = "503" ] && grep -q '"maintenance"' /tmp/g.json; then ok=$((ok + 1)); else ok=0; fi
            echo "attempt $i: health ${h:-unreachable}, a write answered ${code:-nothing} ($ok running)"
            if [ "$ok" -ge 5 ]; then break; fi
            sleep 5
          done
          if [ "$ok" -lt 5 ]; then echo "::error::the service never held - nothing was rewound"; exit 1; fi
          sleep 20   # a request an instance took before it held may still be finishing

      - name: Keep the present
        working-directory: server-account
        run: |
          set -euo pipefail
          b=$($WRANGLER d1 time-travel info "$DB_NAME" --json | jq -r '.bookmark // empty')
          test -n "$b" || { echo "::error::no bookmark for the present"; exit 1; }
          c=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "$COUNTS_SQL" | jq -c '.[0].results[0]')
          test -n "$c" && [ "$c" != "null" ] || { echo "::error::the present's counts could not be read"; exit 1; }
          echo "NOW_BOOKMARK=$b" >> "$GITHUB_ENV"
          echo "NOW_COUNTS=$c" >> "$GITHUB_ENV"
          echo "the present: bookmark $b, $c"
          { echo "The present's bookmark, should it ever need putting back by hand:"; echo ""; echo "    npx wrangler d1 time-travel restore $DB_NAME --bookmark $b"; echo ""; echo "then redeploy the Worker (its isolates keep the weeks they read settled - server-account/src/weekKept.js)."; echo ""; } >> "$GITHUB_STEP_SUMMARY"

      - name: Export the present
        working-directory: server-account
        run: |
          set -euo pipefail
          $WRANGLER d1 export "$DB_NAME" --remote --output "$RUNNER_TEMP/now.sql" --table homes --table home_decor --table home_hidden --table guild_members --table guilds --table renown_tracks --table realm_census --table realm_characters --table realm_trades
          $WRANGLER d1 execute "$DB_NAME" --remote --json --command "SELECT id, handle FROM players WHERE handle IS NOT NULL" > "$RUNNER_TEMP/handles.json"

      # REWOUND is set BEFORE the rewind is asked for: a rewind that fails half-way is put back as one that landed.
      # PROVEN THERE BY CONTENT: no account newer than the moment stands in it (a restore that did not happen reads the
      # present, where one does) - and the bookmark has moved.
      - name: Rewind to before the loss
        working-directory: server-account
        run: |
          set -euo pipefail
          echo "REWOUND=1" >> "$GITHUB_ENV"
          $WRANGLER d1 time-travel restore "$DB_NAME" --timestamp "$BEFORE" --json | tee /tmp/rewind.json
          b=$($WRANGLER d1 time-travel info "$DB_NAME" --json | jq -r '.bookmark // empty')
          if [ -z "$b" ] || [ "$b" = "$NOW_BOOKMARK" ]; then echo "::error::the database did not move"; exit 1; fi
          newest=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "SELECT COALESCE(MAX(created_at), 0) AS t FROM players" | jq -r '.[0].results[0].t')
          if [ "$newest" -gt $((BEFORE_S + 60)) ]; then echo "::error::the database is not at $BEFORE (an account from $newest stands in it)"; exit 1; fi
          echo "rewound to $BEFORE: the newest account is from $newest"

      - name: Export what stood then
        working-directory: server-account
        run: |
          set -euo pipefail
          $WRANGLER d1 export "$DB_NAME" --remote --output "$RUNNER_TEMP/then.sql" --table homes --table home_decor --table home_hidden --table guild_members --table renown_tracks

      # ALWAYS, once a rewind was asked for - and proven by the counts the present was kept with.
      - name: Put the present back
        if: always() && env.REWOUND == '1'
        working-directory: server-account
        run: |
          set -euo pipefail
          back() {
            echo "::error::THE PRESENT IS NOT BACK. The service stays held. Put it back by hand: npx wrangler d1 time-travel restore $DB_NAME --bookmark $NOW_BOOKMARK"
            exit 1
          }
          $WRANGLER d1 time-travel restore "$DB_NAME" --bookmark "$NOW_BOOKMARK" --json | tee /tmp/back.json || back
          c=$($WRANGLER d1 execute "$DB_NAME" --remote --json --command "$COUNTS_SQL" | jq -c '.[0].results[0]') || back
          [ "$c" = "$NOW_COUNTS" ] || { echo "counts now $c, kept $NOW_COUNTS"; back; }
          echo "REWOUND=0" >> "$GITHUB_ENV"
          echo "the present is back: $c"

      - name: Plan the restore
        run: |
          set -euo pipefail
          node tools/realmRestore.mjs --then "$RUNNER_TEMP/then.sql" --now "$RUNNER_TEMP/now.sql" --handles "$RUNNER_TEMP/handles.json" --out "$RUNNER_TEMP/restore.sql" --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$APPLY" != "true" ]; then
            { echo ""; echo "**A dry run: nothing was written.** Run again with apply on to write it."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write the restore
        if: env.APPLY == 'true'
        working-directory: server-account
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/restore.sql" ]; then echo "nothing to write"; exit 0; fi
          $WRANGLER d1 execute "$DB_NAME" --remote --file "$RUNNER_TEMP/restore.sql"
          { echo ""; echo "**Written.** Every statement is INSERT OR IGNORE or the census's guarded UPDATE, so a run cut short is run again."; } >> "$GITHUB_STEP_SUMMARY"

      # NEVER over a rewound database: with the present not back, the service stays held (the step above says why).
      - name: Lift the maintenance
        if: always() && env.REWOUND != '1'
        working-directory: server-account
        run: |
          set -euo pipefail
          $WRANGLER deploy | tee /tmp/lift.log
          base=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/lift.log | head -1)
          test -n "$base" || { echo "::error::wrangler did not print a workers.dev URL - check /v1/health by hand"; exit 1; }
          for i in $(seq 1 36); do
            h=$(curl -fsS --max-time 10 "$base/v1/health" || true)
            if [ -n "$h" ] && ! printf '%s' "$h" | grep -q '"maintenance"'; then echo "the service is open again: $h"; exit 0; fi
            sleep 5
          done
          echo "::error::the service still says it is held"
          exit 1
