# ONE-OFF DIAGNOSTICS, SECOND PASS (2026-10-06 evening, the account service overloaded a second time - decorations not
# showing; the owner allowed it): READ-ONLY. When the overload began, route by route (the service's SCALE1 metrics by the
# hour and by five minutes), against the relay's hellos and refusals (SCALE2b), and this hour's queries. THIS
# REPOSITORY'S ACTIONS LOGS ARE PUBLIC, so every step prints totals only. Removed once read.
name: d1-insights (one-off, read-only)
on:
  push:
    branches: [ccr-e812e54a-50fqma]
    paths: [".github/workflows/d1-insights.yml"]
permissions:
  contents: read
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: a27adccb38c8e8b82fa32e5736274a94
      DB_NAME: daggerfall-accounts
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: wrangler
        run: npm i -g wrangler@4 >/dev/null 2>&1 && wrangler --version

      - name: the account service's routes by the hour, and by five minutes (Analytics Engine)
        continue-on-error: true
        run: |
          sql() { echo "=== $1"; curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data "$2 FORMAT JSONEachRow" || true; echo; }
          R="'/v1/auth/token','/v1/seats/watch','/v1/seats/list','/v1/homes/town','/v1/homes/yards','/v1/prof/pixels','/v1/realm/:id/data','/v1/board/read','/v1/prof/state','/v1/realm/unions','/v1/realm/lineage','/v1/realm/lineages'"
          sql "the routes by the hour, requests only (30 h)" "SELECT toStartOfInterval(timestamp, INTERVAL '1' HOUR) AS hour, blob1 AS route, SUM(_sample_interval) AS requests FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '30' HOUR AND blob1 IN ($R) GROUP BY hour, route ORDER BY hour, route"
          sql "the routes by the hour (30 h)" "SELECT toStartOfInterval(timestamp, INTERVAL '1' HOUR) AS hour, blob1 AS route, SUM(_sample_interval) AS requests, SUM(IF(double2 >= 500, _sample_interval, 0)) AS failed FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '30' HOUR AND blob1 IN ($R) GROUP BY hour, route ORDER BY hour, route"
          sql "the routes by five minutes (last 2 h)" "SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, blob1 AS route, SUM(_sample_interval) AS requests, SUM(IF(double2 >= 500, _sample_interval, 0)) AS failed FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '2' HOUR AND blob1 IN ($R) GROUP BY t, route ORDER BY t, route"
          sql "everything by five minutes (last 2 h)" "SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, SUM(_sample_interval) AS requests, SUM(IF(double2 >= 500, _sample_interval, 0)) AS failed, SUM(_sample_interval * double3) AS d1 FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '2' HOUR GROUP BY t ORDER BY t"

      - name: the relay's rooms by five minutes (Analytics Engine)
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data "SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, blob1 AS kind, SUM(_sample_interval * double3) AS hellos, SUM(_sample_interval * double4) AS busy, SUM(_sample_interval * double12) AS refused, SUM(_sample_interval * double2) AS sockets FROM daggerfall_relay WHERE timestamp > NOW() - INTERVAL '2' HOUR AND blob1 IN ('chat', 'world', 'interior', 'dungeon') GROUP BY t, kind ORDER BY t, kind FORMAT JSONEachRow" || true
          echo "=== the relay's refusals by the hour (30 h)"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data "SELECT toStartOfInterval(timestamp, INTERVAL '1' HOUR) AS hour, SUM(_sample_interval * double3) AS hellos, SUM(_sample_interval * double12) AS refused FROM daggerfall_relay WHERE timestamp > NOW() - INTERVAL '30' HOUR GROUP BY hour ORDER BY hour FORMAT JSONEachRow" || true

      - name: the queries this hour
        continue-on-error: true
        run: |
          wrangler d1 insights "$DB_NAME" --time-period 1h --sort-by time --sort-type sum --limit 12 --json \
            | jq -c '.[] | {n: .numberOfTimesRun, ms: (.totalDurationMs | floor), avgMs: (.avgDurationMs * 100 | floor / 100), rows: .totalRowsRead, avgRows: (.avgRowsRead | floor), q: (.query | .[0:160])}' || true
