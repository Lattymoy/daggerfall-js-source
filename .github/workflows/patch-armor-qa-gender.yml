name: patch armor qa gender

on:
  push:
    branches: [chatgpt/exact-face-atlas]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply armor QA/gender patch
        run: python tools/patch_armor_qa_gender.py
      - name: Install dependencies
        run: npm ci
      - name: Verify wardrobe matrix
        run: |
          node --check src/tools/paperdollViewer.js
          node tools/variantMatrixProbe.mjs
          node tools/armorTextureLayersProbe.mjs
          node tools/armorViewerProbe.mjs
          node tools/voxelClothingRegressionProbe.mjs
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check
      - name: Commit verified QA integration
        run: |
          git config user.name "Lattymoy"
          git config user.email "98724681+Lattymoy@users.noreply.github.com"
          git add src/tools/paperdollViewer.js viewer.html tools/variantMatrixProbe.mjs
          git diff --cached --quiet && exit 0
          git commit -m "WARDROBE: expose gender axis and armor texture QA"
          git push origin HEAD:chatgpt/exact-face-atlas
