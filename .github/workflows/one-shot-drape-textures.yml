name: one-shot drape textures

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - .github/workflows/one-shot-drape-textures.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python tools/patch_drape_textures.py
      - run: npm ci
      - name: Verify draped source texture pass
        run: |
          node --check src/tools/paperdoll/clothingTexture.js
          node --check src/tools/paperdollViewer.js
          npm run build
          git diff --check
      - name: Commit verified drape texture pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/tools/paperdoll/clothingTexture.js src/tools/paperdollViewer.js
          git commit -m "CLOTHING: map classic source art onto draped garments"
          git push origin HEAD:chatgpt/exact-face-atlas
