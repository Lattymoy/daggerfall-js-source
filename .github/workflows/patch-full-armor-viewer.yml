name: patch full armor viewer

on:
  push:
    branches: [chatgpt/exact-face-atlas]
    paths:
      - tools/patch_full_armor_viewer.py
      - .github/workflows/patch-full-armor-viewer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/exact-face-atlas
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply full armor viewer patch
        run: python tools/patch_full_armor_viewer.py
      - name: Install dependencies
        run: npm ci
      - name: Verify armor roster and viewer integration
        run: |
          node --check src/characters/armorSet.js
          node --check src/characters/pieces/pauldrons.js
          node --check src/characters/paperdollPayload.js
          node --check src/tools/paperdollViewer.js
          node tools/armorViewerProbe.mjs
          node tools/voxelClothingRegressionProbe.mjs
          node tools/clothingCanonicalProbe.mjs
          npm run build
          git diff --check
      - name: Commit verified armor implementation
        run: |
          git config user.name "Lattymoy"
          git config user.email "98724681+Lattymoy@users.noreply.github.com"
          git add src/characters/paperdollPayload.js src/tools/paperdollViewer.js viewer.html tools/armorViewerProbe.mjs
          git diff --cached --quiet && exit 0
          git commit -m "ARMOR: make every wearable slot selectable in viewer"
          git push origin HEAD:chatgpt/exact-face-atlas
