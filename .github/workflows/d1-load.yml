name: Account database load

# D1-LOAD (2026-10-11, from play: the account service stayed slow after SEAT-CAP and SEAT-LEASE - "So it works, but it
# takes forever to load"; the owner: "do whatever is the most detailed") - WHAT IS FILLING THE ONE DATABASE, READ BY THE
# OPERATOR. Run it by hand from the Actions tab; the run's summary carries two readings, each from the database's own
# side of things:
#   1. D1's query insights - the statements that took the most of the database's time over the window, or read or
#      wrote the most rows (the sort_by input; wrangler d1 insights; the window rounds up to the day it allows);
#   2. the service's own metrics (server-account/src/metrics.js, every request and cron firing one Analytics Engine
#      point) - the D1 wait by route, minute by minute, the clock's jobs, every answer that was not a 2xx, and the rows
#      written by route and tables.
# The questions are tools/d1Load.mjs's, tested in test/server/d1load.test.js - not written again here. It READS ONLY.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to read (1 to 168)."
        required: false
        default: "1"
        type: string
      # COST-0 (2026-10-24: D1 read some 7.4 billion rows a day): what the insights rank the statements by - their time
      # (the default), the rows they read, or the rows they wrote
      sort_by:
        description: "Rank D1's statements by (time, reads or writes)."
        required: false
        default: "time"
        type: choice
        options:
          - time
          - reads
          - writes

permissions:
  contents: read

# Its own group, never the deploy's (sd-clears.yml's law): a group keeps ONE pending run, and a read dispatched while a
# deploy waited behind another would have cancelled that deploy.
concurrency:
  group: d1-load
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: daggerfall-accounts
      WRANGLER: npx --yes wrangler@4
      # The input reaches the scripts as ENVIRONMENT, never pasted into them (account-recovery.yml's law); the tool
      # refuses anything but whole hours.
      HOURS: ${{ inputs.hours }}
      SORT_BY: ${{ inputs.sort_by }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set for this repository - nothing else in this job can work"
            exit 1
          fi
          node tools/d1Load.mjs --sql routes "$HOURS" > /dev/null

      # The deploy's own resolution (account-deploy.yml), read-only: this job never creates a database.
      - name: Resolve the database id into the runner's copy of the config
        run: |
          set -euo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::there is no database named $DB_NAME"
            exit 1
          fi
          echo "::add-mask::$id"
          toml=server-account/wrangler.toml
          sentinel='resolved-by-account-deploy-workflow'
          grep -q "$sentinel" "$toml" || { echo "::error::$toml no longer carries the sentinel"; exit 1; }
          sed -i "s|\"$sentinel\"|\"$id\"|" "$toml"
          if grep -q "$sentinel" "$toml"; then
            echo "::error::the sentinel survived the substitution"
            exit 1
          fi

      # D1's own reading. A refusal is a WARNING, never a stop - the metrics below still answer.
      - name: Read D1's query insights
        working-directory: server-account
        run: |
          set -uo pipefail
          # COST-0: only a ranking the choice input offers reaches wrangler (an empty input is time's)
          case "${SORT_BY:-time}" in
            time|reads|writes) sort="${SORT_BY:-time}" ;;
            *) echo "::warning::not a ranking: ${SORT_BY} - the insights are skipped"; exit 0 ;;
          esac
          period=1d
          [ "$HOURS" -gt 24 ] 2>/dev/null && period=7d
          if out=$($WRANGLER d1 insights "$DB_NAME" --sort-type sum --sort-by "$sort" --limit 30 --timePeriod "$period" --json 2>/tmp/insights.err); then
            echo "$out" | jq -r --arg p "$period" --arg s "$sort" '"**D1 query insights - the statements ranked by \($s), summed (\($p))**", "",
              "| total ms | runs | avg ms | avg rows read | total rows read | total rows written | statement |", "|---:|---:|---:|---:|---:|---:|---|",
              (.[] | "| \(.totalDurationMs // .sumDurationMs // "" | tostring) | \(.numberOfTimesRun // .count // "" | tostring) | \(.avgDurationMs // "" | tostring) | \(.avgRowsRead // "" | tostring) | \(.totalRowsRead // .sumRowsRead // "" | tostring) | \(.totalRowsWritten // .sumRowsWritten // "" | tostring) | `\((.query // "") | gsub("[|`\n]"; " ") | .[0:300])` |"),
              ""' | tee -a "$RUNNER_TEMP/all.md" >> "$GITHUB_STEP_SUMMARY" || echo "::warning::the insights answer was not in the shape expected"
          else
            echo "::warning::wrangler d1 insights was refused - $(head -c 400 /tmp/insights.err)"
          fi

      - name: Read the service's metrics
        run: |
          set -euo pipefail
          acct=$(grep -oP '^account_id\s*=\s*"\K[^"]+' server-account/wrangler.toml)
          echo "**Window: the last ${HOURS:-1} hour(s), to $(date -u +%H:%M) UTC**" | tee -a "$RUNNER_TEMP/all.md" >> "$GITHUB_STEP_SUMMARY"
          echo "" | tee -a "$RUNNER_TEMP/all.md" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for q in $(node tools/d1Load.mjs --names); do
            node tools/d1Load.mjs --sql "$q" "$HOURS" > "$RUNNER_TEMP/$q.sql"
            code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/$q.json" -w '%{http_code}' -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$acct/analytics_engine/sql" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "@$RUNNER_TEMP/$q.sql") || true
            if [ "${code:-000}" = "200" ] && node tools/d1Load.mjs --table "$q" "$RUNNER_TEMP/$q.json" | tee -a "$RUNNER_TEMP/all.md" >> "$GITHUB_STEP_SUMMARY"; then
              echo "" | tee -a "$RUNNER_TEMP/all.md" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "::warning::the $q question was refused (HTTP ${code:-000}) - the token needs Account Analytics: Read"
              head -c 400 "$RUNNER_TEMP/$q.json" || true
              echo
            fi
          done
          [ "$failed" = "0" ] || echo "::warning::some readings are missing from the summary - see the warnings above"


      # STAFF-SPEED (2026-10-29, investigation only): the staff panel's own routes, by route and status, with wall time
      - name: Staff routes
        if: always()
        run: |
          set -uo pipefail
          acct=$(grep -oP '^account_id\s*=\s*"\K[^"]+' server-account/wrangler.toml)
          q="SELECT blob1 AS route, blob3 AS status, blob4 AS word, SUM(_sample_interval) AS n, quantileWeighted(0.5)(double1, _sample_interval) AS p50_ms, quantileWeighted(0.95)(double1, _sample_interval) AS p95_ms, SUM(double5 * _sample_interval) / SUM(_sample_interval) AS wait_ms_avg, SUM(double3 * _sample_interval) / SUM(_sample_interval) AS stmts_avg FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '${HOURS}' HOUR AND startsWith(blob1, '/v1/staff/') GROUP BY route, status, word ORDER BY n DESC LIMIT 60 FORMAT TabSeparated"
          curl -sS --max-time 60 -X POST "https://api.cloudflare.com/client/v4/accounts/$acct/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "$q" > "$RUNNER_TEMP/staff.tsv" || true
          msg=$(head -c 3900 "$RUNNER_TEMP/staff.tsv" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=staff::$msg"
          q2="SELECT toStartOfInterval(timestamp, INTERVAL '5' MINUTE) AS t, SUM(_sample_interval) AS n, quantileWeighted(0.5)(double1, _sample_interval) AS p50_ms, quantileWeighted(0.95)(double1, _sample_interval) AS p95_ms, SUM(if(startsWith(blob3,'5'),1,0) * _sample_interval) AS e5xx FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '${HOURS}' HOUR AND startsWith(blob1, '/v1/staff/') GROUP BY t ORDER BY t DESC LIMIT 60 FORMAT TabSeparated"
          curl -sS --max-time 60 -X POST "https://api.cloudflare.com/client/v4/accounts/$acct/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "$q2" > "$RUNNER_TEMP/staff2.tsv" || true
          msg=$(head -c 3900 "$RUNNER_TEMP/staff2.tsv" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=staff-time::$msg"
          q3="SELECT blob1 AS route, SUM(_sample_interval) AS n, quantileWeighted(0.5)(double1, _sample_interval) AS p50_ms, quantileWeighted(0.95)(double1, _sample_interval) AS p95_ms, SUM(if(startsWith(blob3,'5'),1,0) * _sample_interval) AS e5xx FROM daggerfall_accounts WHERE timestamp > NOW() - INTERVAL '${HOURS}' HOUR GROUP BY route ORDER BY n DESC LIMIT 25 FORMAT TabSeparated"
          curl -sS --max-time 60 -X POST "https://api.cloudflare.com/client/v4/accounts/$acct/analytics_engine/sql" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "$q3" > "$RUNNER_TEMP/all3.tsv" || true
          msg=$(head -c 3900 "$RUNNER_TEMP/all3.tsv" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=all-routes::$msg"

      - name: Summary as annotations 0
        if: always()
        run: |
          f="$RUNNER_TEMP/all.md"
          [ -f "$f" ] || exit 0
          [ -d "$RUNNER_TEMP/parts" ] || { mkdir -p "$RUNNER_TEMP/parts"; split -b 3900 -a 2 -d "$f" "$RUNNER_TEMP/parts/p"; }
          for n in $(seq 0 9); do
            p="$RUNNER_TEMP/parts/p$(printf %02d $n)"
            [ -f "$p" ] || exit 0
            msg=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
            echo "::notice title=p$(printf %02d $n)::$msg"
          done

      - name: Summary as annotations 1
        if: always()
        run: |
          f="$RUNNER_TEMP/all.md"
          [ -f "$f" ] || exit 0
          [ -d "$RUNNER_TEMP/parts" ] || { mkdir -p "$RUNNER_TEMP/parts"; split -b 3900 -a 2 -d "$f" "$RUNNER_TEMP/parts/p"; }
          for n in $(seq 10 19); do
            p="$RUNNER_TEMP/parts/p$(printf %02d $n)"
            [ -f "$p" ] || exit 0
            msg=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
            echo "::notice title=p$(printf %02d $n)::$msg"
          done

      - name: Summary as annotations 2
        if: always()
        run: |
          f="$RUNNER_TEMP/all.md"
          [ -f "$f" ] || exit 0
          [ -d "$RUNNER_TEMP/parts" ] || { mkdir -p "$RUNNER_TEMP/parts"; split -b 3900 -a 2 -d "$f" "$RUNNER_TEMP/parts/p"; }
          for n in $(seq 20 29); do
            p="$RUNNER_TEMP/parts/p$(printf %02d $n)"
            [ -f "$p" ] || exit 0
            msg=$(sed -e 's/%/%25/g' "$p" | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/\r/%0D/g')
            echo "::notice title=p$(printf %02d $n)::$msg"
          done
