name: Account database load

# D1-LOAD (2026-10-11, from play: the account service stayed slow after SEAT-CAP and SEAT-LEASE - "So it works, but it
# takes forever to load"; the owner: "do whatever is the most detailed") - WHAT IS FILLING THE ONE DATABASE, READ BY THE
# OPERATOR. Run it by hand from the Actions tab; the run's summary carries two readings, each from the database's own
# side of things:
#   1. D1's query insights - the statements that took the most of the database's time over the window (wrangler d1
#      insights; the window rounds up to the day it allows);
#   2. the service's own metrics (server-account/src/metrics.js, every request and cron firing one Analytics Engine
#      point) - the D1 wait by route, minute by minute, the clock's jobs, and every answer that was not a 2xx.
# The questions are tools/d1Load.mjs's, tested in test/server/d1load.test.js - not written again here. It READS ONLY.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours back to read (1 to 168)."
        required: false
        default: "1"
        type: string

permissions:
  contents: read

# Its own group, never the deploy's (sd-clears.yml's law): a group keeps ONE pending run, and a read dispatched while a
# deploy waited behind another would have cancelled that deploy.
concurrency:
  group: d1-load
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: daggerfall-accounts
      WRANGLER: npx --yes wrangler@4
      # The input reaches the scripts as ENVIRONMENT, never pasted into them (account-recovery.yml's law); the tool
      # refuses anything but whole hours.
      HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse to start without a token
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::secrets.CLOUDFLARE_API_TOKEN is not set for this repository - nothing else in this job can work"
            exit 1
          fi
          node tools/d1Load.mjs --sql routes "$HOURS" > /dev/null

      # The deploy's own resolution (account-deploy.yml), read-only: this job never creates a database.
      - name: Resolve the database id into the runner's copy of the config
        run: |
          set -euo pipefail
          id=$($WRANGLER d1 list --json | jq -r --arg n "$DB_NAME" 'map(select(.name == $n)) | .[0].uuid // .[0].id // empty')
          if [ -z "$id" ]; then
            echo "::error::there is no database named $DB_NAME"
            exit 1
          fi
          echo "::add-mask::$id"
          toml=server-account/wrangler.toml
          sentinel='resolved-by-account-deploy-workflow'
          grep -q "$sentinel" "$toml" || { echo "::error::$toml no longer carries the sentinel"; exit 1; }
          sed -i "s|\"$sentinel\"|\"$id\"|" "$toml"
          if grep -q "$sentinel" "$toml"; then
            echo "::error::the sentinel survived the substitution"
            exit 1
          fi

      # D1's own reading. A refusal is a WARNING, never a stop - the metrics below still answer.
      - name: Read D1's query insights
        working-directory: server-account
        run: |
          set -uo pipefail
          period=1d
          [ "$HOURS" -gt 24 ] 2>/dev/null && period=7d
          if out=$($WRANGLER d1 insights "$DB_NAME" --sort-type sum --sort-by time --limit 30 --timePeriod "$period" --json 2>/tmp/insights.err); then
            echo "$out" | jq -r --arg p "$period" '"**D1 query insights - the statements that took the most time (\($p))**", "",
              "| total ms | runs | avg ms | avg rows read | statement |", "|---:|---:|---:|---:|---|",
              (.[] | "| \(.totalDurationMs // .sumDurationMs // "" | tostring) | \(.numberOfTimesRun // .count // "" | tostring) | \(.avgDurationMs // "" | tostring) | \(.avgRowsRead // "" | tostring) | `\((.query // "") | gsub("[|`\n]"; " ") | .[0:300])` |"),
              ""' >> "$GITHUB_STEP_SUMMARY" || echo "::warning::the insights answer was not in the shape expected"
          else
            echo "::warning::wrangler d1 insights was refused - $(head -c 400 /tmp/insights.err)"
          fi

      - name: Read the service's metrics
        run: |
          set -euo pipefail
          acct=$(grep -oP '^account_id\s*=\s*"\K[^"]+' server-account/wrangler.toml)
          echo "**Window: the last ${HOURS:-1} hour(s), to $(date -u +%H:%M) UTC**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for q in $(node tools/d1Load.mjs --names); do
            node tools/d1Load.mjs --sql "$q" "$HOURS" > "$RUNNER_TEMP/$q.sql"
            code=$(curl -sS --max-time 60 -o "$RUNNER_TEMP/$q.json" -w '%{http_code}' -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$acct/analytics_engine/sql" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --data-binary "@$RUNNER_TEMP/$q.sql") || true
            if [ "${code:-000}" = "200" ] && node tools/d1Load.mjs --table "$q" "$RUNNER_TEMP/$q.json" >> "$GITHUB_STEP_SUMMARY"; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=1
              echo "::warning::the $q question was refused (HTTP ${code:-000}) - the token needs Account Analytics: Read"
              head -c 400 "$RUNNER_TEMP/$q.json" || true
              echo
            fi
          done
          [ "$failed" = "0" ] || echo "::warning::some readings are missing from the summary - see the warnings above"
