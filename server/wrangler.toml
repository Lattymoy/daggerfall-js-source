# ONLINE1 (2026-09-12): THE RELAY. A Cloudflare Worker whose one Durable
# Object class, Room, holds the WebSockets of every player in one room
# and fans each pose out to the peers in range. It stored nothing past
# the connection until WORLD1 (2026-09-12): a world room keeps its
# host's snapshot of the place in the object's storage; the save stays
# on the player's machine.
#
# THE DEPLOY IS AUTOMATIC, and has been since SRV-N/CI (PR #209):
# `.github/workflows/relay-deploy.yml` runs on EVERY PUSH TO MAIN. It
# reads RELAY_VERSION out of src/net/wire.js, asks the live /health, and
# deploys only when the two differ - then POLLS /health until it names
# the version the run built, because a wrangler exit code of 0 over an
# unchanged Worker is a green deploy that did not happen. The token
# lives in the repo's secrets, so nobody has to hold it, and a
# workflow_dispatch forces a run.
#
# ═══ AND A DEPLOY DROPS EVERY CONNECTED PLAYER ════════════════════
# Every Durable Object restarts and every socket in the game closes at
# once: peers vanish, chat goes quiet. That is the cost of merging a
# relay-changing slice, and it is paid the moment the merge lands
# rather than whenever somebody gets round to it.
#
# (This block claimed the opposite until 2026-09-21, fifteen weeks after
# #209 made that false, and Mac had to be the one to notice.
# test/relaydeploy.test.js reads the workflow's OWN TRIGGER now and
# holds every live comment to it - the claim is derived from the
# workflow rather than retyped beside it, which is what let the old
# sentence rot in place.)
name = "daggerfall-online"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "a27adccb38c8e8b82fa32e5736274a94"
workers_dev = true

# ═══ ACC1d: THE KEY THE RELAY VERIFIES NAMES WITH ══════════════════
#
# A VAR AND NOT A SECRET, deliberately: a public key can verify and
# cannot mint, so there is nothing here to hide. The account service
# publishes the same value at /v1/pubkey and that copy is the
# authority; this one is the relay's, and `account-deploy.yml` checks
# the two against each other, because a mismatch means every verify
# fails silently - the worst failure mode this seam has and the
# easiest one to catch at deploy time.
#
# EMPTY IS A LEGAL STATE. A relay with no key vouches for nobody and
# admits everybody, which is what it did before this slice; it does not
# refuse the room and it does not pretend it checked.
[vars]
IDENTITY_PUBLIC_KEY = "2ZbUhjpY80Hne60_ucjzCZMF0i5DsarfaWW9SDU5ei4"
# The lifetime ceiling this relay will honour, beside the key it
# belongs with (AUDIT-ACC F8, bible ACC1d D3). `MAX_TTL_S` in
# src/net/identityToken.js is the hard ceiling the module itself
# refuses past; this may only TIGHTEN it, never widen it.
IDENTITY_MAX_TTL_S = "300"

# AUDIT ONLINE A17: an uncaught error in the object is logged, not lost
[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
