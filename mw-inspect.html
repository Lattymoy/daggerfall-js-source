<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morrowind data inspector</title>
<style>
  :root { color-scheme: dark; --bg:#14120f; --fg:#e8e0d0; --dim:#9a9083; --line:#3a342c;
          --ok:#7fb069; --bad:#d1495b; --warn:#e0a458; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 ui-monospace,Menlo,Consolas,monospace; }
  main { max-width:min(100%,900px); margin:0 auto; padding:24px 18px 64px; }
  h1 { font-size:20px; margin:0 0 4px; letter-spacing:.02em; }
  h2 { font-size:15px; margin:28px 0 8px; color:var(--fg); border-bottom:1px solid var(--line); padding-bottom:5px; }
  p.lede { color:var(--dim); margin:0 0 20px; max-width:70ch; }
  #drop { border:1px dashed var(--line); border-radius:8px; padding:22px; text-align:center; color:var(--dim);
          background:#191712; cursor:pointer; }
  #drop.over { border-color:var(--warn); color:var(--fg); }
  #drop input { display:none; }
  table { border-collapse:collapse; width:100%; margin:6px 0 4px; }
  td,th { text-align:left; padding:4px 10px 4px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:normal; }
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)} .dim{color:var(--dim)}
  .note { color:var(--dim); font-size:13px; max-width:75ch; margin:6px 0 0; }
  code { color:var(--warn); }
  label { color:var(--dim); margin-right:14px; }
  select { background:#191712; color:var(--fg); border:1px solid var(--line); padding:3px 6px; font:inherit; }
  .err { color:var(--bad); white-space:pre-wrap; }
  .draws { display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 2px; }
  .draw { border:1px solid var(--line); border-radius:6px; padding:8px; background:#191712; }
  .draw canvas { display:block; background:#0f0d0b; border-radius:3px; }
  .draw.wide canvas { width:380px; height:380px; }
  .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle; }
  .draw .cap { color:var(--dim); font-size:12px; margin-top:6px; }
  .draw .cap b { color:var(--fg); font-weight:normal; }
</style>
</head>
<body>
<main>
  <h1>Morrowind data inspector</h1>
  <p class="lede">
    Drop your <code>Morrowind.bsa</code> and <code>Morrowind.esm</code> here. This page reads them and tells
    you what is actually inside &mdash; it draws nothing and it uploads nothing. Everything stays in this
    browser tab. Close it and it is gone.
  </p>

  <div id="drop" tabindex="0" role="button">
    <input type="file" id="file" multiple accept=".bsa,.esm">
    drop files here, or click to choose
  </div>
  <div id="out"></div>

  <p class="note" id="foot"></p>
</main>

<script type="module">
import {
  parseBsaIndex, readNifHeader, bodyParts, armReport, FP_SKELETONS, ARM_PARTS,
  armMeshPaths, skinVerdict, parseMeshForPreview, frontViewMapper,
  skeletonReport, checkRequiredBones,
  assembleFirstPersonArm, armPieceRows,
} from '/src/tools/mwInspect.js';

const out = document.getElementById('out');
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

let bsa = null;   // {bytes, index}
let esm = null;   // {bytes, parts}
// Errors are STATE, not a one-off insertion. They used to be written
// straight into #out and then wiped by the very next render() - so a
// corrupt archive flashed its reason and erased it. The live probe caught
// that; the node tests could not have, because it is a defect in when the
// DOM is rewritten rather than in what any function returns.
let errors = [];

drop.addEventListener('click', () => input.click());
drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') input.click(); });
input.addEventListener('change', () => take([...input.files]));
for (const ev of ['dragenter', 'dragover']) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); });
}
for (const ev of ['dragleave', 'drop']) {
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); });
}
drop.addEventListener('drop', (e) => take([...(e.dataTransfer?.files || [])]));

async function take(files) {
  errors = [];
  for (const f of files) {
    const bytes = new Uint8Array(await f.arrayBuffer());
    try {
      if (/\.bsa$/i.test(f.name)) bsa = { name: f.name, bytes, index: parseBsaIndex(bytes) };
      else if (/\.esm$/i.test(f.name)) esm = { name: f.name, bytes, parts: bodyParts(bytes) };
      else errors.push(`${f.name}: not a .bsa or .esm`);
    } catch (err) {
      errors.push(`${f.name}: ${err.message}`);
    }
  }
  render();
}

function render() {
  let h = '';

  if (bsa) {
    const have = new Set(bsa.index.files.map((f) => f.name));
    h += `<h2>${esc(bsa.name)} &mdash; ${bsa.index.fileCount.toLocaleString()} files</h2>`;
    h += '<table><tr><th>first-person skeleton</th><th>for</th><th></th></tr>';
    for (const s of FP_SKELETONS) {
      const present = have.has(s.path);
      const ghost = /REVERTED/.test(s.who);
      const cls = present ? (ghost ? 'warn' : 'ok') : (ghost ? 'dim' : 'bad');
      const word = present ? 'present' : 'ABSENT';
      h += `<tr><td><code>${esc(s.path)}</code></td><td class="dim">${esc(s.who)}</td>`
        + `<td class="${cls}">${word}</td></tr>`;
    }
    h += '</table>';
    const ghostPresent = have.has('meshes/base_anim.1st.nif');
    h += `<p class="note">${ghostPresent
      ? 'Note: <code>base_anim.1st.nif</code> IS in this archive. That is not the file OpenMW asks for '
        + '(it wants <code>xbase_anim.1st.nif</code> for a male non-beast actor), so its presence does not '
        + 'mean the old code would have worked &mdash; only that the name existed.'
      : 'Note: <code>base_anim.1st.nif</code> is <b>not in this archive</b>. The reverted first-person rig '
        + 'asked for exactly that file, which is why it never drew anything. This one line is the whole '
        + 'reason this page exists.'}</p>`;

    // header of whichever skeletons are actually here
    const rows = [];
    for (const s of FP_SKELETONS) {
      if (!s.path.endsWith('.nif')) continue;
      const f = bsa.index.files.find((x) => x.name === s.path);
      if (!f) continue;
      const hdr = readNifHeader(bsa.bytes.subarray(f.offset, f.offset + Math.min(f.size, 256)));
      rows.push(hdr.ok
        ? `<tr><td><code>${esc(s.path)}</code></td><td class="ok">${esc(hdr.magic)}</td>`
          + `<td>v${esc(hdr.versionText)}</td><td class="dim">bool = ${hdr.boolBytes} bytes</td></tr>`
        : `<tr><td><code>${esc(s.path)}</code></td><td class="bad" colspan="3">${esc(hdr.why)}</td></tr>`);
    }
    if (rows.length) {
      h += '<h2>NIF headers</h2><table><tr><th>file</th><th>format</th><th>version</th><th></th></tr>'
        + rows.join('') + '</table>';
    }
    h += '<div id="bones"></div>';
  }

  if (esm) {
    const parts = esm.parts;
    const races = [...new Set(parts.filter((p) => p.skin && p.playable).map((p) => p.race))].sort();
    const fp = parts.filter((p) => p.firstPerson).length;
    h += `<h2>${esc(esm.name)} &mdash; ${parts.length.toLocaleString()} body records</h2>`;
    h += `<p class="note">${fp.toLocaleString()} of them are first-person records &mdash; that is, their `
      + '<b>record id ends in <code>1st</code></b>. That is what makes a part first-person; it is not a '
      + 'filename with <code>.1st</code> spliced into it, which is what the reverted code looked for.</p>';
    if (races.length) {
      const sel = localStorage.getItem('mwi.race') || (races.includes('nord') ? 'nord' : races[0]);
      const fem = localStorage.getItem('mwi.female') === '1';
      h += '<p><label>race <select id="race">'
        + races.map((r) => `<option${r === sel ? ' selected' : ''}>${esc(r)}</option>`).join('')
        + '</select></label><label><input type="checkbox" id="fem"'
        + (fem ? ' checked' : '') + '> female</label></p>';
      h += '<table><tr><th>arm slot</th><th>first-person record</th><th>verdict</th></tr>';
      for (const row of armReport(parts, sel, fem)) {
        const cls = row.firstPerson ? 'ok' : row.thirdPersonFallback ? 'warn' : 'bad';
        h += `<tr><td>${esc(row.slot)}</td>`
          + `<td class="dim">${esc(row.firstPerson?.id || row.thirdPersonFallback?.id || '&mdash;')}</td>`
          + `<td class="${cls}">${esc(row.verdict)}</td></tr>`;
      }
      h += '</table>';
      h += `<p class="note">These four slots &mdash; ${ARM_PARTS.join(', ')} &mdash; are the only parts the `
        + 'engine lets fall back to a third-person mesh when the <code>1st</code> record is missing. That is a '
        + 'fallback rule, not the list of what gets drawn.</p>';

      // MW-D2: and now the question the whole rig design rests on.
      if (bsa) {
        const have = new Map(bsa.index.files.map((f) => [f.name, f]));
        h += '<h2>Are those arm meshes skinned, or rigid?</h2>';
        h += '<table><tr><th>slot</th><th>mesh</th><th>in archive</th><th>verdict</th><th>records seen</th></tr>';
        let anySkinned = false; let anyRigid = false; let anyMissing = false;
        for (const p of armMeshPaths(armReport(parts, sel, fem))) {
          if (!p.path) { h += `<tr><td>${esc(p.slot)}</td><td colspan="4" class="dim">no record</td></tr>`; continue; }
          const f = have.get(p.path);
          if (!f) {
            anyMissing = true;
            h += `<tr><td>${esc(p.slot)}</td><td><code>${esc(p.path)}</code></td>`
              + '<td class="bad">not found</td><td colspan="2" class="dim">&mdash;</td></tr>';
            continue;
          }
          const v = skinVerdict(bsa.bytes.subarray(f.offset, f.offset + f.size));
          if (!v.ok) {
            h += `<tr><td>${esc(p.slot)}</td><td><code>${esc(p.path)}</code></td><td class="ok">yes</td>`
              + `<td class="bad" colspan="2">${esc(v.why)}</td></tr>`;
            continue;
          }
          if (v.skinned) anySkinned = true; else anyRigid = true;
          const top = v.census.slice(0, 4).map(([n, c]) => `${n}${c > 1 ? '&times;' + c : ''}`).join(', ');
          h += `<tr><td>${esc(p.slot)}</td><td><code>${esc(p.path)}</code></td><td class="ok">yes</td>`
            + `<td class="${v.skinned ? 'warn' : 'ok'}">${v.skinned ? 'SKINNED' : 'rigid'}`
            + `</td><td class="dim">${top}</td></tr>`;
        }
        h += '</table>';
        h += '<div class="draws" id="draws"></div>';
        h += '<div id="assembly"></div>';
        h += '<p class="note">This is a record-type <b>scan</b>, not a parse: it can tell you a '
          + '<code>NiSkinInstance</code> is present in the file, and nothing more. It is here because the last '
          + 'attempted fix assumed these meshes were <b>rigid</b> &mdash; parts hung off a bone &mdash; from '
          + 'reading the engine\'s two attach paths, and never checked a real one. '
          + (anySkinned && anyRigid ? '<b>Both kinds are present here, so the rig must handle both.</b>'
            : anySkinned ? '<b>These are SKINNED. The rigid-parts assumption was wrong.</b>'
              : anyRigid ? '<b>These are rigid, as assumed.</b>' : '')
          + (anyMissing ? ' Some meshes were not found in the archive shown &mdash; those parts likely live in an '
            + 'expansion archive that has not been attached.' : '') + '</p>';
      }
    }
  }

  if (!bsa && !esm) h = '';
  h = errors.map((e) => `<p class="err">${esc(e)}</p>`).join('') + h;
  out.innerHTML = h;

  const race = document.getElementById('race');
  const fem = document.getElementById('fem');
  if (race) race.addEventListener('change', () => { localStorage.setItem('mwi.race', race.value); render(); });
  if (fem) fem.addEventListener('change', () => { localStorage.setItem('mwi.female', fem.checked ? '1' : '0'); render(); });

  drawArms();
  drawAssembly();
  reportBones();

  document.getElementById('foot').innerHTML = (bsa || esm)
    ? 'Every rule this page applies is cited in <code>bible/02-Formats/Morrowind-Rules.md</code>. '
      + 'It reports what is in your files; it makes no claim that anything will draw.'
    : '';
}

// MW-D4: the bones the rules NAME, against the skeleton in your archive.
// Every attach in the rig resolves a bone by name; if a name is wrong the
// attach finds nothing and the view comes up empty - which is the exact
// failure this whole effort keeps circling. So the table below is the
// difference between "binding will work on your data" and "binding will
// silently do nothing", and it is worth knowing BEFORE the binder exists.
async function reportBones() {
  const host = document.getElementById('bones');
  if (!host || !bsa) return;
  const fem = localStorage.getItem('mwi.female') === '1';
  const want = fem ? 'meshes/base_anim_female.1st.nif' : 'meshes/xbase_anim.1st.nif';
  const f = bsa.index.files.find((x) => x.name === want)
    || bsa.index.files.find((x) => x.name === 'meshes/xbase_anim.1st.nif');
  if (!f) return;
  const r = await skeletonReport(bsa.bytes.subarray(f.offset, f.offset + f.size));
  let h = `<h2>Bones in <code>${esc(f.name)}</code></h2>`;
  if (!r.ok) {
    host.innerHTML = h + `<p class="err">${esc(r.stage || 'failed')}: ${esc(r.error)}</p>`;
    return;
  }
  const rows = checkRequiredBones(r);
  const missing = rows.filter((b) => !b.present).length;
  h += `<p class="note">${r.boneCount} nodes in this skeleton. The rows below are the bones the recorded `
    + 'rules say a first-person arm attaches to. Lookup is case-insensitive, matching the engine.</p>';
  h += '<table><tr><th>bone</th><th>needed for</th><th></th></tr>';
  for (const b of rows) {
    h += `<tr><td><code>${esc(b.name)}</code></td><td class="dim">${esc(b.why)}</td>`
      + `<td class="${b.present ? 'ok' : 'bad'}">${b.present ? 'present' : 'MISSING'}</td></tr>`;
  }
  h += '</table>';
  h += `<p class="note">${missing === 0
    ? '<b>Every bone the rules name is in your skeleton.</b> Binding the arms to it should resolve; '
      + 'if the rig still draws nothing after that, the fault is downstream of the bone lookup.'
    : `<b>${missing} of ${rows.length} are missing.</b> A bone the skeleton does not have is an attach that `
      + 'finds nothing, so these have to be resolved - by a corrected name, or by the part genuinely not '
      + 'existing for this actor - before a rig is written against them.'}</p>`;
  host.innerHTML = h;
}

// MW-D6 extracted these three, because drawAssembly needs all of them and
// a second copy of any one is how two panels start disagreeing about the
// same archive. The race default was ALREADY divergent - render() prefers
// nord then falls back to the first race present, drawArms() hardcoded
// 'nord' - so a saved race absent from the loaded ESM drew one thing and
// listed another.
function selection() {
  const races = [...new Set(esm.parts.map((p) => p.race).filter(Boolean))].sort();
  const saved = localStorage.getItem('mwi.race');
  const race = (saved && races.includes(saved)) ? saved : (races.includes('nord') ? 'nord' : races[0]);
  return { race, female: localStorage.getItem('mwi.female') === '1', races };
}
/** Rule 6's skeleton for the selected actor, as an archive entry. */
function fpSkeletonEntry() {
  const want = localStorage.getItem('mwi.female') === '1'
    ? 'meshes/base_anim_female.1st.nif' : 'meshes/xbase_anim.1st.nif';
  return bsa.index.files.find((x) => x.name === want)
    || bsa.index.files.find((x) => x.name === 'meshes/xbase_anim.1st.nif') || null;
}
const fileBytes = (f) => bsa.bytes.subarray(f.offset, f.offset + f.size);
/** Every triangle of one piece, as one path. The caller owns the stroke
 *  colour, which is the only thing the two panels differ on. */
function strokePath(g, map, positions, indices) {
  g.beginPath();
  for (let i = 0; i + 2 < indices.length; i += 3) {
    const a = indices[i] * 3; const b = indices[i + 1] * 3; const c = indices[i + 2] * 3;
    const [ax, ay] = map(positions[a], positions[a + 1], positions[a + 2]);
    const [bx, by] = map(positions[b], positions[b + 1], positions[b + 2]);
    const [cx, cy] = map(positions[c], positions[c + 1], positions[c + 2]);
    g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.closePath();
  }
  g.stroke();
}

// MW-D3: run the REAL reader over each arm mesh and draw what comes back.
// Not the rig - no skeleton, no bones, no pose. Just: does this file parse,
// and is what comes out shaped like a hand? A wireframe answers that in a
// way no test output can, and a failure prints its stage and message
// instead of leaving an empty box.
async function drawArms() {
  const host = document.getElementById('draws');
  if (!host || !bsa || !esm) return;
  const { race, female } = selection();
  const have = new Map(bsa.index.files.map((f) => [f.name, f]));
  for (const p of armMeshPaths(armReport(esm.parts, race, female))) {
    if (!p.path) continue;
    const f = have.get(p.path);
    if (!f) continue;
    const box = document.createElement('div');
    box.className = 'draw';
    host.append(box);
    const r = await parseMeshForPreview(fileBytes(f));
    if (!r.ok) {
      box.innerHTML = `<div class="cap"><b>${esc(p.slot)}</b><br><span class="bad">`
        + `${esc(r.stage || 'failed')}: ${esc(r.error)}</span></div>`;
      continue;
    }
    const W = 190; const H = 190;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    box.append(cv);
    const g = cv.getContext('2d');
    const map = frontViewMapper(r.bounds, W, H);
    g.strokeStyle = 'rgba(224,164,88,.55)';
    g.lineWidth = 0.5;
    for (const sh of r.shapes) strokePath(g, map, sh.positions, sh.indices);
    box.insertAdjacentHTML('beforeend', `<div class="cap"><b>${esc(p.slot)}</b> `
      + `&middot; ${r.triangles.toLocaleString()} tris &middot; `
      + `${r.skinnedShapes ? 'skinned' : 'rigid'}</div>`);
  }
}

// MW-D6: DRAW THE ASSEMBLED ARM.
//
// MW-D3 above draws each arm mesh ALONE, in its own box, framed by its
// own bounds - which answers "does this file parse" and cannot answer
// the only question that matters next: do the parts land in the same
// place, on the right sides, as one arm. Four separately-correct boxes
// look exactly like a working arm and exactly like a broken one.
//
// So this puts every piece assembleFirstPersonArm returns into ONE frame
// at ONE scale. Rest pose. No clip, no rig, no camera - rules 29/52/53/54
// are camera and compositing rules that need a player eye and a world to
// occlude, neither of which a diagnostic page has.
//
// The colours are the diagnosis: rule 12 splits skinned from rigid and
// rule 13 mirrors only the rigid left, so if a piece is the wrong colour
// or the wrong side, the picture says which rule went wrong.
const ARM_INK = {
  skinned: 'rgba(224,164,88,.75)',
  rigid: 'rgba(120,190,235,.75)',
  mirrored: 'rgba(150,225,150,.85)',
};
const inkFor = (row) => (row.kind === 'skinned' ? ARM_INK.skinned
  : row.mirrored ? ARM_INK.mirrored : ARM_INK.rigid);

async function drawAssembly() {
  const host = document.getElementById('assembly');
  if (!host || !bsa || !esm) return;
  const skel = fpSkeletonEntry();
  if (!skel) {
    host.innerHTML = '<h2>The assembled arm</h2><p class="err">no first-person skeleton in this archive '
      + '&mdash; rule 6 names <code>xbase_anim.1st.nif</code> (male) and '
      + '<code>base_anim_female.1st.nif</code>.</p>';
    return;
  }
  const { race, female } = selection();
  const have = new Map(bsa.index.files.map((f) => [f.name, f]));
  const parts = []; const missing = [];
  for (const pth of armMeshPaths(armReport(esm.parts, race, female))) {
    if (!pth.path) { missing.push(`${pth.slot}: no record for this actor`); continue; }
    const f = have.get(pth.path);
    if (!f) { missing.push(`${pth.slot}: ${pth.path} is not in this archive`); continue; }
    // NO bones override: the real PART_BONES table, the retail names.
    parts.push({ slot: pth.slot, bytes: fileBytes(f) });
  }
  const r = await assembleFirstPersonArm({ skeletonBytes: fileBytes(skel), parts });
  const rows = r.ok ? armPieceRows(r.pieces) : [];
  window.__mwArm = r.ok ? rows.map((x) => ({ ...x })) : null;   // the probe reads the same rows the table shows

  let h = `<h2>The assembled arm &mdash; <code>${esc(skel.name)}</code>, rest pose</h2>`;
  h += '<p class="note">Every part bound to the skeleton at its own bone, in ONE frame at ONE scale. '
    + 'The panels above draw each mesh alone and cannot show whether the parts agree about where they are. '
    + 'Front view: x across, z up, y discarded &mdash; so parts overlap rather than occlude.</p>';

  if (!r.ok || !r.bounds) {
    h += `<p class="err">${esc(r.stage || 'nothing assembled')}: ${esc(r.error || 'no geometry')}</p>`;
  } else {
    const W = 380; const H = 380;
    const box = document.createElement('div');
    box.className = 'draw wide';
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    box.append(cv);
    const g = cv.getContext('2d');
    const map = frontViewMapper(r.bounds, W, H);
    g.lineWidth = 0.6;
    // ONE mapper over the ASSEMBLY's bounds - a per-piece frame would put
    // every part in the middle of its own box and prove nothing.
    r.pieces.forEach((piece, i) => {
      g.strokeStyle = inkFor(rows[i]);
      strokePath(g, map, piece.positions, piece.indices);
    });
    host.innerHTML = h;
    host.append(box);
    h = '';
    host.insertAdjacentHTML('beforeend',
      `<p class="note"><span class="sw" style="background:${ARM_INK.skinned}"></span>skinned (rule 15 picked its side by shape name) `
      + `&nbsp; <span class="sw" style="background:${ARM_INK.rigid}"></span>rigid, right `
      + `&nbsp; <span class="sw" style="background:${ARM_INK.mirrored}"></span>rigid, MIRRORED (rule 13)</p>`);
    let t = '<table><tr><th>slot @ bone</th><th>kind</th><th>tris</th><th>x range</th></tr>';
    for (const row of rows) {
      t += `<tr><td><code>${esc(row.key)}</code></td>`
        + `<td class="${row.kind === 'skinned' ? 'warn' : 'ok'}">${esc(row.kind)}`
        + `${row.mirrored ? ' &middot; <b>MIRRORED</b>' : ''}</td>`
        + `<td>${row.triangles.toLocaleString()}</td>`
        + `<td class="dim">${row.bounds ? `${row.bounds.minX.toFixed(2)} &hellip; ${row.bounds.maxX.toFixed(2)}` : '&mdash;'}</td></tr>`;
    }
    host.insertAdjacentHTML('beforeend', t + '</table>');
  }

  // WHY a part is not here is the whole point of the panel: an empty view
  // that says nothing is the failure this arc exists to end.
  const why = [...missing, ...(r.notes || [])];
  if (why.length) {
    h += '<p class="note">Not in the picture:</p><ul class="note">'
      + why.map((n) => `<li>${esc(n)}</li>`).join('') + '</ul>';
  }
  if (h) host.insertAdjacentHTML('beforeend', h);
}
</script>
</body>
</html>
