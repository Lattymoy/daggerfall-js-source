<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daggerfall JS &mdash; ground + 3D grass prototype</title>
<!--
  GRASS PROTOTYPE (Mac: prototype the new ground textures AND the 3D
  grass before any code change, so he can see them).

  NOTHING HERE TOUCHES THE GAME. This is a standalone page over the
  same ideas the engine would use, so the look can be judged and tuned
  before a line of renderer changes:

    - the GROUND is the prototype tileset from tools/groundProto.mjs,
      sampled with mipmaps and anisotropy - the two things the live
      terrain array does NOT do today, and the reason a high-res tile
      would shimmer at distance if it were dropped in as-is.

    - the GRASS is one instanced draw. Every blade is the same three
      quads; a per-instance attribute carries its position, height,
      lean, phase and tint. That is the shape the engine needs
      (drawArraysInstanced, one call per terrain chunk) and the piece
      the renderer does not have yet.

    - placement is DETERMINISTIC on a hashed seed, the same rule the
      nature pass already uses for billboards, so blades do not crawl
      or repopulate as you move.

    - WIND is a vertex-shader offset weighted by height along the
      blade, so the tip travels and the root does not.

    - the far fade drops blades by distance so the count stays bounded.
-->
<style>
  html,body { margin:0; height:100%; background:#0d0f12; color:#cdc4a8;
    font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; left:12px; top:12px; background:rgba(10,12,16,.72);
    border:1px solid #55503f; padding:10px 12px; max-width:min(380px,46vw); }
  .hud h1 { margin:0 0 6px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e0d5ad; }
  .hud label { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .hud input[type=range] { flex:1; }
  .hud .v { width:52px; text-align:right; color:#9c9378; }
  .hud p { margin:6px 0 0; color:#8d836c; }
  .note { margin:6px 0 0; color:#8b836c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>Ground + 3D grass</h1>
  <label>blades <input id="density" type="range" min="20000" max="400000" step="10000" value="160000"><span class="v" id="vdensity"></span></label>
  <label>height <input id="height" type="range" min="10" max="80" step="1" value="34"><span class="v" id="vheight"></span></label>
  <label>wind <input id="wind" type="range" min="0" max="200" step="1" value="70"><span class="v" id="vwind"></span></label>
  <label>range <input id="range" type="range" min="10" max="140" step="1" value="90"><span class="v" id="vrange"></span></label>
  <label>tile m <input id="tile" type="range" min="1" max="8" step="1" value="2"><span class="v" id="vtile"></span></label>
  <label>sun <input id="sun" type="range" min="5" max="90" step="1" value="34"><span class="v" id="vsun"></span></label>
  <label>weather <select id="wx">
    <option>sunny</option><option>cloudy</option><option>overcast</option><option>fog</option>
    <option>rain</option><option>thunder</option><option>snow</option>
  </select></label>
  <label>surface <select id="surf">
    <option>grass</option><option>dirt</option><option>stone</option><option>sand</option><option>snow</option>
  </select></label>
  <p class="note">drag to look &middot; W/S to move &middot; G toggles grass &middot; T toggles the new ground</p>
  <p class="note" id="fps"></p>
</div>
<script type="module">
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: true });
if (!gl) document.body.innerHTML = '<p style="padding:20px">WebGL2 is needed for this prototype.</p>';

const R = (id) => document.getElementById(id);
// the grass buffers, declared BEFORE the sliders that build them - the
// slider sync fires during setup and reached `gr` in its dead zone.
let gr = { vao: null, count: 0, verts: 0 };
let ready = false;   // the GL objects exist only after the programs link
const state = { density: 160000, height: 34, wind: 70, range: 90, tile: 2, sun: 34, surface: 'grass', weather: 'sunny', grass: true, newGround: true };
for (const k of ['density', 'height', 'wind', 'range', 'tile', 'sun']) {
  const el = R(k); const out = R(`v${k}`);
  const sync = () => { state[k] = +el.value; out.textContent = el.value; if (k === 'density' && ready) build(); };
  el.addEventListener('input', sync); sync();
}
// the surface picker repaints both sheets and re-uploads them; the
// grass blades follow, because blades of grass on snow is a lie
function setSurface(name) {
  state.surface = name;
  paintSheet(name); paintNormals();
  gl.bindTexture(gl.TEXTURE_2D, groundTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindTexture(gl.TEXTURE_2D, groundNrm);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, nrm);
  gl.generateMipmap(gl.TEXTURE_2D);
  state.grass = name === 'grass';
}
addEventListener('keydown', (e) => {
  if (e.key === 'g' || e.key === 'G') state.grass = !state.grass;
  if (e.key === 't' || e.key === 'T') state.newGround = !state.newGround;
});

// ── the ground, GENERATED HERE ──────────────────────────────────────
// The offline tool derives Daggerfall's 56 tiles by masking its own
// shapes; those are a raster of game data and doctrine forbids
// shipping them, correctly. So this page draws its four bases with
// the SAME procedural surfaces the tool uses - which are ours - and
// the blend derivation stays offline, over a player's own archives.
function makeNoise(seed) {
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => (((h & 4) ? -((h & 1) ? x : y) : ((h & 1) ? x : y)) + ((h & 8) ? -((h & 2) ? y : x) : ((h & 2) ? y : x)));
  return (x, y, period) => {
    const w = (n) => ((n % period) + period) % period;
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = w(xi) & 255, Y = w(yi) & 255, X1 = w(xi + 1) & 255, Y1 = w(yi + 1) & 255;
    const u = fade(xf), v = fade(yf);
    const lerp = (a, b, t) => a + (b - a) * t;
    return lerp(lerp(grad(p[(p[X] + Y) & 255], xf, yf), grad(p[(p[X1] + Y) & 255], xf - 1, yf), u),
      lerp(grad(p[(p[X] + Y1) & 255], xf, yf - 1), grad(p[(p[X1] + Y1) & 255], xf - 1, yf - 1), u), v) * 0.5 + 0.5;
  };
}
const nz = makeNoise(0x51ed);
const fbm = (x, y, period, oct, gain = 0.5) => {
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let o = 0; o < oct; o++) { sum += a * nz(x * f, y * f, period * f); norm += a; a *= gain; f *= 2; }
  return sum / norm;
};
function worley(x, y, period, seed) {
  const rnd = (i, j) => { let h = ((i * 374761393) ^ (j * 668265263) ^ (seed * 2246822519)) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return [(h & 0xffff) / 65536, ((h >>> 16) & 0xffff) / 65536]; };
  const xi = Math.floor(x), yi = Math.floor(y); let f1 = 9, f2 = 9;
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    const ci = xi + di, cj = yi + dj, w = (n) => ((n % period) + period) % period;
    const [ox, oy] = rnd(w(ci), w(cj));
    const d = Math.hypot(ci + ox - x, cj + oy - y);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
  }
  return { f1, f2 };
}
const cl = (v, a, b) => Math.min(b, Math.max(a, v));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const sh = (c, k) => c.map((v) => cl(v * k, 0, 255));
// PROTO-2 (Mac: go deeper on the detail). The first cut painted grass
// as a TINTED FIELD - noise for colour, Worley for clumps - and it
// read as a net, because real turf is not a field. It is thousands of
// DRAWN BLADES lying over soil, each with a length, a direction and a
// shadow. So the texture is drawn the way it is made:
//
//   1. SOIL first, its own surface with grain and pebbles, because
//      every gap between blades shows it.
//   2. LITTER: a few thousand individual blades PLACED on a hashed
//      jittered lattice, each a short capsule with its own angle,
//      length, width and hue, drawn back-to-front so the near ones
//      overlap. Every blade darkens the soil just off its own axis -
//      a contact shadow, which is what makes a lawn read as depth
//      rather than pattern.
//   3. TUFTS: a low Worley field lifts whole clumps a shade brighter
//      and drops the hollows between them, so the sward has terrain.
//   4. DRY STRAW and BARE PATCHES, sparse, so it is not one colour.
//
// The lattice wraps, so the texture still tiles seamlessly.
/** The blade lattice. Cells wrap, so the sheet still tiles; each cell
 *  holds a few blades with hashed angle, length, width and hue, and a
 *  point is tested against the capsules of its own cell and its
 *  neighbours. Returns the nearest blade covering the point (or null)
 *  and, separately, how much shadow the point sits in. */
function makeBlades({ cells = 30, perCell = 6, len = [0.028, 0.075], wid = [0.0026, 0.0050] }) {
  const h2 = (i, j, k) => {
    let h = ((i * 374761393) ^ (j * 668265263) ^ (k * 2246822519)) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return [(h & 1023) / 1024, ((h >>> 10) & 1023) / 1024, ((h >>> 20) & 1023) / 1024];
  };
  const capsule = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const t = cl(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1e-9), 0, 1);
    return { d: Math.hypot(px - (ax + dx * t), py - (ay + dy * t)), t };
  };
  const visit = (u, v, fn) => {
    const ci = Math.floor(u * cells), cj = Math.floor(v * cells);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const gi = ci + di, gj = cj + dj;
      const wi = ((gi % cells) + cells) % cells, wj = ((gj % cells) + cells) % cells;
      for (let k = 0; k < perCell; k++) {
        const [a, b, c2] = h2(wi, wj, k);
        const [d, e, f] = h2(wi + 977, wj + 331, k);
        // the blade's root, in this cell, offset into unwrapped space
        const rx = (gi + a) / cells, ry = (gj + b) / cells;
        const ang = c2 * 6.2832;
        const L = len[0] + d * (len[1] - len[0]);
        fn({ rx, ry, tx: rx + Math.cos(ang) * L, ty: ry + Math.sin(ang) * L,
          w: wid[0] + e * (wid[1] - wid[0]), hue: f, L });
      }
    }
  };
  return {
    /** the blade covering this point, if any - nearest wins */
    at(u, v, tuft, bare) {
      let best = null;
      visit(u, v, (bl) => {
        // thin the lattice where the sward thins
        if (bl.hue > 0.62 + tuft * 0.38 - bare * 0.80) return;
        const { d, t } = capsule(u, v, bl.rx, bl.ry, bl.tx, bl.ty);
        const w = bl.w * (1 - t * 0.7);          // blades taper
        if (d < w && (!best || t > best.t)) best = { t, shade: bl.hue };
      });
      return best;
    },
    /** how much this point sits in a blade's shadow: the same capsules,
     *  tested a hair off-axis, which is what gives a lawn its depth */
    shadow(u, v) {
      let s2 = 0;
      visit(u + 0.004, v + 0.006, (bl) => {
        const { d } = capsule(u + 0.004, v + 0.006, bl.rx, bl.ry, bl.tx, bl.ty);
        if (d < bl.w * 2.2) s2 = Math.max(s2, 1 - d / (bl.w * 2.2));
      });
      return s2;
    },
  };
}
const BLADES = makeBlades({});

function grassPixel(u, v) {
  const P = 8, x = u * P, y = v * P;
  // the soil, seen in every gap
  const grain = fbm(x * 30 + 21, y * 30 + 9, P * 30, 3);
  const tone = fbm(x * 1.4 - 4, y * 1.4 + 2, P * 1.4, 4);
  let c = mixc([74, 58, 40], [104, 82, 56], cl((tone - 0.35) * 2.0, 0, 1));
  c = sh(c, 0.86 + grain * 0.3);
  const peb = worley(x * 11 + 0.5, y * 11 + 0.5, P * 11, 17);
  const stone = cl((0.13 - peb.f1) * 11, 0, 1);
  if (stone > 0.01) c = mixc(c, [130, 122, 110], stone * 0.7);
  // the sward's terrain
  const t = worley(x * 3.1, y * 3.1, P * 3.1, 91);
  const tuft = cl((t.f2 - t.f1) * 2.6, 0, 1);
  const dry = cl((fbm(x * 0.5 + 11, y * 0.5 - 7, P * 0.5, 3) - 0.5) * 3.4, 0, 1);
  const bare = cl((0.34 - fbm(x * 0.7, y * 0.7, P * 0.7, 4)) * 4.5, 0, 1);
  const lit = BLADES.at(u, v, tuft, bare);
  if (lit) {
    const base = mixc([48, 76, 32], [118, 152, 66], cl(lit.t * 1.15, 0, 1));
    let bc = mixc(base, [152, 146, 84], dry * 0.5);
    bc = sh(bc, 0.78 + tuft * 0.30 + lit.shade * 0.40);
    bc = sh(bc, 0.94 + fbm(x * 70, y * 70, P * 70, 2) * 0.14);
    // the HEIGHT the normal map is built from: a blade stands, and
    // stands taller toward its tip
    return { rgb: bc, h: 0.45 + lit.t * 0.55 + tuft * 0.18 };
  }
  const sha = BLADES.shadow(u, v);
  c = sh(c, 0.62 + (1 - sha) * 0.50);
  c = mixc(c, [58, 80, 40], cl(0.35 + tuft * 0.65, 0, 1) * (1 - bare) * 0.62);
  return { rgb: c, h: 0.06 + stone * 0.30 + grain * 0.10 + tuft * 0.10 };
}

// PROTO-3 (Mac: push the land texture to extreme fidelity). Four
// things separate "a nice tile" from ground you believe:
//
//   1. RESOLUTION. 1024px, and the blade lattice scaled with it, so
//      the detail is real detail and not the same blades enlarged.
//   2. A NORMAL MAP, derived from the same blade field's own height -
//      every blade and every pebble gets a lit side and a shaded one
//      that MOVE with the sun. A flat albedo is the single biggest
//      reason a ground texture looks painted.
//   3. TWO SCALES. One sheet at ~2m tiles the near ground; a second,
//      LOW-frequency sheet at ~19m modulates it, so the eye never
//      finds the repeat that a single tile always shows on open land.
//   4. DISTANCE BLEND to a filtered average, so the far field settles
//      into colour instead of boiling.
// PROTO-4 (Mac: the other textures while we are at it). The same law
// the grass proved: a surface is DRAWN and it RECORDS ITS HEIGHT, so
// the normal map lights the thing itself. Each returns { rgb, h }.

/** DIRT: soil, and the things lying on it. The height is what sells
 *  it - pebbles stand, ruts sink, and the sun finds both. */
function dirtPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const tone = fbm(x * 1.2 - 4, y * 1.2 + 2, P * 1.2, 4);
  const grain = fbm(x * 40 + 21, y * 40 + 9, P * 40, 3);
  let c = mixc([104, 78, 52], [148, 116, 78], cl((tone - 0.35) * 2.0, 0, 1));
  c = sh(c, 0.84 + grain * 0.34);
  let h = 0.35 + grain * 0.14 + tone * 0.10;
  // ruts and cracks: long low channels the light pools in
  const rut = cl(1 - Math.abs(fbm(x * 1.9 + 40, y * 0.7, P * 1.9, 4) - 0.5) * 11, 0, 1);
  c = sh(c, 1 - rut * 0.24); h -= rut * 0.22;
  // pebbles: PLACED, with a catch-light and a dropped shadow
  for (const [freq, seed, size, tint] of [[7.5, 17, 0.20, [156, 146, 132]], [15, 71, 0.13, [128, 118, 104]]]) {
    const w = worley(x * freq + 0.5, y * freq + 0.5, P * freq, seed);
    const st = cl((size - w.f1) * (1 / size) * 1.6, 0, 1);
    if (st > 0.01) {
      c = mixc(c, tint, st * 0.78);
      c = sh(c, 1 + st * 0.16);
      h += st * 0.40;
    }
    const sha = cl((size * 1.7 - w.f1) * (1 / size), 0, 1) - st;
    if (sha > 0.01) c = sh(c, 1 - sha * 0.20);
  }
  // dry straw and root litter, sparse
  const straw = cl((fbm(x * 26 + 61, y * 9 - 3, P * 26, 2) - 0.74) * 7, 0, 1);
  c = mixc(c, [150, 132, 84], straw * 0.6); h += straw * 0.10;
  return { rgb: c, h: cl(h, 0, 1) };
}

/** STONE: plates, not cobbles. The first cut read as a cartoon
 *  pavement because every cell was one flat tone with a black moat.
 *  A plate is DOMED off sqrt(f2)-sqrt(f1) - zero at the seam, highest
 *  mid-plate - and the seam is a CRACK, narrow. */
function stonePixel(u, v) {
  const P = 5, x = u * P, y = v * P;
  const wx = (fbm(x * 0.9, y * 0.9, P * 0.9, 3) - 0.5) * 1.1;
  const wy = (fbm(x * 0.9 + 31, y * 0.9 - 17, P * 0.9, 3) - 0.5) * 1.1;
  const w = worley(x * 2.6 + wx, y * 2.6 + wy, P * 2.6, 53);
  const dome = cl((Math.sqrt(w.f2) - Math.sqrt(w.f1)) * 3.0, 0, 1);
  const mott = fbm(x * 2.4 + 7, y * 2.4 - 3, P * 2.4, 5);
  const grit = fbm(x * 44, y * 44, P * 44, 3);
  // each plate takes its own tone, so a wall is not one grey
  const plateTint = fbm(Math.floor(x * 2.6 + wx) * 3.7, Math.floor(y * 2.6 + wy) * 3.7, P * 9, 2);
  let c = mixc([88, 86, 82], [142, 139, 130], dome * 0.55 + mott * 0.3 + plateTint * 0.15);
  c = sh(c, 0.86 + grit * 0.30);
  let h = 0.25 + dome * 0.62 + grit * 0.08;
  const seam = cl(1 - dome * 8, 0, 1);
  c = mixc(c, [58, 57, 56], seam * 0.6); h -= seam * 0.42;
  // fine fracture lines ACROSS the plates, which real stone has
  const frac = cl(1 - Math.abs(fbm(x * 6 + 90, y * 6, P * 6, 3) - 0.5) * 16, 0, 1) * dome;
  c = sh(c, 1 - frac * 0.22); h -= frac * 0.12;
  // lichen only on the crowns, and it lifts the surface a hair
  const lich = cl((fbm(x * 3.6 + 60, y * 3.6 + 12, P * 3.6, 4) - 0.60) * 4.5, 0, 1) * dome;
  c = mixc(c, [104, 116, 68], lich * 0.42); h += lich * 0.05;
  return { rgb: c, h: cl(h, 0, 1) };
}

/** SAND: the desert climate's ground. Ripples are a HEIGHT field
 *  before they are a colour - a dune's light comes entirely from its
 *  own slope, so the normal map does nearly all the work here. */
function sandPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const drift = fbm(x * 0.7 + 3, y * 0.7 - 2, P * 0.7, 4);
  // wind ripples: a warped periodic train, crests perpendicular to it
  const wx2 = x + (fbm(x * 1.1, y * 1.1, P * 1.1, 3) - 0.5) * 1.6;
  const wy2 = y + (fbm(x * 1.1 + 19, y * 1.1 + 7, P * 1.1, 3) - 0.5) * 1.6;
  const ripple = Math.sin((wx2 * 3.0 + wy2 * 1.1) * Math.PI * 2 / P * 3) * 0.5 + 0.5;
  const fine = fbm(x * 55, y * 55, P * 55, 2);
  let c = mixc([196, 168, 118], [226, 202, 152], cl(drift * 0.7 + ripple * 0.3, 0, 1));
  c = sh(c, 0.94 + fine * 0.12);
  let h = 0.30 + ripple * 0.46 + drift * 0.18 + fine * 0.06;
  // the odd stone and a scatter of darker grains
  const st = worley(x * 8 + 0.5, y * 8 + 0.5, P * 8, 29);
  const stone = cl((0.09 - st.f1) * 14, 0, 1);
  if (stone > 0.01) { c = mixc(c, [148, 132, 108], stone * 0.7); h += stone * 0.30; }
  const dark = cl((fbm(x * 70 + 40, y * 70 + 12, P * 70, 2) - 0.72) * 6, 0, 1);
  c = sh(c, 1 - dark * 0.14);
  return { rgb: c, h: cl(h, 0, 1) };
}

/** SNOW: the winter archives. Wind-packed drifts with a sparkle -
 *  the sparkle is a SPECULAR cue, so it rides the height, not the
 *  albedo, and appears only when the sun is low enough to catch it. */
function snowPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const drift = fbm(x * 0.8, y * 0.8, P * 0.8, 5);
  const sastrugi = Math.sin((x * 2.2 + fbm(x * 1.4, y * 1.4, P * 1.4, 3) * 4) * Math.PI * 2 / P * 2) * 0.5 + 0.5;
  const grain = fbm(x * 60, y * 60, P * 60, 2);
  let c = mixc([206, 214, 226], [244, 248, 255], cl(drift * 0.6 + sastrugi * 0.4, 0, 1));
  c = sh(c, 0.96 + grain * 0.08);
  let h = 0.34 + drift * 0.40 + sastrugi * 0.22 + grain * 0.06;
  // the blue of a hollow: snow's shadows are not grey
  const holl = cl((0.42 - drift) * 3.2, 0, 1);
  c = mixc(c, [166, 186, 214], holl * 0.5); h -= holl * 0.18;
  // crystals, sparse and sharp
  const sp = cl((fbm(x * 120 + 7, y * 120 + 31, P * 120, 1) - 0.84) * 9, 0, 1);
  c = mixc(c, [255, 255, 255], sp * 0.9); h += sp * 0.10;
  return { rgb: c, h: cl(h, 0, 1) };
}

const SURFACES = { grass: grassPixel, dirt: dirtPixel, stone: stonePixel, sand: sandPixel, snow: snowPixel };
const SURFACE_KEYS = Object.keys(SURFACES);

const SIZE = 1024;
const px = new Uint8Array(SIZE * SIZE * 4);
const hgt = new Float32Array(SIZE * SIZE);
function paintSheet(name) {
  const fn = SURFACES[name] || grassPixel;
  for (let y = 0; y < SIZE; y++) {

    -(s2[0] * e[0] + s2[1] * e[1] + s2[2] * e[2]), -(uu[0] * e[0] + uu[1] * e[1] + uu[2] * e[2]), f[0] * e[0] + f[1] * e[1] + f[2] * e[2], 1]);
};
const hash = (p) => { let x = p[0] * 123.34, y = p[1] * 456.21; x -= Math.floor(x); y -= Math.floor(y); const d = x * x + y * y + 45.32; x += d; y += d; const r = x * y; return r - Math.floor(r); };
const vnoise = (x, y) => {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash([a, b]);
  return (h(ix, iy) * (1 - fx) + h(ix + 1, iy) * fx) * (1 - fy) + (h(ix, iy + 1) * (1 - fx) + h(ix + 1, iy + 1) * fx) * fy;
};
const terrainAt = (x, z) => vnoise(x * 0.020, z * 0.020) * 7 + vnoise(x * 0.055, z * 0.055) * 2.4 + vnoise(x * 0.15, z * 0.15) * 0.7;

let last = performance.now(), acc = 0, frames = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  acc += dt; frames++;
  if (acc > 0.5) { R('fps').textContent = `${Math.round(frames / acc)} fps  ·  ${(gr.count / 1000).toFixed(0)}k blades`; acc = 0; frames = 0; }
  const sp = (keys.has('shift') ? 26 : 9) * dt;
  if (keys.has('w')) { cam.x -= Math.sin(cam.yaw) * sp; cam.z -= Math.cos(cam.yaw) * sp; }
  if (keys.has('s')) { cam.x += Math.sin(cam.yaw) * sp; cam.z += Math.cos(cam.yaw) * sp; }

  const w = cv.width = cv.clientWidth * devicePixelRatio | 0;
  const h = cv.height = cv.clientHeight * devicePixelRatio | 0;
  gl.viewport(0, 0, w, h);
  const wx = WX[state.weather] || WX.sunny;
  // thunder flashes: a rare, brief, near-white sky, and the ground
  // takes it too - a flash that only lights the sky is a wallpaper
  const flash = state.weather === 'thunder'
    ? Math.max(0, Math.sin(now / 1000 * 0.7) > 0.985 ? 1 : 0) * (0.5 + 0.5 * Math.sin(now / 40)) : 0;
  const sky = wx.sky.map((v, i) => Math.min(1, v * (0.55 + 0.45 * Math.sin(state.sun * Math.PI / 180)) + flash * 0.55 + (i === 2 ? 0.02 : 0)));
  gl.clearColor(sky[0], sky[1], sky[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  const sa = state.sun * Math.PI / 180;
  const sun = [Math.cos(sa) * 0.75, Math.max(0.12, Math.sin(sa)), 0.35];
  const eye = [cam.x, terrainAt(cam.x, cam.z) + cam.h, cam.z];
  const dir = [-Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), -Math.cos(cam.yaw) * Math.cos(cam.pitch)];
  const vp = mul(persp(1.05, w / h, 0.1, 600), look(eye, [eye[0] + dir[0], eye[1] + dir[1], eye[2] + dir[2]], [0, 1, 0]));

  gl.useProgram(groundProg);
  gl.uniformMatrix4fv(gl.getUniformLocation(groundProg, 'uVP'), false, vp);
  gl.uniform1f(gl.getUniformLocation(groundProg, 'uTilePx'), state.tile);
  gl.uniform1f(gl.getUniformLocation(groundProg, 'uNew'), state.newGround ? 1 : 0);
  gl.uniform3fv(gl.getUniformLocation(groundProg, 'uEye'), eye);
  gl.uniform3fv(gl.getUniformLocation(groundProg, 'uSun'), sun);
  gl.uniform1f(gl.getUniformLocation(groundProg, 'uDim'), wx.dim + flash * 0.5);
  gl.uniform1f(gl.getUniformLocation(groundProg, 'uFog'), wx.fog);
  gl.uniform1f(gl.getUniformLocation(groundProg, 'uWet'), wx.wet);
  gl.uniform3fv(gl.getUniformLocation(groundProg, 'uSky'), new Float32Array(sky));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, groundTex);
  gl.uniform1i(gl.getUniformLocation(groundProg, 'uTex'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, groundNrm);
  gl.uniform1i(gl.getUniformLocation(groundProg, 'uNrm'), 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, groundLow);
  gl.uniform1i(gl.getUniformLocation(groundProg, 'uLow'), 2);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindVertexArray(gvao);
  gl.drawArrays(gl.TRIANGLES, 0, gverts.length / 2);

  if (state.grass) {
    gl.useProgram(grassProg);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniformMatrix4fv(gl.getUniformLocation(grassProg, 'uVP'), false, vp);
    gl.uniform1f(gl.getUniformLocation(grassProg, 'uTime'), now / 1000);
    gl.uniform1f(gl.getUniformLocation(grassProg, 'uWind'), state.wind);
    gl.uniform1f(gl.getUniformLocation(grassProg, 'uRange'), state.range);
    gl.uniform3fv(gl.getUniformLocation(grassProg, 'uEye'), eye);
    gl.bindVertexArray(gr.vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, gr.verts, gr.count);
    gl.disable(gl.BLEND);
  }

  if (wx.n > 0) {
    gl.useProgram(wxProg);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    const right = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
    const up = [0, 1, 0];
    gl.uniformMatrix4fv(gl.getUniformLocation(wxProg, 'uVP'), false, vp);
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uEye'), eye);
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uRight'), new Float32Array(right));
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uUp'), new Float32Array(up));
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uTime'), now / 1000);
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uKind'), wx.kind ?? 0);
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uBox'), BOX);
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uFall'), wx.kind === 1 ? 1.6 : 22.0);
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uWind'), state.wind * 0.02);
    gl.bindVertexArray(wxVao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, wxVerts, Math.min(wxCount, wx.n));
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
