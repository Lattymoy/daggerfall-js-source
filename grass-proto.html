<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daggerfall JS &mdash; ground + 3D grass prototype</title>
<!--
  GRASS PROTOTYPE (Mac: prototype the new ground textures AND the 3D
  grass before any code change, so he can see them).

  NOTHING HERE TOUCHES THE GAME. This is a standalone page over the
  same ideas the engine would use, so the look can be judged and tuned
  before a line of renderer changes:

    - the GROUND is the prototype tileset from tools/groundProto.mjs,
      sampled with mipmaps and anisotropy - the two things the live
      terrain array does NOT do today, and the reason a high-res tile
      would shimmer at distance if it were dropped in as-is.

    - the GRASS is one instanced draw. Every blade is the same three
      quads; a per-instance attribute carries its position, height,
      lean, phase and tint. That is the shape the engine needs
      (drawArraysInstanced, one call per terrain chunk) and the piece
      the renderer does not have yet.

    - placement is DETERMINISTIC on a hashed seed, the same rule the
      nature pass already uses for billboards, so blades do not crawl
      or repopulate as you move.

    - WIND is a vertex-shader offset weighted by height along the
      blade, so the tip travels and the root does not.

    - the far fade drops blades by distance so the count stays bounded.
-->
<style>
  html,body { margin:0; height:100%; background:#0d0f12; color:#cdc4a8;
    font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  .hud { position:fixed; left:12px; top:12px; background:rgba(10,12,16,.72);
    border:1px solid #55503f; padding:10px 12px; max-width:min(380px,46vw); }
  .hud h1 { margin:0 0 6px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:#e0d5ad; }
  .hud label { display:flex; align-items:center; gap:8px; margin:3px 0; }
  .hud input[type=range] { flex:1; }
  .hud .v { width:52px; text-align:right; color:#9c9378; }
  .hud p { margin:6px 0 0; color:#8d836c; }
  .note { margin:6px 0 0; color:#8b836c; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>Ground + 3D grass</h1>
  <label>blades <input id="density" type="range" min="20000" max="1200000" step="10000" value="1200000"><span class="v" id="vdensity"></span></label>
  <label>height <input id="height" type="range" min="10" max="120" step="1" value="54"><span class="v" id="vheight"></span></label>
  <label>wind <input id="wind" type="range" min="0" max="200" step="1" value="70"><span class="v" id="vwind"></span></label>
  <label>wind dir <input id="windDir" type="range" min="0" max="359" step="1" value="20"><span class="v" id="vwindDir"></span></label>
  <label>range <input id="range" type="range" min="10" max="200" step="1" value="200"><span class="v" id="vrange"></span></label>
  <label>tile m <input id="tile" type="range" min="1" max="8" step="1" value="2"><span class="v" id="vtile"></span></label>
  <label>sun&deg; <input id="sun" type="range" min="-20" max="90" step="1" value="34"><span class="v" id="vsun"></span></label>
  <label>weather <select id="wx">
    <option>sunny</option><option>cloudy</option><option>overcast</option><option>fog</option>
    <option>rain</option><option>thunder</option><option>snow</option>
  </select></label>
  <label><input id="retro" type="checkbox"> retro sky (the game's ?sky= pass)</label>
  <label>warmth <input id="warmth" type="range" min="0" max="100" step="1" value="35"><span class="v" id="vwarmth"></span></label>
  <label>front s <input id="frontS" type="range" min="2" max="90" step="1" value="9"><span class="v" id="vfrontS"></span></label>
  <label>surface <select id="surf">
    <option>grass</option><option>dirt</option><option>stone</option><option>sand</option>
  </select></label>
  <p class="note">drag to look &middot; W/S to move &middot; G grass &middot; T ground &middot; walk on snow to leave prints</p>
  <p class="note" id="fps"></p>
</div>
<script type="module">
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: true });
if (!gl) document.body.innerHTML = '<p style="padding:20px">WebGL2 is needed for this prototype.</p>';

const R = (id) => document.getElementById(id);
// the grass buffers, declared BEFORE the sliders that build them - the
// slider sync fires during setup and reached `gr` in its dead zone.
let gr = { vao: null, count: 0, verts: 0 };
let ready = false;   // the GL objects exist only after the programs link
const state = { density: 1200000, height: 54, wind: 70, windDir: 20, warmth: 35, frontS: 9, range: 200, tile: 2, sun: 34, surface: 'grass', weather: 'sunny', retro: false, grass: true, newGround: true };
for (const k of ['density', 'height', 'wind', 'windDir', 'range', 'tile', 'sun', 'warmth', 'frontS']) {
  const el = R(k); const out = R(`v${k}`);
  const sync = () => { state[k] = +el.value; out.textContent = el.value; if (k === 'density' && ready) build(); };
  el.addEventListener('input', sync); sync();
}
// the surface picker repaints both sheets and re-uploads them; the
// grass blades follow, because blades of grass on snow is a lie
function setSurface(name) {
  state.surface = name;
  paintSheet(name); paintNormals();
  gl.bindTexture(gl.TEXTURE_2D, groundTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindTexture(gl.TEXTURE_2D, groundNrm);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, nrm);
  gl.generateMipmap(gl.TEXTURE_2D);
  // AUDIT 39 F5: the picker turned the blades OFF for a non-grass
  // surface and never turned them back on, so choosing dirt and then
  // grass again left a bare field with no way back but a reload.
  state.grass = name === 'grass';
  R('surf').value = name;
}
addEventListener('keydown', (e) => {
  if (e.key === 'g' || e.key === 'G') state.grass = !state.grass;
  if (e.key === 't' || e.key === 'T') state.newGround = !state.newGround;
});

// ── the ground, GENERATED HERE ──────────────────────────────────────
// The offline tool derives Daggerfall's 56 tiles by masking its own
// shapes; those are a raster of game data and doctrine forbids
// shipping them, correctly. So this page draws its four bases with
// the SAME procedural surfaces the tool uses - which are ours - and
// the blend derivation stays offline, over a player's own archives.
function makeNoise(seed) {
  let s = seed >>> 0;
  const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  const perm = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  const p = new Uint8Array(512);
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => (((h & 4) ? -((h & 1) ? x : y) : ((h & 1) ? x : y)) + ((h & 8) ? -((h & 2) ? y : x) : ((h & 2) ? y : x)));
  return (x, y, period) => {
    const w = (n) => ((n % period) + period) % period;
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = w(xi) & 255, Y = w(yi) & 255, X1 = w(xi + 1) & 255, Y1 = w(yi + 1) & 255;
    const u = fade(xf), v = fade(yf);
    const lerp = (a, b, t) => a + (b - a) * t;
    return lerp(lerp(grad(p[(p[X] + Y) & 255], xf, yf), grad(p[(p[X1] + Y) & 255], xf - 1, yf), u),
      lerp(grad(p[(p[X] + Y1) & 255], xf, yf - 1), grad(p[(p[X1] + Y1) & 255], xf - 1, yf - 1), u), v) * 0.5 + 0.5;
  };
}
const nz = makeNoise(0x51ed);
const fbm = (x, y, period, oct, gain = 0.5) => {
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let o = 0; o < oct; o++) { sum += a * nz(x * f, y * f, period * f); norm += a; a *= gain; f *= 2; }
  return sum / norm;
};
function worley(x, y, period, seed) {
  const rnd = (i, j) => { let h = ((i * 374761393) ^ (j * 668265263) ^ (seed * 2246822519)) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return [(h & 0xffff) / 65536, ((h >>> 16) & 0xffff) / 65536]; };
  const xi = Math.floor(x), yi = Math.floor(y); let f1 = 9, f2 = 9;
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    const ci = xi + di, cj = yi + dj, w = (n) => ((n % period) + period) % period;
    const [ox, oy] = rnd(w(ci), w(cj));
    const d = Math.hypot(ci + ox - x, cj + oy - y);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
  }
  return { f1, f2 };
}
const cl = (v, a, b) => Math.min(b, Math.max(a, v));
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const sh = (c, k) => c.map((v) => cl(v * k, 0, 255));
// PROTO-2 (Mac: go deeper on the detail). The first cut painted grass
// as a TINTED FIELD - noise for colour, Worley for clumps - and it
// read as a net, because real turf is not a field. It is thousands of
// DRAWN BLADES lying over soil, each with a length, a direction and a
// shadow. So the texture is drawn the way it is made:
//
//   1. SOIL first, its own surface with grain and pebbles, because
//      every gap between blades shows it.
//   2. LITTER: a few thousand individual blades PLACED on a hashed
//      jittered lattice, each a short capsule with its own angle,
//      length, width and hue, drawn back-to-front so the near ones
//      overlap. Every blade darkens the soil just off its own axis -
//      a contact shadow, which is what makes a lawn read as depth
//      rather than pattern.
//   3. TUFTS: a low Worley field lifts whole clumps a shade brighter
//      and drops the hollows between them, so the sward has terrain.
//   4. DRY STRAW and BARE PATCHES, sparse, so it is not one colour.
//
// The lattice wraps, so the texture still tiles seamlessly.
/** The blade lattice. Cells wrap, so the sheet still tiles; each cell
 *  holds a few blades with hashed angle, length, width and hue, and a
 *  point is tested against the capsules of its own cell and its
 *  neighbours. Returns the nearest blade covering the point (or null)
 *  and, separately, how much shadow the point sits in. */
function makeBlades({ cells = 30, perCell = 6, len = [0.028, 0.075], wid = [0.0026, 0.0050] }) {
  const h2 = (i, j, k) => {
    let h = ((i * 374761393) ^ (j * 668265263) ^ (k * 2246822519)) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return [(h & 1023) / 1024, ((h >>> 10) & 1023) / 1024, ((h >>> 20) & 1023) / 1024];
  };
  const capsule = (px, py, ax, ay, bx, by) => {
    const dx = bx - ax, dy = by - ay;
    const t = cl(((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1e-9), 0, 1);
    return { d: Math.hypot(px - (ax + dx * t), py - (ay + dy * t)), t };
  };
  const visit = (u, v, fn) => {
    const ci = Math.floor(u * cells), cj = Math.floor(v * cells);
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const gi = ci + di, gj = cj + dj;
      const wi = ((gi % cells) + cells) % cells, wj = ((gj % cells) + cells) % cells;
      for (let k = 0; k < perCell; k++) {
        const [a, b, c2] = h2(wi, wj, k);
        const [d, e, f] = h2(wi + 977, wj + 331, k);
        // the blade's root, in this cell, offset into unwrapped space
        const rx = (gi + a) / cells, ry = (gj + b) / cells;
        const ang = c2 * 6.2832;
        const L = len[0] + d * (len[1] - len[0]);
        fn({ rx, ry, tx: rx + Math.cos(ang) * L, ty: ry + Math.sin(ang) * L,
          w: wid[0] + e * (wid[1] - wid[0]), hue: f, L });
      }
    }
  };
  return {
    /** the blade covering this point, if any - nearest wins */
    at(u, v, tuft, bare) {
      let best = null;
      visit(u, v, (bl) => {
        // thin the lattice where the sward thins
        if (bl.hue > 0.62 + tuft * 0.38 - bare * 0.80) return;
        const { d, t } = capsule(u, v, bl.rx, bl.ry, bl.tx, bl.ty);
        const w = bl.w * (1 - t * 0.7);          // blades taper
        if (d < w && (!best || t > best.t)) best = { t, shade: bl.hue };
      });
      return best;
    },
    /** how much this point sits in a blade's shadow: the same capsules,
     *  tested a hair off-axis, which is what gives a lawn its depth */
    shadow(u, v) {
      let s2 = 0;
      visit(u + 0.004, v + 0.006, (bl) => {
        const { d } = capsule(u + 0.004, v + 0.006, bl.rx, bl.ry, bl.tx, bl.ty);
        if (d < bl.w * 2.2) s2 = Math.max(s2, 1 - d / (bl.w * 2.2));
      });
      return s2;
    },
  };
}
const BLADES = makeBlades({});

function grassPixel(u, v) {
  const P = 8, x = u * P, y = v * P;
  // the soil, seen in every gap
  const grain = fbm(x * 30 + 21, y * 30 + 9, P * 30, 3);
  const tone = fbm(x * 1.4 - 4, y * 1.4 + 2, P * 1.4, 4);
  let c = mixc([74, 58, 40], [104, 82, 56], cl((tone - 0.35) * 2.0, 0, 1));
  c = sh(c, 0.86 + grain * 0.3);
  const peb = worley(x * 11 + 0.5, y * 11 + 0.5, P * 11, 17);
  const stone = cl((0.13 - peb.f1) * 11, 0, 1);
  if (stone > 0.01) c = mixc(c, [130, 122, 110], stone * 0.7);
  // the sward's terrain
  const t = worley(x * 3.1, y * 3.1, P * 3.1, 91);
  const tuft = cl((t.f2 - t.f1) * 2.6, 0, 1);
  const dry = cl((fbm(x * 0.5 + 11, y * 0.5 - 7, P * 0.5, 3) - 0.5) * 3.4, 0, 1);
  const bare = cl((0.34 - fbm(x * 0.7, y * 0.7, P * 0.7, 4)) * 4.5, 0, 1);
  const lit = BLADES.at(u, v, tuft, bare);
  if (lit) {
    const base = mixc([48, 76, 32], [118, 152, 66], cl(lit.t * 1.15, 0, 1));
    let bc = mixc(base, [152, 146, 84], dry * 0.5);
    bc = sh(bc, 0.78 + tuft * 0.30 + lit.shade * 0.40);
    bc = sh(bc, 0.94 + fbm(x * 70, y * 70, P * 70, 2) * 0.14);
    // the HEIGHT the normal map is built from: a blade stands, and
    // stands taller toward its tip
    return { rgb: bc, h: 0.45 + lit.t * 0.55 + tuft * 0.18 };
  }
  const sha = BLADES.shadow(u, v);
  c = sh(c, 0.62 + (1 - sha) * 0.50);
  c = mixc(c, [58, 80, 40], cl(0.35 + tuft * 0.65, 0, 1) * (1 - bare) * 0.62);
  return { rgb: c, h: 0.06 + stone * 0.30 + grain * 0.10 + tuft * 0.10 };
}

// PROTO-3 (Mac: push the land texture to extreme fidelity). Four
// things separate "a nice tile" from ground you believe:
//
//   1. RESOLUTION. 1024px, and the blade lattice scaled with it, so
//      the detail is real detail and not the same blades enlarged.
//   2. A NORMAL MAP, derived from the same blade field's own height -
//      every blade and every pebble gets a lit side and a shaded one
//      that MOVE with the sun. A flat albedo is the single biggest
//      reason a ground texture looks painted.
//   3. TWO SCALES. One sheet at ~2m tiles the near ground; a second,
//      LOW-frequency sheet at ~19m modulates it, so the eye never
//      finds the repeat that a single tile always shows on open land.
//   4. DISTANCE BLEND to a filtered average, so the far field settles
//      into colour instead of boiling.
// PROTO-4 (Mac: the other textures while we are at it). The same law
// the grass proved: a surface is DRAWN and it RECORDS ITS HEIGHT, so
// the normal map lights the thing itself. Each returns { rgb, h }.

/** DIRT: soil, and the things lying on it. The height is what sells
 *  it - pebbles stand, ruts sink, and the sun finds both. */
function dirtPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const tone = fbm(x * 1.2 - 4, y * 1.2 + 2, P * 1.2, 4);
  const grain = fbm(x * 40 + 21, y * 40 + 9, P * 40, 3);
  let c = mixc([104, 78, 52], [148, 116, 78], cl((tone - 0.35) * 2.0, 0, 1));
  c = sh(c, 0.84 + grain * 0.34);
  let h = 0.35 + grain * 0.14 + tone * 0.10;
  // ruts and cracks: long low channels the light pools in
  const rut = cl(1 - Math.abs(fbm(x * 1.9 + 40, y * 0.7, P * 1.9, 4) - 0.5) * 11, 0, 1);
  c = sh(c, 1 - rut * 0.24); h -= rut * 0.22;
  // pebbles: PLACED, with a catch-light and a dropped shadow
  for (const [freq, seed, size, tint] of [[7.5, 17, 0.20, [156, 146, 132]], [15, 71, 0.13, [128, 118, 104]]]) {
    const w = worley(x * freq + 0.5, y * freq + 0.5, P * freq, seed);
    const st = cl((size - w.f1) * (1 / size) * 1.6, 0, 1);
    if (st > 0.01) {
      c = mixc(c, tint, st * 0.78);
      c = sh(c, 1 + st * 0.16);
      h += st * 0.40;
    }
    const sha = cl((size * 1.7 - w.f1) * (1 / size), 0, 1) - st;
    if (sha > 0.01) c = sh(c, 1 - sha * 0.20);
  }
  // dry straw and root litter, sparse
  const straw = cl((fbm(x * 26 + 61, y * 9 - 3, P * 26, 2) - 0.74) * 7, 0, 1);
  c = mixc(c, [150, 132, 84], straw * 0.6); h += straw * 0.10;
  return { rgb: c, h: cl(h, 0, 1) };
}

/** STONE: plates, not cobbles. The first cut read as a cartoon
 *  pavement because every cell was one flat tone with a black moat.
 *  A plate is DOMED off sqrt(f2)-sqrt(f1) - zero at the seam, highest
 *  mid-plate - and the seam is a CRACK, narrow. */
function stonePixel(u, v) {
  const P = 5, x = u * P, y = v * P;
  const wx = (fbm(x * 0.9, y * 0.9, P * 0.9, 3) - 0.5) * 1.1;
  const wy = (fbm(x * 0.9 + 31, y * 0.9 - 17, P * 0.9, 3) - 0.5) * 1.1;
  const w = worley(x * 2.6 + wx, y * 2.6 + wy, P * 2.6, 53);
  const dome = cl((Math.sqrt(w.f2) - Math.sqrt(w.f1)) * 3.0, 0, 1);
  const mott = fbm(x * 2.4 + 7, y * 2.4 - 3, P * 2.4, 5);
  const grit = fbm(x * 44, y * 44, P * 44, 3);
  // each plate takes its own tone, so a wall is not one grey
  const plateTint = fbm(Math.floor(x * 2.6 + wx) * 3.7, Math.floor(y * 2.6 + wy) * 3.7, P * 9, 2);
  let c = mixc([88, 86, 82], [142, 139, 130], dome * 0.55 + mott * 0.3 + plateTint * 0.15);
  c = sh(c, 0.86 + grit * 0.30);
  let h = 0.25 + dome * 0.62 + grit * 0.08;
  const seam = cl(1 - dome * 8, 0, 1);
  c = mixc(c, [58, 57, 56], seam * 0.6); h -= seam * 0.42;
  // fine fracture lines ACROSS the plates, which real stone has
  const frac = cl(1 - Math.abs(fbm(x * 6 + 90, y * 6, P * 6, 3) - 0.5) * 16, 0, 1) * dome;
  c = sh(c, 1 - frac * 0.22); h -= frac * 0.12;
  // lichen only on the crowns, and it lifts the surface a hair
  const lich = cl((fbm(x * 3.6 + 60, y * 3.6 + 12, P * 3.6, 4) - 0.60) * 4.5, 0, 1) * dome;
  c = mixc(c, [104, 116, 68], lich * 0.42); h += lich * 0.05;
  return { rgb: c, h: cl(h, 0, 1) };
}

/** SAND: the desert climate's ground. Ripples are a HEIGHT field
 *  before they are a colour - a dune's light comes entirely from its
 *  own slope, so the normal map does nearly all the work here. */
function sandPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const drift = fbm(x * 0.7 + 3, y * 0.7 - 2, P * 0.7, 4);
  // wind ripples: a warped periodic train, crests perpendicular to it
  const wx2 = x + (fbm(x * 1.1, y * 1.1, P * 1.1, 3) - 0.5) * 1.6;
  const wy2 = y + (fbm(x * 1.1 + 19, y * 1.1 + 7, P * 1.1, 3) - 0.5) * 1.6;
  const ripple = Math.sin((wx2 * 3.0 + wy2 * 1.1) * Math.PI * 2 / P * 3) * 0.5 + 0.5;
  const fine = fbm(x * 55, y * 55, P * 55, 2);
  let c = mixc([196, 168, 118], [226, 202, 152], cl(drift * 0.7 + ripple * 0.3, 0, 1));
  c = sh(c, 0.94 + fine * 0.12);
  let h = 0.30 + ripple * 0.46 + drift * 0.18 + fine * 0.06;
  // the odd stone and a scatter of darker grains
  const st = worley(x * 8 + 0.5, y * 8 + 0.5, P * 8, 29);
  const stone = cl((0.09 - st.f1) * 14, 0, 1);
  if (stone > 0.01) { c = mixc(c, [148, 132, 108], stone * 0.7); h += stone * 0.30; }
  const dark = cl((fbm(x * 70 + 40, y * 70 + 12, P * 70, 2) - 0.72) * 6, 0, 1);
  c = sh(c, 1 - dark * 0.14);
  return { rgb: c, h: cl(h, 0, 1) };
}

/** SNOW: the winter archives. Wind-packed drifts with a sparkle -
 *  the sparkle is a SPECULAR cue, so it rides the height, not the
 *  albedo, and appears only when the sun is low enough to catch it. */
function snowPixel(u, v) {
  const P = 6, x = u * P, y = v * P;
  const drift = fbm(x * 0.8, y * 0.8, P * 0.8, 5);
  const sastrugi = Math.sin((x * 2.2 + fbm(x * 1.4, y * 1.4, P * 1.4, 3) * 4) * Math.PI * 2 / P * 2) * 0.5 + 0.5;
  const grain = fbm(x * 60, y * 60, P * 60, 2);
  let c = mixc([206, 214, 226], [244, 248, 255], cl(drift * 0.6 + sastrugi * 0.4, 0, 1));
  c = sh(c, 0.96 + grain * 0.08);
  let h = 0.34 + drift * 0.40 + sastrugi * 0.22 + grain * 0.06;
  // the blue of a hollow: snow's shadows are not grey

uniform float uRetroStep;   // 0 = the smooth pass; else the angular pixel (radians)
uniform float uRetroLevels; // 0 = no posterise

// ES1f: A CELL ON THE CUBE, NOT ON A LAT-LONG GRID.
// Snapping azimuth and elevation put the grid's POLE at the zenith:
// the elevation rings became concentric circles and the azimuth cells
// converged to nothing, so looking straight up was a bullseye with
// everything woven into it. A cube has no pole. The direction is
// projected onto whichever of the six faces it points at, snapped on
// that face's square grid, and rebuilt - cells stay near-square
// everywhere, the zenith is an ordinary patch of an ordinary face, and
// the only cost is the cube's own mild corner distortion, which has no
// centre for the eye to find.
// The n argument is cells per face; the cell id (with the face folded in) comes
// back in cellOut for the dither and the star field.
vec3 cubeSnap(vec3 dir, float n, out vec2 cellOut) {
  vec3 a = abs(dir);
  float m = max(a.x, max(a.y, a.z));
  vec2 raw; float face;
  if (a.x >= m) { raw = dir.zy / a.x; face = dir.x > 0.0 ? 0.0 : 1.0; }
  else if (a.y >= m) { raw = dir.xz / a.y; face = dir.y > 0.0 ? 2.0 : 3.0; }
  else { raw = dir.xy / a.z; face = dir.z > 0.0 ? 4.0 : 5.0; }
  // EQUI-ANGULAR faces (ES1f, second pass). A plain cube face is a
  // TANGENT plane, so its cells cover 2.6x less sky at the corners than
  // at the centre - and a cell size that varies across the frame beats
  // against the screen's own grid and draws curved moire rings, which
  // is the pole artifact's ghost rather than its cure. Warping the face
  // by atan (the equi-angular cubemap of 360 video) makes every cell
  // the SAME ANGLE everywhere, so the grid reads as an even bitmap in
  // every direction. A face spans 90 degrees, so n = (PI/2)/step gives
  // the painted sky's pixel: 256 a face, 512 across 180 degrees, which
  // is SKY??.DAT's own width.
  vec2 uv = atan(raw) * 1.27323954;                 // 4/PI: [-1,1] over the face
  vec2 cell = floor(uv * n);
  vec2 t = tan((cell + 0.5) / n * 0.78539816);      // PI/4: back to the tangent plane
  cellOut = cell + face * 977.0;                    // a face's cells are its own
  if (a.x >= m) return normalize(vec3(sign(dir.x), t.y, t.x));
  if (a.y >= m) return normalize(vec3(t.x, sign(dir.y), t.y));
  return normalize(vec3(t.x, t.y, sign(dir.z)));
}

// Bayer 4x4, the ordered dither a 256-colour gradient used.
float bayer4(vec2 p) {
  int x = int(mod(p.x, 4.0)), y = int(mod(p.y, 4.0));
  int i = y * 4 + x;
  float m[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
  return m[i] / 16.0;
}
out vec4 outColor;

float hash21(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i), b = hash21(i + vec2(1, 0)), c = hash21(i + vec2(0, 1)), d = hash21(i + vec2(1, 1));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * vnoise(p); p = p * 2.03 + vec2(17.1, 9.7); a *= 0.5; }
  return v;
}

// ES1c: ONE CLOUD DECK. The far deck is given a smaller, slower,
// thinner treatment; sunAz is how much this ray points at the sun,
// which is what lights the deck. Returns cover (x) and the noise the
// colour is chosen by (y).
vec2 deck(vec3 dir, float scale, vec2 wind, float cover, float soft, float bias) {
  vec2 p = dir.xz / (dir.y + 0.18) * scale + wind * uTime;
  float n = fbm(p) + bias;
  float cov = smoothstep(1.0 - cover, 1.0 - cover + soft, n);
  return vec2(cov, n);
}

vec3 moon(vec3 dir, vec4 m, vec3 col, float vis) {
  if (vis <= 0.0) return vec3(0.0);
  vec3 md = m.xyz; float r = m.w;
  float cosA = dot(dir, md);
  if (cosA < cos(r * 1.6)) return vec3(0.0);
  vec3 up = abs(md.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
  vec3 ex = normalize(cross(up, md)); vec3 ey = cross(md, ex);
  vec2 uv = vec2(dot(dir, ex), dot(dir, ey)) / r;
  float rr = dot(uv, uv);
  float disc = 1.0 - smoothstep(0.88, 1.06, rr);
  // The sphere's normal at this point of the disc, facing the viewer.
  vec3 n = normalize(ex * uv.x + ey * uv.y - md * sqrt(max(0.0, 1.0 - min(rr, 1.0))));
  float lit = smoothstep(-0.06, 0.16, dot(n, uSunDir));
  float limb = 0.85 + 0.15 * (1.0 - rr);
  return col * (0.05 + 0.95 * lit) * limb * disc * vis;
}

// PROTO-15 (Mac: the stars are still stripes in a lot of places).
// The sub-cell position was fixed in PROTO-14 and the field STILL
// banded, because the fault is one level down: hash21 is a
// float-multiply-and-fract hash, and the star field feeds it CELL IDS
// - integers, and large ones, since cubeSnap folds the face in as
// +977 per face and the scale is 127 or 236. Feeding a weak float
// hash a lattice of large integers is the textbook way to get
// correlated output: fract(n * 123.34) walks in near-constant steps
// as n increments, so neighbouring cells get neighbouring values, the
// threshold test cuts them in bands, and the sky comes out ruled.
//
// A star field needs an INTEGER hash. This is a 32-bit avalanche - two
// multiply-xor-shift rounds over the cell coordinates - which
// decorrelates adjacent integers by construction. The same hash gives
// the threshold, the sub-cell position and the brightness, so all
// three are independent of the lattice instead of drawn on it.
uint uhash(uvec2 v) {
  uint h = v.x * 1597334677u ^ v.y * 3812015801u;
  h ^= h >> 15; h *= 2246822519u;
  h ^= h >> 13; h *= 3266489917u;
  h ^= h >> 16;
  return h;
}
float ihash(vec2 cell, float salt) {
  uvec2 u = uvec2(ivec2(floor(cell)) + ivec2(4096));
  return float(uhash(u + uvec2(uint(salt * 71.0), uint(salt * 131.0)))) * (1.0 / 4294967296.0);
}

float stars(vec3 dir, float amount) {
  if (amount <= 0.0 || dir.y < 0.0) return 0.0;
  float s = 0.0;
  // ES1c: THE FIELD WHEELS. The stars were fixed in world space, so
  // midnight's sky was dusk's sky exactly - the one thing about a night
  // sky everybody has seen is that it turns. It turns about a POLE
  // (uStarPole: north, tilted off the zenith), by uStarAngle, which the
  // clock advances a full turn a day, so the field rises in the east
  // and sets in the west like everything else.
  vec3 axis = normalize(uStarPole);
  float ca = cos(uStarAngle), sa = sin(uStarAngle);
  vec3 d = dir * ca + cross(axis, dir) * sa + axis * dot(axis, dir) * (1.0 - ca);   // Rodrigues
  // ES1f: the field is cast on the CUBE too. On a lat-long grid the
  // cells converged at the pole - a pinwheel of stars - and the density
  // piled up there, which is exactly wrong: a star field is even.
  for (int layer = 0; layer < 2; layer++) {
    // The cube covers the sphere with 6n^2 cells where the lat-long grid
    // used ~2*pi^2*scale^2, so the same star density wants a bigger n:
    // 6n^2 = 2*pi^2*70^2 gives n ~ 127, and the second layer follows.
    float scale = layer == 0 ? 127.0 : 236.0;

    // PROTO-15 (Mac: stars are STILL stripes in a lot of places). The
    // first fix kept cubeSnap's integer cell id as the key and derived
    // the sub-cell offset SEPARATELY - two computations of the same
    // thing, and any disagreement between them puts every star in a
    // cell on one line. cubeSnap is not consulted here at all now: the
    // face coordinate is computed ONCE, and the cell id and the
    // position inside it are the floor and the fract OF THE SAME
    // NUMBER. They cannot disagree, because there is nothing left to
    // disagree about.
    vec3 ad = abs(d);
    float md = max(ad.x, max(ad.y, ad.z));
    vec2 raw; float face;
    if (ad.x >= md) { raw = d.zy / ad.x; face = d.x > 0.0 ? 0.0 : 1.0; }
    else if (ad.y >= md) { raw = d.xz / ad.y; face = d.y > 0.0 ? 2.0 : 3.0; }
    else { raw = d.xy / ad.z; face = d.z > 0.0 ? 4.0 : 5.0; }
    vec2 uvf = atan(raw) * 1.27323954;          // equi-angular: one cell, one angle
    vec2 g = uvf * scale + vec2(face * 977.0 + float(layer) * 31.7);
    vec2 cell = floor(g), f = fract(g);
    float h = ihash(cell, 7.3 + float(layer) * 3.0);
    float thresh = layer == 0 ? 0.955 : 0.985;
    if (h > thresh) {
      vec2 star = vec2(ihash(cell, 1.1 + float(layer)), ihash(cell, 2.2 + float(layer))) * 0.7 + 0.15;
      float d = length(f - star);
      float b = 0.35 + 0.65 * (h - thresh) / (1.0 - thresh);
      s += b * (layer == 0 ? 1.4 : 0.8) * exp(-d * d * 60.0);
    }
  }
  return s * amount * smoothstep(0.0, 0.08, dir.y);   // the fade is on the REAL elevation: a star sets where the horizon is
}

void main() {
  // PROTO-19 (1, Mac: the sky should not rotate when you rotate the
  // camera). It was built on a DIFFERENT convention from the camera
  // that looks at it. The page's camera faces -Z and its forward is
  // (-sin y cos p, sin p, -cos y cos p); this ray was built facing +Z
  // and then yawed the other way, which is a 180-degree offset AND an
  // inverted pitch. The dome was still world-fixed in its own frame -
  // it was fixed to the WRONG frame, so turning swung the sky against
  // the ground and the whole vault appeared to follow the head.
  //
  // The ray is built in the camera's own convention now: down -Z,
  // pitched and yawed exactly as the lookAt does. At yaw 0 and pitch 0 the
  // sky's forward IS the camera's forward, so the sun stays where the
  // world put it however you turn.
  vec3 ray = normalize(vec3(vNdc.x * uTanHalfFov * uAspect, vNdc.y * uTanHalfFov, -1.0));
  float cp = cos(uPitch), sp = sin(uPitch);
  vec3 r1 = vec3(ray.x, ray.y * cp - ray.z * sp, ray.y * sp + ray.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  // PROTO-20 (Mac: the sky STILL rotates). I fixed two of the three
  // terms and broke the one that was right. Worked out against the
  // camera's own forward, which is (-sin y cos p, sin p, -cos y cos p):
  // with the ray down -Z and the corrected pitch, a straight-ahead ray
  // must come out as (-cp*sy, sp, -cp*cy). My yaw form gave (+cp*sy,
  // ...) - MIRRORED in x - so turning moved the sky the wrong way,
  // which is precisely "the sky rotates when you turn". The game's own
  // yaw expression was correct all along and is restored; only the
  // ray's -Z and the pitch sign were ever wrong.
  vec3 dir = normalize(vec3(r1.x * cy + r1.z * sy, r1.y, -r1.x * sy + r1.z * cy));

  // ES1e: THE ANGULAR PIXEL, on the painted sky's own scale
  // (SKY_ANGLE_PER_PIXEL) - and ES1f: on a CUBE, so it has no pole. The
  // direction is snapped BEFORE anything is computed, so every feature
  // below is drawn on the grid and the pixels are fixed to the world
  // rather than to the screen. The faces are equi-angular, so a face's
  // 90 degrees over n cells makes every cell exactly one step wide:
  // n = (PI/2)/step is 256 a face, 512 across 180 degrees - SKY??.DAT.
  vec2 cell = vec2(0.0);
  if (uRetroStep > 0.0) dir = cubeSnap(dir, 1.57079633 / uRetroStep, cell);

  // The dome: horizon to zenith.
  float e = clamp(dir.y, 0.0, 1.0);
  vec3 color = mix(uHorizon, uZenith, pow(e, 0.55));
  // BELOW THE HORIZON the terrain is what a player sees, but the sky is
  // drawn first and shows wherever the ground does not reach - and a
  // flat slab of the horizon colour with the full dawn glow on it read
  // as a bright BAND with a hard seam at the horizon (the first
  // render's one fault). So the dome keeps going down: the horizon
  // colour darkens toward the nadir, and the glow falls off below the
  // horizon as fast as it does above it, so the horizon is a line
  // rather than an edge.
  float below = clamp(-dir.y, 0.0, 1.0);
  color = mix(color, uHorizon * 0.55, pow(below, 0.7));

  // The glow on the sun's side of the horizon (dawn, dusk).
  vec2 dh = normalize(dir.xz + vec2(1e-5, 0.0));
  vec2 sh = normalize(uSunDir.xz + vec2(1e-5, 0.0));
  float az = max(dot(dh, sh), 0.0);
  color += uGlowColor * pow(az, 2.5) * exp(-abs(dir.y) * 9.0) * uGlowAmount;

  // Stars, then the moons, under the clouds.
  color += vec3(0.95, 0.97, 1.0) * stars(dir, uStars);
  color += moon(dir, uMoonA, uMoonAColor, uMoonAVis);
  color += moon(dir, uMoonB, uMoonBColor, uMoonBVis);

  // The sun: a disc and a halo.
  float cosSun = dot(dir, uSunDir);
  float disc = smoothstep(cos(uSunRadius), cos(uSunRadius * 0.6), cosSun) * uSunVis;
  float halo = (pow(max(cosSun, 0.0), 40.0) * 0.55 + pow(max(cosSun, 0.0), 8.0) * 0.10) * uSunVis;

  // ES1c: TWO DECKS, LIT BY THE SUN. One fbm sheet coloured by its own
  // noise was a smear: it had no depth (nothing moved against anything)
  // and no idea where the sun was, so a bank never had a bright rim and
  // never had a dark belly. Now a HIGH deck - small, slow, thin - sits
  // behind a LOW one - large, faster, thicker - and both are lit by
  // sunAz, how far this ray is from the sun: toward the sun a bank is
  // rimmed (the light coming through its edge), away from it the thick
  // parts go to the shade colour. The lighting fades out at night with
  // the palette's own sun colour, which is black below the horizon.
  float cloud = 0.0;
  if (dir.y > 0.0) {
    float near = smoothstep(0.28, 0.0, dir.y);
    vec2 hi = deck(dir, 0.95, uWind * 0.55, uCloudCover * 0.75, uCloudSoft * 1.5, 0.0);
    vec2 lo = deck(dir, 1.9, uWind, uCloudCover, uCloudSoft, 0.0);
    // The low deck covers the high one where it is; what is left of the
    // high deck shows through the gaps.
    float covHi = hi.x * (1.0 - lo.x) * 0.7;
    float cov = lo.x + covHi;
    // PROTO-14 (5, Mac: the horizon stays unclouded under full cover).
    // The game thins the deck toward the horizon by multiplying cover
    // BY cover - at 0.5 cover that is a quarter of the cloud where the
    // sky is largest, so an overcast day has a clear rim all round.
    // Declared divergence: the haze stays (a deck does go pale with
    // distance) and the THINNING goes, so cover means cover to the
    // horizon.
    cloud = mix(cov, cov * mix(uCloudCover, 1.0, 0.75), near);
    float n = mix(hi.y, lo.y, lo.x);                       // the deck in front decides the colour
    float sunAz = max(dot(dir, uSunDir), 0.0);
    // The rim: strongest at the thin edges of a bank, and only near the sun.
    float edge = 1.0 - abs(n - (1.0 - uCloudCover)) * 3.0;
    float rim = clamp(edge, 0.0, 1.0) * pow(sunAz, 3.0);
    float thick = smoothstep(0.45, 0.95, n);
    vec3 cc = mix(uCloudShade, uCloudLit, thick * 0.75 + 0.25 * pow(sunAz, 1.5));
    cc += uSunColor * rim * 0.55 * uSunVis;                 // lit through the edge
    cc = mix(cc, cc * 0.86, (1.0 - pow(sunAz, 0.7)) * thick);   // the belly away from the sun
    cc = mix(cc, mix(uHorizon, cc, 0.55), near);            // into the haze at the horizon
    color = mix(color, cc, cloud);
  }
  color += uSunColor * disc * (1.0 - cloud) + uSunColor * halo * (1.0 - 0.7 * cloud);

  // ES1c: DITHER. A dome is one big smooth gradient and eight bits is
  // not enough for one: 46% of the rows in a noon frame came out
  // byte-identical to the row above, which is a visible stair. A
  // sub-bit of hash noise before the write breaks the stair and costs
  // two instructions; it is about one quantisation step, so it is never
  // itself visible. TRIANGULAR, not flat: two hashes summed give the
  // error a triangular distribution, which is the shape that fully
  // decorrelates it from the signal - a flat one left a third of the
  // rows still identical to the row above.
  vec3 out3 = mix(clamp(color, 0.0, 1.0), uFogColor, uFogMix);
  if (uRetroLevels > 0.0) {
    // ES1e: posterise with an ORDERED dither, indexed by the ANGULAR
    // cell - one Bayer cell per sky pixel, or it is a fine weave under a
    // coarse one, which is two eras at once, and it would crawl when the
    // camera turned.
    float b = bayer4(uRetroStep > 0.0 ? cell : gl_FragCoord.xy) - 0.5;
    out3 = floor(out3 * uRetroLevels + 0.5 + b) / uRetroLevels;
  } else {
    // The SMOOTH pass's dither. Interleaved gradient noise, not a hash:
    // the hash of ES1c measured well (46% of identical rows to 25%) but
    // it is STRUCTURED at integer coordinates - a visible weave under
    // magnification, which is the one thing a dither must not be. IGN is
    // the standard for exactly this and is three constants.
    float ign = fract(52.9829189 * fract(0.06711056 * gl_FragCoord.x + 0.00583715 * gl_FragCoord.y));
    out3 += (ign - 0.5) / 255.0;
  }
  outColor = vec4(out3, 1.0);
}`;
const skyProg = prog(`#version 300 es
precision highp float;
layout(location=0) in vec2 aP;
out vec2 vNdc;
void main(){ vNdc = aP; gl_Position = vec4(aP, 1.0, 1.0); }`, SKY_FS);

/** AUDIT 42 F1: no non-finite number reaches any shader on this page.

const safe3 = (v) => new Float32Array([safe1(v[0]), safe1(v[1]), safe1(v[2])]);

{

const inv4 = (m) => {
  const a = m, o2 = new Float32Array(16);
  const s0=a[0]*a[5]-a[1]*a[4], s1=a[0]*a[6]-a[2]*a[4], s2=a[0]*a[7]-a[3]*a[4],
        s3=a[1]*a[6]-a[2]*a[5], s4=a[1]*a[7]-a[3]*a[5], s5=a[2]*a[7]-a[3]*a[6],
        c5=a[10]*a[15]-a[11]*a[14], c4=a[9]*a[15]-a[11]*a[13], c3=a[9]*a[14]-a[10]*a[13],
        c2=a[8]*a[15]-a[11]*a[12], c1=a[8]*a[14]-a[10]*a[12], c0=a[8]*a[13]-a[9]*a[12];
  const det = s0*c5-s1*c4+s2*c3+s3*c2-s4*c1+s5*c0, id = 1/det;
  o2[0]=(a[5]*c5-a[6]*c4+a[7]*c3)*id;  o2[1]=(-a[1]*c5+a[2]*c4-a[3]*c3)*id;
  o2[2]=(a[13]*s5-a[14]*s4+a[15]*s3)*id; o2[3]=(-a[9]*s5+a[10]*s4-a[11]*s3)*id;
  o2[4]=(-a[4]*c5+a[6]*c2-a[7]*c1)*id; o2[5]=(a[0]*c5-a[2]*c2+a[3]*c1)*id;
  o2[6]=(-a[12]*s5+a[14]*s2-a[15]*s1)*id; o2[7]=(a[8]*s5-a[10]*s2+a[11]*s1)*id;
  o2[8]=(a[4]*c4-a[5]*c2+a[7]*c0)*id;  o2[9]=(-a[0]*c4+a[1]*c2-a[3]*c0)*id;
  o2[10]=(a[12]*s4-a[13]*s2+a[15]*s0)*id; o2[11]=(-a[8]*s4+a[9]*s2-a[11]*s0)*id;
  o2[12]=(-a[4]*c3+a[5]*c1-a[6]*c0)*id; o2[13]=(a[0]*c3-a[1]*c1+a[2]*c0)*id;
  o2[14]=(-a[12]*s3+a[13]*s1-a[14]*s0)*id; o2[15]=(a[8]*s3-a[9]*s1+a[10]*s0)*id;
  return o2;
};

// ── WEATHER (Mac: overhauled weather effects, in the same lab) ─────
// The port's sim already carries Daggerfall's seven states - sunny,
// cloudy, overcast, fog, rain, thunder, snow - so what is missing is
// not a model, it is a LOOK. Every wet state here is ONE INSTANCED
// DRAW of the same quad, exactly the shape the grass proved, with a
// per-instance seed deciding fall speed, size, drift and phase.
//
// The four things a replacement has to get right, and the reason each:
//   1. IT FALLS THROUGH A VOLUME AROUND THE CAMERA, not across the
//      screen. Particles live in a box that FOLLOWS the eye and wrap
//      inside it, so a fixed count covers any view distance and the
//      rain does not thin out when you turn.
//   2. RAIN IS STRETCHED ALONG ITS OWN VELOCITY, not a round dot.
//      A drop is a streak whose length is its speed; that single
//      thing is the difference between rain and TV static.
//   3. SNOW TUMBLES. A flake's drift is a slow sine on its own phase,
//      so no two fall alike and the field never reads as a sheet.
//   4. THE WORLD ANSWERS: the sun dims and cools, fog closes the
//      distance, and the ground darkens and takes a wet sheen. A
//      particle layer over an unchanged world is a screensaver.
const WEATHER = ['sunny', 'cloudy', 'overcast', 'fog', 'rain', 'thunder', 'snow'];

const wxProg = prog(HEAD + `
layout(location=0) in vec2 aCorner;
layout(location=1) in vec4 aSeed;      // x,y,z in the box + phase

  }

  if (wx.n > 0 && wsky.fall > 0.01) {
    gl.useProgram(wxProg);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    const right = [Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
    const up = [0, 1, 0];
    gl.uniformMatrix4fv(gl.getUniformLocation(wxProg, 'uVP'), false, vp);
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uEye'), eye);
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uRight'), new Float32Array(right));
    gl.uniform3fv(gl.getUniformLocation(wxProg, 'uUp'), new Float32Array(up));
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uTime'), now / 1000);
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uBox'), BOX);
    // AUDIT 39 F4: the fall speed follows the front, not the dropdown.
    // Reading the TARGET made the last rain of a rain->snow change
    // crawl at flake speed the instant the menu moved.
    const fallT = wxT.kind === 1 ? 1.6 : 22.0, fallF = (WX[front.from] || WX.sunny).kind === 1 ? 1.6 : 22.0;
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uFall'), lerp(fallF, fallT, ease(front.t)));
    gl.uniform1f(gl.getUniformLocation(wxProg, 'uKind'), ease(front.t) > 0.5 ? (wxT.kind ?? 0) : ((WX[front.from] || WX.sunny).kind ?? 0));
    // the wind VECTOR: a direction and a real speed, so rain drives
    // across the world rather than drifting in one axis
    gl.uniform2fv(gl.getUniformLocation(wxProg, 'uWindV'), new Float32Array(windV));
    gl.bindVertexArray(wxVao);
    // the rain starts when the sky already LOOKS like rain
    gl.drawArraysInstanced(gl.TRIANGLES, 0, wxVerts, Math.min(wxCount, Math.round(wx.n * wsky.fall)));
    gl.depthMask(true);
    gl.disable(gl.BLEND);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
