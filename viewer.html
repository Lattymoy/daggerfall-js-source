<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Paperdoll Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #14141a; overflow: hidden; touch-action: none; font-family: -apple-system, system-ui, sans-serif; }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: env(safe-area-inset-top, 8px); left: 0; right: 0; text-align: center; color: #8a8a99; font-size: 12px; pointer-events: none; padding-top: 8px; }
  #swordinfo { position: fixed; top: calc(env(safe-area-inset-top, 8px) + 26px); left: 0; right: 0; text-align: center; color: #b8b8c8; font-size: 12px; pointer-events: none; }
  #bar { position: fixed; bottom: env(safe-area-inset-bottom, 0); left: 0; right: 0; display: flex; gap: 8px; padding: 12px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #bar button { flex: 0 0 auto; }
  button { background: #23232e; color: #cfcfda; border: 1px solid #34343f; border-radius: 999px; padding: 12px 18px; font-size: 14px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  button:active { background: #2e2e3a; }
  #tunertab { pointer-events: auto; padding: 8px 16px; font-size: 12px; }
  #tunerbody { display: flex; flex-direction: column; gap: 8px; align-items: center; width: 100%; max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  #pxrow.open #tunerbody { max-height: 55vh; overflow-y: auto; pointer-events: auto; touch-action: pan-y; }
  button.on { background: #3a3a48; color: #fff; }
  #clothqapanel { position:fixed; z-index:5; top:48px; right:12px; width:min(94vw,520px); max-height:calc(100vh - 140px); overflow:auto; display:none; gap:10px; padding:12px; background:rgba(20,20,26,.96); border:1px solid #34343f; border-radius:12px; color:#b8b8c8; font-size:11px; pointer-events:auto; touch-action:pan-y; }
  #clothqapanel.open { display:grid; }
  #clothqapanel .qaimgs { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; align-items:start; }
  #clothqapanel figure { min-width:0; }
  #clothqapanel figcaption { margin-bottom:4px; color:#8a8a99; }
  #clothqapanel canvas { width:100%; height:auto; min-height:48px; background:#0d0d11; image-rendering:pixelated; border:1px solid #2e2e38; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">NEUTRAL POSE prototype &middot; drag to rotate &middot; pinch to zoom</div>
<div id="swordinfo"></div>
<div id="bar">
  <button id="spin" class="on">auto-spin</button>
  <button id="reset">reset view</button>
  <button id="wire">wireframe</button>
  <button id="bg">bg</button>
  <button id="walk">walk</button>
  <button id="pose">pose: none</button>
  <select id="wpn" title="all classic Daggerfall weapons"></select>
  <select id="shield" title="all classic Daggerfall shields"></select>
  <button id="fpv">view: orbit</button>
  <button id="hurt">hurt</button>
  <button id="sword">weapon: off</button>
  <button id="atkdir">dir: Down</button>
  <button id="strike">strike</button>
  <span id="spdv">SPD 50</span><input id="spd" type="range" min="10" max="100" value="50" style="width:70px">
  <button id="armormat">armor: Steel</button>
  <button id="armorvariant">armor variant: 0</button>
  <button id="armor-cuirass">cuirass</button>
  <button id="armor-gauntlets">gauntlets</button>
  <button id="armor-greaves">greaves</button>
  <button id="armor-pauldronL">pauldron L</button>
  <button id="armor-pauldronR">pauldron R</button>
  <button id="armor-helm">helm</button>
  <button id="armor-boots">armor boots</button>
  <button id="gender">gender: male</button>
  <button id="race">race: Human</button>
  <button id="tone">tone: Pale</button>
  <button id="hairstyle">hair: short</button>
  <button id="drape">drape: None</button>
  <select id="clothing" title="classic Daggerfall clothing"></select>
  <button id="clothvariant">cloth variant: -</button>
  <button id="clothdye">cloth dye: Blue</button>
  <button id="wrapdir" title="snap through the eight generated clothing wrap directions">wrap: free</button>
  <button id="clothtexqa" title="compare raw Daggerfall paperdoll art, registered material surface, and generated wraps">texture QA</button>
  <select id="villager" title="villager design (editor only - no game wiring)"></select>
  <select id="orc" title="orc line (editor only - no game wiring)"></select>
  <select id="undead" title="undead line (editor only - no game wiring)"></select>
  <select id="classes" title="human class enemies (editor only - no game wiring)"></select>
  <select id="atronach" title="atronachs (editor only - no game wiring)"></select>
  <select id="beast" title="beasts (editor only - no game wiring)"></select>
  <select id="daedra" title="daedra (editor only - no game wiring)"></select>
</div>
<div id="clothqapanel">
  <div id="clothqastatus">select classic clothing with ARENA2 data</div>
  <div class="qaimgs">
    <figure><figcaption>raw paperdoll</figcaption><canvas id="clothqa-source"></canvas></figure>
    <figure><figcaption>registered surface</figcaption><canvas id="clothqa-canonical"></canvas></figure>
    <figure><figcaption>8-way atlas</figcaption><canvas id="clothqa-atlas"></canvas></figure>
  </div>
</div>
<div id="pxrow" style="position:fixed; bottom:calc(env(safe-area-inset-bottom,0) + 72px); left:0; right:0; display:flex; flex-direction:column; gap:8px; align-items:center; color:#8a8a99; font-size:12px; pointer-events:none;">
  <button id="tunertab">tuners &#9650;</button>
  <div id="tunerbody">
  <div style="display:flex; gap:8px; align-items:center;"><span id="pxlab" style="width:120px; text-align:right;">pixelize: 9x</span><input id="px" type="range" min="1" max="16" step="1" value="9" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="cdlab" style="width:120px; text-align:right;">color: full</span><input id="cd" type="range" min="1" max="9" step="1" value="9" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="ap_lab" style="width:120px; text-align:right;">arm pitch: 0</span><input id="ap" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="as_lab" style="width:120px; text-align:right;">arm spread: 0</span><input id="as" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="ae_lab" style="width:120px; text-align:right;">elbow: 0</span><input id="ae" type="range" min="0" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="ah_lab" style="width:120px; text-align:right;">hand roll: 0</span><input id="ah" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="ahp_lab" style="width:120px; text-align:right;">hand pitch: 0</span><input id="ahp" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="ahy_lab" style="width:120px; text-align:right;">hand yaw: 0</span><input id="ahy" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="sp_lab" style="width:120px; text-align:right;">swd pitch: 0&deg;</span><input id="sp" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="sf_lab" style="width:120px; text-align:right;">swd fwd: 0</span><input id="sf" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  <div style="display:flex; gap:8px; align-items:center;"><span id="su_lab" style="width:120px; text-align:right;">swd up: 0</span><input id="su" type="range" min="-100" max="100" step="1" value="0" style="touch-action:pan-x; pointer-events:auto; width:min(46vw,300px);"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="/src/tools/paperdollViewer.js"></script>
<script>
(() => {
  const dirs = [0, 45, 90, 135, 180, 225, 270, 315];
  let next = 0;
  const btn = document.getElementById('wrapdir');
  const show = (deg) => {
    const d = ((Math.round(deg / 45) * 45) % 360 + 360) % 360;
    btn.textContent = 'wrap: ' + String(d).padStart(3, '0');
    btn.classList.add('on');
    const apply = () => {
      if (window.__setView) window.__setView(d * Math.PI / 180, 0.08);
      else requestAnimationFrame(apply);
    };
    apply();
    return d;
  };
  btn.addEventListener('click', () => { show(dirs[next]); next = (next + 1) % dirs.length; });
  window.__setWrapDirection = show;
  const qa = document.getElementById('clothtexqa');
  const qap = document.getElementById('clothqapanel');
  qa.addEventListener('click', () => { qap.classList.toggle('open'); qa.classList.toggle('on', qap.classList.contains('open')); });
})();
</script>
</body>
</html>
