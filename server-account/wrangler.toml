# its lozenge beside the name, one player's. The same law as the tiers: a
# handle here grants the title and the glyph, and taking it off takes both
# on the next token.
PENITENT_HANDLES = "Diggleborf"
# HERALD (2026-10-01, Mac: "Herald doesnt exist ingame yet" - "you'll need
# to develop the herald title/glyph"): Herald - the azure title and the
# herald's trumpet with its banner beside the name, the Patreon tier
# between Disciple and Hierophant. Its patrons hold it by their pledge
# (PATREON_TIERS below); a handle here grants the title and the glyph by
# name, as every list above does. Empty: nobody by name yet.
HERALD_HANDLES = ""
# AEGIS (2026-10-03, the owner: "For the account named Sureme ... a title,
# glyph and new custom aura for this user. Title: Aegis of Oblivion. Theme:
# Purple"): Aegis of Oblivion - the violet title, the aegis glyph (three
# pillars through a ring over the void's tendrils) and the Oblivion Ward,
# a full ring of violet runes at the feet. The first list that grants an
# AURA as well as a title and a glyph (titles.js TIER_AURA); taking the
# handle off takes all three on the next token.
AEGIS_HANDLES = "Sureme"
# PRIMARCH (2026-10-04, GA00250, relayed by the owner: "the title will be
# Primarch, the color will be that light gold color that you guys use in
# some places in the game menu"; "can the aura be a golden light around the
# character? like i've seen some rare mobs with it"): Primarch - the title
# in the menu's own light gold, the primarch glyph (GA00250's own
# three-barred cross, in the same gold) and the Golden Radiance, a column of
# golden light about the body. The second list that grants an aura (titles.js TIER_AURA);
# taking the handle off takes all three on the next token.
PRIMARCH_HANDLES = "GA00250"
# PATREON-LINK (2026-10-01, Mac: "With patron and having to manually hand
# out titles. Im running into a workflow where its really hard to keep up
# with it"; asked, "Patreon auto-link"): A PATRON'S TITLE FOLLOWS THEIR
# PLEDGE. A registered player presses Link Patreon on the account card,
# and the tier their pledge pays for is a title they hold - upgraded,
# downgraded and lapsed by Patreon's webhook (server-account/src/patreon.js).
#
# PATREON_CLIENT_ID is the Patreon API client's id - not a secret (it is in
# every authorize URL). Mac's client (2026-10-01). The card offers no link
# until the deploy has put the client's secret beside it - empty here is
# off too. The two secrets are NOT here and must never be: the deploy puts
# PATREON_CLIENT_SECRET and PATREON_WEBHOOK_SECRET from the repository's
# own secrets (.github/workflows/account-deploy.yml), as it puts the keys.
PATREON_CLIENT_ID = "xyF8_xJg78YwVgT0xRhs6uhPVeAdOzJu7_dcpaGqvqH-5DNdbLp-gugahtfgH-Ui"
# Which Patreon tier grants which title: "<tier id>:<title>", comma-
# separated, the titles disciple, apostle, herald and hierophant. A tier's id is
# the number in its Join link on the Patreon page (`rid=`). A tier not
# listed grants nothing; changing a line here moves every patron of that
# tier on their next token, with nothing walked.
# Mac's tiers (2026-10-01: "some titles dont have titles/glyphs ingame.
# Heriophant is custom and Herald doesnt exist ingame yet. Supporter doesnt
# recieve a title/glyph"): Disciple (29666211) is mapped, and Herald
# (29666234) since HERALD gave it its title in the game. Supporter
# (29701293) holds none; Hierophant (29666221) is custom, granted by name.
PATREON_TIERS = "29666211:disciple,29666234:herald"

[[d1_databases]]
binding = "DB"
database_name = "daggerfall-accounts"
migrations_dir = "migrations"
# THE ID IS NOT A SECRET, AND IT IS ALSO NOT WRITTEN HERE. Cloudflare
# mints a D1 id when the database is created, so a repo that carries one
# is a repo somebody has to hand-edit the first time this service is
# stood up - and that hand edit was step 1 of a list nobody should have
# to read.
#
# So the deploy RESOLVES it: create the database if it is missing, ask
# Cloudflare for the id, rewrite this one line in the runner's own
# checkout, then run wrangler. Nothing is committed back.
#
# The sentinel below is what the workflow substitutes, so the two are
# one fact in two files - and test/accountdeploy.test.js reads both and
# fails if they ever stop agreeing.
database_id = "resolved-by-account-deploy-workflow"

# IDENTITY_PRIVATE_KEY is NOT here and must never be. It is a secret
# (`wrangler secret put`), and test/accountworker.test.js reads this
# file to make sure nobody ever pastes one in.
#
# IDENTITY_PUBLIC_KEY is not here either, for the opposite reason: it is
# not a secret at all. It is stored the same way only because it is
# minted in the same breath as the private half by a job no person
# watches - and the service hands it to anybody who asks, at /v1/pubkey,
# rather than waiting to be copied into a file by hand.

# ── ACC2: THE SAVE BLOBS ───────────────────────────────────────────
# R2 rather than D1 for one measured reason: a Daggerfall save already
# hits QuotaExceededError in localStorage (systems/save.js handles it by
# name), which puts its size class above D1's practical per-row ceiling
# and above a Worker's JSON body cap. R2 also has no egress fee, which
# matters for a game nobody pays for.
#
# A BUCKET NAME IS NOT AN ID, so unlike the database above there is
# nothing to resolve: the name IS the reference. What the deploy still
# has to do is CREATE it if it is missing, idempotently, exactly as it
# creates the database - ACC1-CI's whole argument (Mac: "The token
# provided allows you to take this on yourself. I am not needed at all")
# applies unchanged, because the same API token does both.
#
# The keys are player-first (server-account/src/service.js saveKey), so
# everything one account holds is a prefix walk.
[[r2_buckets]]
binding = "SAVES"
bucket_name = "daggerfall-saves"
