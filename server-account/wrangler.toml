# ACC1b (2026-09-21): THE ACCOUNT SERVICE. A second Cloudflare Worker
# over D1, deliberately NOT a route on the relay.
#
# WHY TWO WORKERS: a relay deploy restarts every Durable Object and
# drops every connected player. That is a fair price for changing the
# relay's own law and an absurd one for fixing a sign-in button - and
# SLAM8 hashes the RAW BYTES of everything the relay bundles, so the
# price would be charged for a comment. `server/wrangler.toml` carries
# the other half of this note.
#
# THE SEAM BETWEEN THEM IS A SIGNATURE. This service holds the private
# key; the relay holds the public half and can verify but never mint.
#
# ─── THE DEPLOY IS AUTOMATIC, AND SO IS EVERYTHING BEFORE IT ───────
# Mac (2026-09-21): "The token provided allows you to take this on
# yourself. I am not needed at all."
#
# `.github/workflows/account-deploy.yml` does all four steps on every
# push to main that touches this service, with the Cloudflare API token
# read from `secrets.CLOUDFLARE_API_TOKEN`, where it already lives for
# the relay. NOBODY TYPES A CREDENTIAL ANYWHERE. Every step is
# idempotent, so the job is safe to re-run and a deploy that failed is
# retried by the next push instead of silently staying stale:
#
#   1. Create the database if it is not there, then read its id back
#      out of Cloudflare and write it into this file's copy IN THE
#      RUNNER. The id below is a sentinel on purpose - see the binding.
#   2. `wrangler d1 migrations apply`, which keeps its own
#      `d1_migrations` table and so applies each file exactly once, in
#      order. That is why it replaced a pair of `d1 execute --file`
#      lines: 0002 is NOT idempotent (`ALTER TABLE ADD COLUMN` has no
#      IF NOT EXISTS), and "remember to run each one once" is not a
#      property, it is a hope. Now the tool remembers.
#   3. Mint the signing pair, but ONLY IF THERE IS NOT ONE ALREADY -
#      re-minting invalidates every token in flight. Both halves go in
#      from a pipe; neither is echoed, written to a file, or put on a
#      command line.
#   4. Deploy, then verify /v1/health names this deploy - a wrangler
#      exit code of 0 over an unchanged Worker is a green deploy that
#      did not happen.
#
# A DEPLOY HERE DROPS NOBODY. That is the entire point of the split:
# this Worker holds no sockets, so it can be fixed at any hour - which
# is also why this one may fire on a path filter where the relay's
# deploy may not.
name = "daggerfall-accounts"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "a27adccb38c8e8b82fa32e5736274a94"
workers_dev = true

# An uncaught error is logged, not lost - AUDIT ONLINE A17's law, on
# this side too.
[observability]
enabled = true

[vars]
# Answered by /health so a deploy that did not happen cannot look like
# one that did. Kept in step with ACCOUNT_VERSION in src/service.js.
ACCOUNT_VERSION = "acct8"
# The site that may call this. "*" while nothing is live; it is narrowed
# to the real origin before a single account exists.
ALLOWED_ORIGIN = "*"
# ACC3: WHO HOLDS THE DEVELOPER TITLE. A comma-separated list of
# handles, case-folded by server-account/src/titles.js on the way in.
#
# A LIST IN CONFIG AND NOT A COLUMN, because granting one is a thing a
# person does by editing a file that is reviewed and deployed - not by
# reaching into a live database at three in the morning. Taking a
# handle back off this list takes the title off too, on that player's
# next token, because the grant is read fresh every time rather than
# stored anywhere.
#
# EMPTY IS A VALID ANSWER and is what this ships as: nobody holds it
# until a handle is written here. It is not a secret - a title is a
# thing other players are meant to see.
# DEV2 (2026-09-24, Mac: "Give trashBattery, LostMyLeg the developer
# title/glyph"): the list grants the whole developer set - the title,
# the glyph, /red, and /mute and /unmute (titles.js canModerate).
DEVELOPER_HANDLES = "Lattymoy,trashBattery,LostMyLeg"
# MOD1: THE MODERATORS - the blue shield beside the name, and /mute and
# /unmute in chat. Comma-separated handles, case-insensitive, the same
# as the line above; a developer may already moderate without being
# listed here. Asynian is the first (Mac, 2026-09-22: "Username is
# Asynian"). Taking a handle off revokes the shield on the next token
# and the commands on the next call.
MODERATOR_HANDLES = "Asynian"
# TITLE-N (2026-09-24, Mac): the Dungeon Master - the orange title, the
# die beside the name, and /dm's orange line (the relay reads the right
# off the `dm` glyph in the signed token, as /red reads `dev`). "This
# goes strictly to the account SquidKamer."
DUNGEON_MASTER_HANDLES = "SquidKamer"
# TITLE-N: the three Patreon tiers, lowest first - each list grants its
# title and its glyph. Dutchess and Satranath are the first Disciples (Mac); a tier that
# lapses is a handle taken off, gone from that player's next token.
DISCIPLE_HANDLES = "Dutchess,Satranath,Skibbster"
APOSTLE_HANDLES = ""
HIEROPHANT_HANDLES = ""

[[d1_databases]]
binding = "DB"
database_name = "daggerfall-accounts"
migrations_dir = "migrations"
# THE ID IS NOT A SECRET, AND IT IS ALSO NOT WRITTEN HERE. Cloudflare
# mints a D1 id when the database is created, so a repo that carries one
# is a repo somebody has to hand-edit the first time this service is
# stood up - and that hand edit was step 1 of a list nobody should have
# to read.
#
# So the deploy RESOLVES it: create the database if it is missing, ask
# Cloudflare for the id, rewrite this one line in the runner's own
# checkout, then run wrangler. Nothing is committed back.
#
# The sentinel below is what the workflow substitutes, so the two are
# one fact in two files - and test/accountdeploy.test.js reads both and
# fails if they ever stop agreeing.
database_id = "resolved-by-account-deploy-workflow"

# IDENTITY_PRIVATE_KEY is NOT here and must never be. It is a secret
# (`wrangler secret put`), and test/accountworker.test.js reads this
# file to make sure nobody ever pastes one in.
#
# IDENTITY_PUBLIC_KEY is not here either, for the opposite reason: it is
# not a secret at all. It is stored the same way only because it is
# minted in the same breath as the private half by a job no person
# watches - and the service hands it to anybody who asks, at /v1/pubkey,
# rather than waiting to be copied into a file by hand.

# ── ACC2: THE SAVE BLOBS ───────────────────────────────────────────
# R2 rather than D1 for one measured reason: a Daggerfall save already
# hits QuotaExceededError in localStorage (systems/save.js handles it by
# name), which puts its size class above D1's practical per-row ceiling
# and above a Worker's JSON body cap. R2 also has no egress fee, which
# matters for a game nobody pays for.
#
# A BUCKET NAME IS NOT AN ID, so unlike the database above there is
# nothing to resolve: the name IS the reference. What the deploy still
# has to do is CREATE it if it is missing, idempotently, exactly as it
# creates the database - ACC1-CI's whole argument (Mac: "The token
# provided allows you to take this on yourself. I am not needed at all")
# applies unchanged, because the same API token does both.
#
# The keys are player-first (server-account/src/service.js saveKey), so
# everything one account holds is a prefix walk.
[[r2_buckets]]
binding = "SAVES"
bucket_name = "daggerfall-saves"
