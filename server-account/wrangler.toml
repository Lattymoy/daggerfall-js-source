# ACC1b (2026-09-21): THE ACCOUNT SERVICE. A second Cloudflare Worker
# over D1, deliberately NOT a route on the relay.
#
# WHY TWO WORKERS: a relay deploy restarts every Durable Object and
# drops every connected player. That is a fair price for changing the
# relay's own law and an absurd one for fixing a sign-in button - and
# SLAM8 hashes the RAW BYTES of everything the relay bundles, so the
# price would be charged for a comment. `server/wrangler.toml` carries
# the other half of this note.
#
# THE SEAM BETWEEN THEM IS A SIGNATURE. This service holds the private
# key; the relay holds the public half and can verify but never mint.
#
# ─── THE DEPLOY IS AUTOMATIC, AND SO IS EVERYTHING BEFORE IT ───────
# Mac (2026-09-21): "The token provided allows you to take this on
# yourself. I am not needed at all."
#
# `.github/workflows/account-deploy.yml` does all four steps on every
# push to main that touches this service, with the Cloudflare API token
# read from `secrets.CLOUDFLARE_API_TOKEN`, where it already lives for
# the relay. NOBODY TYPES A CREDENTIAL ANYWHERE. Every step is
# idempotent, so the job is safe to re-run and a deploy that failed is
# retried by the next push instead of silently staying stale:
#
#   1. Create the database if it is not there, then read its id back
#      out of Cloudflare and write it into this file's copy IN THE
#      RUNNER. The id below is a sentinel on purpose - see the binding.
#   2. `wrangler d1 migrations apply`, which keeps its own
#      `d1_migrations` table and so applies each file exactly once, in
#      order. That is why it replaced a pair of `d1 execute --file`
#      lines: 0002 is NOT idempotent (`ALTER TABLE ADD COLUMN` has no
#      IF NOT EXISTS), and "remember to run each one once" is not a
#      property, it is a hope. Now the tool remembers.
#   3. Mint the signing pair, but ONLY IF THERE IS NOT ONE ALREADY -
#      re-minting invalidates every token in flight. Both halves go in
#      from a pipe; neither is echoed, written to a file, or put on a
#      command line.
#   4. Deploy, then verify /v1/health names this deploy - a wrangler
#      exit code of 0 over an unchanged Worker is a green deploy that
#      did not happen.
#
# A DEPLOY HERE DROPS NOBODY. That is the entire point of the split:
# this Worker holds no sockets, so it can be fixed at any hour - which
# is also why this one may fire on a path filter where the relay's
# deploy may not.
name = "daggerfall-accounts"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "a27adccb38c8e8b82fa32e5736274a94"
workers_dev = true

# An uncaught error is logged, not lost - AUDIT ONLINE A17's law, on
# this side too.
[observability]
enabled = true

# SCALE1 (2026-09-30, the scaling audit): EVERY REQUEST COUNTED - route,
# method, status, a refusal's word, wall ms and the D1 statements it ran
# - to Workers Analytics Engine (src/metrics.js says what each field is
# and how to query it). The dataset is created by its first write; no
# player is identified in any point. A Worker without the binding serves
# exactly as before.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "daggerfall_accounts"

# SCALE1: SMART PLACEMENT. A request here makes its D1 round trips one
# after another - a checkpoint seven, a harvest up to seventeen, a
# market read about twenty - and each pays the distance between the
# Worker and the database. Cloudflare runs the Worker where that sum is
# least (near the database) once it has seen the traffic; a Worker with
# no bindings to reach would stay at the edge.
[placement]
mode = "smart"

[vars]
# Answered by /health so a deploy that did not happen cannot look like
# one that did. Kept in step with ACCOUNT_VERSION in src/service.js.
ACCOUNT_VERSION = "acct82"
# WB5b: THE RELAY'S PUBLIC HALF, GATE_PUBLIC_KEY - the key an Oblivion
# Gate's kill receipts verify with (src/net/gateReceipt.js) - is NOT a
# var here. GATE-KEYS (2026-09-26): the account deploy mints the pair
# once (.github/workflows/account-deploy.yml, "Mint the gate receipt
# pair") and puts this half as a SECRET on this Worker, the private one,
# GATE_SIGNING_KEY, on the relay's. A key that can only verify hides
# nothing, but a var is rewritten from this file by every deploy, the
# job cannot commit one, and Cloudflare refuses a secret the name of a
# bound var - so no line here may name it. WB5b's empty var sat here
# unminted, and no gate kill was ever counted. Unset is still a legal
# state: every claim is declined (`no-gate-key`), and the client keeps
# its receipts for the week they carry.
# The site that may call this. "*" while nothing is live; it is narrowed
# to the real origin before a single account exists.
ALLOWED_ORIGIN = "*"
# ACC3: WHO HOLDS THE DEVELOPER TITLE. A comma-separated list of
# handles, case-folded by server-account/src/titles.js on the way in.
#
# A LIST IN CONFIG AND NOT A COLUMN, because granting one is a thing a
# person does by editing a file that is reviewed and deployed - not by
# reaching into a live database at three in the morning. Taking a
# handle back off this list takes the title off too, on that player's
# next token, because the grant is read fresh every time rather than
# stored anywhere.
#
# EMPTY IS A VALID ANSWER and is what this ships as: nobody holds it
# until a handle is written here. It is not a secret - a title is a
# thing other players are meant to see.
# DEV2 (2026-09-24, Mac: "Give trashBattery, LostMyLeg the developer
# title/glyph"): the list grants the whole developer set - the title,
# the glyph, /red, and /mute and /unmute (titles.js canModerate).
# DEV3 (2026-09-26, Mac: "grant Tabby the developer title/glyph"): the
# fourth, with the same whole set.
DEVELOPER_HANDLES = "Lattymoy,trashBattery,LostMyLeg,Tabby"
# MOD1: THE MODERATORS - the blue shield beside the name, and /mute and
# /unmute in chat. Comma-separated handles, case-insensitive, the same
# as the line above; a developer may already moderate without being
# listed here. Asynian is the first (Mac, 2026-09-22: "Username is
# Asynian"). Taking a handle off revokes the shield on the next token
# and the commands on the next call.
# MOD2 (2026-10-02, Mac: "give tabbyvish the moderator title/glyph for
# ingame"): the second, with the same shield and commands. MOD3 (same
# day, Mac: "Also add Starempire42 as a moderator"): the third.
MODERATOR_HANDLES = "Asynian,tabbyvish,Starempire42"
# TITLE-N (2026-09-24, Mac): the Dungeon Master - the orange title, the
# die beside the name, and /dm's orange line (the relay reads the right
# off the `dm` glyph in the signed token, as /red reads `dev`). "This
# goes strictly to the account SquidKamer."
DUNGEON_MASTER_HANDLES = "SquidKamer"
# TITLE-N: the three Patreon tiers, lowest first - each list grants its
# title and its glyph. Dutchess and Satranath are the first Disciples (Mac); a tier that
# lapses is a handle taken off, gone from that player's next token.
# PATREON-LINK (2026-10-01): a patron no longer needs a line here - they
# link their own Patreon from the account card, and PATREON_TIERS below
# grants the tier their pledge pays for. These lists stay for the titles
# Mac grants by name (a comp, a patron who will not link).
# 2026-09-26, Mac: "Grant Flylighter the disciple title/glyph".
# 2026-09-29, Mac: "Add valenvalarys as a disciple ingame".
DISCIPLE_HANDLES = "Dutchess,Satranath,Skibbster,Flylighter,valenvalarys"
# 2026-09-25, Mac: "Add SirMcMobdon as an Apostle ingame title/glyph";
# 2026-09-26, Mac: "SirMcMobdon gets a brand new title/glyph. Remove them
# from Apostle" - the list is empty again, and the grant is the line below.
APOSTLE_HANDLES = ""
HIEROPHANT_HANDLES = ""
# SHADOW-FANG (2026-09-26, Mac): Shadow Fang - the black-and-crimson title,
# the wolf's-head glyph beside the name and the werewolf's own skin, one
# player's. The same law as the tiers: a handle here grants the title and
# the glyph, and taking it off takes both on the next token. SHADOW-CLOAK
# (2026-10-04, the owner: "I want to build a new unique AURA specifically
# for his account. A holo shadow cloak with red accents"): and the Holo
# Shadow Cloak - the third list that grants an aura (titles.js TIER_AURA);
# taking the handle off takes it too.
SHADOW_FANG_HANDLES = "SirMcMobdon"
# MARKS1 (PROF0 20): Marks open by this switch - "off", "dev" (the DEVELOPER_HANDLES alone) or "on". Shipped at "dev":
# the currency is struck and spent by the developers first, and opened to everyone by this one line.
# SWITCH-ON (2026-09-29, Mac: "Fuck it lets switch everything on"): "on" - Marks are everyone's.
MARKS_OPEN = "on"
# NOTICE1 (PROF0 20): the Notice Board by this switch - "off", "dev" (the DEVELOPER_HANDLES alone) or "on". Shipped
# at "dev": the developers read and pin first; everyone else's rumour boards stayed DFU's until this line said "on".
# BOARD-ON (2026-09-29, Mac's choice: "Board now, rest after fixes"): "on" - the board is everyone's; its Work and
# Market tabs stay the professions' and the Marks' (a tab shows only while PROFESSIONS_OPEN and MARKS_OPEN let the
# account in), so they open with those two lines below.
BOARD_OPEN = "on"
# PROF1 (PROF0 20): the professions by this switch - "off", "dev" (the DEVELOPER_HANDLES alone) or "on". Shipped at
# "dev": the developers gather, store and fill Court writs first; opened to everyone by this one line.
# SWITCH-ON (2026-09-29, Mac: "Fuck it lets switch everything on"): "on" - the professions and, with Marks and the
# board, the market are everyone's, after PROF-SAVE and PROF-DELETE.
PROFESSIONS_OPEN = "on"
# SEAT1a (SEAT0 18: "The account service's config gains SEATS_OPEN (off, dev, on). At dev only accounts with the dev
# glyph see seats, so each slice is played on the live servers before anyone else sees it"): the seats by this switch.
# Shipped at "dev": the developers witness the seats, see the map's rings and the arrival lines first; opened to
# everyone by this one line.
SEATS_OPEN = "on"
# SEASON1 (SEAT0 9.1, 18): the seat week Season 0 - the four-week open beta - begins (townSeatLaw.js seasonOf); 8-week
# Seasons follow, each ending at its last Turning with its titles and the soft reset, and Season 0's end wipes the seats.
# Empty: no Season is counted (every once-a-Season rule keeps its 8-week stand-in). Set it, to a week not yet past, when
# the seats open to everyone - never move it once a Season has begun.
SEASON_ZERO_WEEK = "2"
# PENITENT (2026-09-29, Mac: "This new custom title/glyph is for the user
# Diggleborf", whose ask it is: "Looking to do a Trinimac themed one, so
# maybe "Penitent" for the title starting gold and ending a sky blue", with
